/* ---------- Aufheben ---------- */
function heben(id){
  var i = G.gehoben.indexOf(id);
  if (i >= 0) G.gehoben.splice(i, 1);
  else {
    if (!G.spieler[0].aus && !warInHand(tileById(id) || {})){
      meldung('Erst rauskommen – dann darfst du den Tisch umbauen.', 3400);
      summ(30); return false;
    }
    G.gehoben.push(id);
  }
renderAll(); return true;
}

/* ---------- Hinlegen ---------- */
function hinlegen(ziel, sid, pos){
  var steine = hochSteine();
  if (!steine.length) return false;
  if (ziel === 'satz'){
    var zs = null, w;
    for (w=0;w<G.saetze.length;w++) if (G.saetze[w].id === sid) zs = G.saetze[w];
    if (zs && !darfAnlegen(zs)){ nichtAnlegen(); return false; }
  }
  if (ziel === 'hand'){
    for (var q=0;q<steine.length;q++) if (!warInHand(steine[q])){
      meldung(steine[q].j ? 'Teddi darf nicht auf die Hand – er muss auf den Tisch.'
                          : 'Steine vom Tisch können nicht auf die Hand.', 3600);
      summ(30); return false;
    }
  }
  merken();
  var m = rasterMass(), neuPlatz = G.neuPlatz;
  var behalten = {}, vorrang = [];
  steine.forEach(function(t){ behalten[t.id] = 1; });
  /* aus allen Quellen loesen - und wo aus der Mitte genommen wurde, teilen */
  G.spieler[0].hand = G.spieler[0].hand.filter(function(t){ return !behalten[t.id]; });
  var liste = [];
  G.saetze.forEach(function(st){
    var teile = (ziel === 'satz' && st.id === sid) ? null : teilstuecke(st.tiles, behalten);
    if (!teile){
      st.tiles = st.tiles.filter(function(t){ return !behalten[t.id]; });
      liste.push(st); return;
    }
    st.tiles = teile[0]; liste.push(st); vorrang.push(st.id);
    var x = st.x;
    for (var k=1;k<teile.length;k++){
      x = x == null ? null : x + satzBreite(teile[k-1].length);
      var stueck = { id:setId++, tiles:teile[k], x:x, y:st.y };
      liste.push(stueck); vorrang.push(stueck.id);
    }
  });
  G.saetze = liste;
  saetzeAufraeumen();
  if (ziel === 'neu'){
    var w = satzBreite(steine.length);
    var platz = pos ? naechsterPlatz(pos.x, pos.y, w, null, m) : neuPlatz;
    var ns = { id:setId++, tiles:steine, x: platz ? platz.x : null, y: platz ? platz.y : null };
    G.saetze.push(ns); vorrang.unshift(ns.id);
    nachTeilen(ns, G.saetze, vorrang);
  } else if (ziel === 'satz'){
    var st = satzById(sid);
    if (!st){ G.saetze.push({ id:setId++, tiles:steine }); }
    else {
      st.tiles = st.tiles.concat(steine); vorrang.unshift(st.id);
      nachTeilen(st, G.saetze, vorrang);
    }
  } else {
    G.spieler[0].hand = G.spieler[0].hand.concat(steine);
    if (cfg.sortMode !== 'm') sortHand(cfg.sortMode);
    handReiheSichern();
  }
  G.gehoben = [];
  G.fixSaetze = vorrang;
  saetzeOrdnen();
  summ(12); renderAll();
  return true;
}

function nichtAnlegen(){
  meldung('Zum Rauskommen brauchst du ' + G.minOut + ' Punkte aus eigenen Sätzen – '+
          'an fremde Sätze darfst du erst danach anlegen.', 4600);
  summ(30);
}

/* ---------- Tippen ---------- */
function tippen(e){
  if (!amZug()) return;
  var node = e.target, ziel = null;
  while (node && node !== document.body){
    if (node.classList){
      if (node.classList.contains('t')){ ziel = { was:'stein', node:node }; break; }
      if (node.id === 'neuSatz'){ ziel = { was:'neu' }; break; }
      if (node.id === 'platz') { node = node.parentNode; continue; }
      if (node.classList.contains('satzbox')){ ziel = { was:'satz', node:node }; break; }
      if (node.id === 'tableframe' || node.id === 'table'){ ziel = { was:'flaeche' }; break; }
      if (node.id === 'hand' || node.id === 'handbar'){ ziel = { was:'hand' }; break; }
    }
    node = node.parentNode;
  }
  if (!ziel) return;
  if (e.cancelable) e.preventDefault();

  if (ziel.was === 'stein'){
    var id = parseInt(ziel.node.getAttribute('data-id'), 10);
    return heben(id);
  }
  if (ziel.was === 'satz'){
    if (ziel.node.classList.contains('zu')){ if (G.gehoben.length) nichtAnlegen(); return; }
    return hinlegen('satz', parseInt(ziel.node.getAttribute('data-set'),10));
  }
  if (ziel.was === 'neu' || ziel.was === 'flaeche'){
    if (!G.gehoben.length){
      if (ziel.was === 'flaeche') meldung('Erst Steine antippen, dann hierher legen.', 3000);
      return;
    }
    if (ziel.was === 'flaeche' && e.clientX != null)
      return hinlegen('neu', null, rasterVon(e.clientX, e.clientY, false));
    return hinlegen('neu');
  }
  if (ziel.was === 'hand'){
    if (!G.gehoben.length) return;
    return hinlegen('hand');
  }
}

/* ==================================================================
   Ziehen und Fallenlassen
   ------------------------------------------------------------------
   Ein Stein laesst sich auch direkt an seinen Platz ziehen. Ist er
   Teil der aufgehobenen Steine, wandert die ganze Auswahl mit.
   Ein Zug innerhalb der eigenen Hand ordnet nur um.
   ================================================================== */
var tapEvt  = window.PointerEvent ? 'pointerdown' : 'mousedown';
var moveEvt = window.PointerEvent ? 'pointermove' : 'mousemove';
var upEvt   = window.PointerEvent ? 'pointerup'   : 'mouseup';
var greif = null;

function zeigerXY(e){
  if (e.touches && e.touches[0])               return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches[0]) return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY };
  return { x:e.clientX, y:e.clientY };
}
function steinNode(node){
  while (node && node !== document.body && !(node.classList && node.classList.contains('t')))
    node = node.parentNode;
  return (node && node.classList && node.classList.contains('t')) ? node : null;
}
function inHand(node){ return node && node.parentNode === $hand; }

function griffNode(node){
  while (node && node !== document.body && !(node.classList && node.classList.contains('griff')))
    node = node.parentNode;
  return (node && node.classList && node.classList.contains('griff')) ? node : null;
}
function greifStart(e){
  if (!amZug()) return;
  if (e.pointerType === 'mouse' && e.button != null && e.button !== 0) return;
  var gr = griffNode(e.target);
  if (gr){
    var box = gr.parentNode, rb = box.getBoundingClientRect(), pp = zeigerXY(e);
    greif = { satz: parseInt(box.getAttribute('data-set'), 10), x0:pp.x, y0:pp.y, zieht:false,
              ox: pp.x - rb.left, oy: pp.y - rb.top };
    return;
  }
  var node = steinNode(e.target);
  if (!node) return;
  var p = zeigerXY(e);
  greif = {
    id: parseInt(node.getAttribute('data-id'), 10),
    ausHand: inHand(node), x0:p.x, y0:p.y, zieht:false, sortiert:false
  };
}
function geistBauen(steine){
  var s = '', i;
  for (i=0;i<steine.length;i++) s += tileHtml(steine[i], '');
  $geist.innerHTML = s.replace(/ hoch/g, '');
  $geist.className = 'an';
}
function geistWeg(){ $geist.className = ''; $geist.innerHTML = ''; $geist.style.left = ''; $geist.style.top = ''; }
/* Gestrichelter Rahmen dort, wo etwas landen wird */
function platzZeigen(q, n, m){
  var pl = el('platz');
  if (!pl){ pl = document.createElement('div'); pl.id = 'platz'; $table.appendChild(pl); }
  pl.style.left = (RAND + q.x*m.u) + 'px';
  pl.style.top  = (RAND + q.y*m.v) + 'px';
  pl.style.width  = boxPixel(n, m) + 'px';
  pl.style.height = (Math.round(m.T*1.34) + 10) + 'px';
}
function platzWeg(){ var pl = el('platz'); if (pl) pl.parentNode.removeChild(pl); }

/* ---------- einen ganzen Satz verschieben ---------- */
function satzZieh(e){
  var p = zeigerXY(e);
  if (!greif.zieht){
    if (Math.abs(p.x - greif.x0) + Math.abs(p.y - greif.y0) < 8) return;
    var st0 = satzById(greif.satz);
    if (!st0){ greif = null; return; }
    greif.zieht = true;
    document.body.classList.add('ordne');
    var sh = '';
    st0.tiles.forEach(function(t){ sh += tileHtml(t, ''); });
    $geist.innerHTML = '<div class="set">' + sh.replace(/ hoch/g, '') + '</div>';
    $geist.className = 'an satz';
    var box = $table.querySelector('.satzbox[data-set="' + greif.satz + '"]');
    if (box) box.classList.add('wandert');
  }
  if (e.cancelable) e.preventDefault();
  var m = rasterMass(), st = satzById(greif.satz);
  var links = p.x - greif.ox, oben = p.y - greif.oy;
  $geist.style.left = (links + m.T*.56 + 2) + 'px';
  $geist.style.top  = oben + 'px';
  randScroll(p.y);

  /* Liegt der Finger auf einem anderen Satz, heisst Loslassen: verbinden. */
  var z = zielUnter(p.x, p.y), tid = null;
  if (z && (z.was === 'satz' || z.was === 'zu') && z.node){
    tid = parseInt(z.node.getAttribute('data-set'), 10);
    if (tid === greif.satz) tid = null;
  }
  verbindenMarkieren(null);
  if (tid != null){
    var pr = verbindenPruefen(st, satzById(tid));
    greif.verbinden = { id:tid, ok:pr.ok, grund:pr.grund };
    greif.platz = null; platzWeg();
    verbindenMarkieren(z.node, pr.ok);
    G.ziehHinweis = pr.ok ? { t:'Loslassen: die beiden Sätze werden verbunden', k:'gut' }
                  : pr.grund === 'vorRaus'
                    ? { t:'Vor dem Rauskommen kannst du nur deine eigenen neuen Sätze verbinden', k:'warn' }
                    : { t:'Diese beiden Sätze ergeben zusammen keinen gültigen Satz', k:'warn' };
    renderStatus();
    return;
  }
  greif.verbinden = null;
  if (G.ziehHinweis){ G.ziehHinweis = null; renderStatus(); }
  var roh = rasterVon(links, oben, true);
  greif.platz = naechsterPlatz(roh.x, roh.y, satzBreite(st), st.id, m);
  platzZeigen(greif.platz, st.tiles.length, m);
}
/* Zwei Saetze verbinden - geht, wenn zusammen ein gueltiger Satz entsteht.
   Vor dem Rauskommen nur mit eigenen, in diesem Zug gelegten Saetzen. */
function verbindenPruefen(a, b){
  if (!a || !b) return { ok:false, grund:'passt' };
  if (!darfAnlegen(a) || !darfAnlegen(b)) return { ok:false, grund:'vorRaus' };
  var alle = a.tiles.concat(b.tiles);
  return (alle.length <= 13 && checkSet(alle).ok) ? { ok:true } : { ok:false, grund:'passt' };
}
function verbindenMarkieren(node, ok){
  var alt = $table.querySelectorAll('.satzbox.ziel, .satzbox.nein'), i;
  for (i=0;i<alt.length;i++){ alt[i].classList.remove('ziel'); alt[i].classList.remove('nein'); }
  if (node) node.classList.add(ok ? 'ziel' : 'nein');
}

function zielUnter(x, y){
  $geist.style.visibility = 'hidden';
  var n = document.elementFromPoint(x, y);
  $geist.style.visibility = '';
  while (n && n !== document.body){
    if (n.classList){
      if (n.id === 'neuSatz') return { was:'neu', node:n };
      if (n.classList.contains('satzbox'))
        return n.classList.contains('zu')
          ? { was:'zu', node:n }
          : { was:'satz', sid:parseInt(n.getAttribute('data-set'),10), node:n };
      if (n.id === 'hand' || n.id === 'handbar' || n.classList.contains('t') && inHand(n))
                                          return { was:'hand', node:$handbar };
      if (n.id === 'tableframe' || n.id === 'table') return { was:'neu', node:null };
    }
    n = n.parentNode;
  }
  return null;
}
function zielMarkieren(z){
  var alt = $frame.querySelectorAll('.ziel'), i;
  for (i=0;i<alt.length;i++) alt[i].classList.remove('ziel');
  $handbar.classList.remove('ziel');
  if (!z || z.was === 'zu') return;
  if (z.was === 'hand') $handbar.classList.add('ziel');
  else if (z.node) z.node.classList.add('ziel');
  else { var nn = el('neuSatz'); if (nn) nn.classList.add('ziel'); }
}

/* Zieht der Finger einen Stein oder Satz an den oberen oder unteren Rand des
   Tisches, rollt der Tisch von allein weiter - sonst kommt man beim Ziehen
   nicht an Sätze heran, die gerade nicht zu sehen sind. */
var randLauf = null;
function randScroll(y){
  var r = $frame.getBoundingClientRect(), zone = 70, v = 0;
  if (y < r.top + zone)         v = -Math.ceil((r.top + zone - y) / 5);
  else if (y > r.bottom - zone) v =  Math.ceil((y - (r.bottom - zone)) / 5);
  v = Math.max(-18, Math.min(18, v));
  if (!v) return randScrollStop();
  if (randLauf){ randLauf.v = v; return; }
  randLauf = { v:v };
  randLauf.id = setInterval(function(){ $frame.scrollTop += randLauf.v; }, 16);
}
function randScrollStop(){ if (randLauf){ clearInterval(randLauf.id); randLauf = null; } }

function rollbar(){ return $frame.scrollHeight > $frame.clientHeight + 2; }

function greifZieh(e){
  if (!greif) return;
  if (greif.satz != null) return satzZieh(e);
  var p = zeigerXY(e), dx = p.x - greif.x0, dy = p.y - greif.y0;
  /* Senkrecht über einen liegenden Stein wischen heisst rollen, nicht ziehen.
     Sonst reisst man beim Scrollen dauernd Steine aus fertigen Sätzen. */
  if (greif.rollt){
    $frame.scrollTop = greif.sy - dy;
    if (e.cancelable) e.preventDefault();
    return;
  }
  if (!greif.zieht){
    if (Math.abs(dx) + Math.abs(dy) < 12) return;
    if (!greif.ausHand && Math.abs(dy) > Math.abs(dx) * 1.4 && rollbar()){
      greif.rollt = true; greif.sy = $frame.scrollTop;
      $frame.scrollTop = greif.sy - dy;
      if (e.cancelable) e.preventDefault();
      return;
    }
    greif.zieht = true;
    document.body.classList.add('ordne');
    /* Ein Handstein faengt als Umsortieren an. Sobald der Finger den Tisch
       erreicht, wird daraus ein Hinlegen - das entscheidet das Ziel, nicht
       der Startpunkt. */
    greif.sortiert = greif.ausHand && !G.gehoben.length;
    if (!greif.sortiert && !aufheben_fuersZiehen()) return;
  }
  if (e.cancelable) e.preventDefault();

  var z = zielUnter(p.x, p.y);
  if (greif.sortiert){
    if (z && z.was !== 'hand'){
      greif.sortiert = false;
      if (!aufheben_fuersZiehen()) return;
    } else {
      return handUmsortieren(p);
    }
  }
  $geist.style.left = p.x + 'px';
  $geist.style.top  = p.y + 'px';
  randScroll(p.y);
  zielMarkieren(z);
  /* ueber freier Flaeche: zeigen, wo der neue Satz landet */
  if (z && z.was === 'neu' && !z.node){
    var m = rasterMass();
    greif.roh = rasterVon(p.x, p.y, false);
    platzZeigen(naechsterPlatz(greif.roh.x, greif.roh.y, satzBreite(G.gehoben.length), null, m),
                G.gehoben.length, m);
  } else { greif.roh = null; platzWeg(); }
}
/* Den gegriffenen Stein in die Auswahl holen und den Geist bauen.
   Gibt false zurueck, wenn das (noch) nicht erlaubt ist. */
function aufheben_fuersZiehen(){
  if (!istHoch(greif.id)){
    if (!G.spieler[0].aus && !warInHand(tileById(greif.id) || {})){
      greif = null;
      document.body.classList.remove('ordne');
      meldung('Erst rauskommen – dann darfst du den Tisch umbauen.', 3400);
      return false;
    }
    G.gehoben.push(greif.id);
    renderAll();
  }
  geistBauen(hochSteine());
  return true;
}
function handUmsortieren(p){
  var h = G.spieler[0].hand, von = -1, i;
  for (i=0;i<h.length;i++) if (h[i].id === greif.id){ von = i; break; }
  if (von < 0) return;
  var kinder = $hand.children, ziel = h.length;
  for (i=0;i<kinder.length;i++){
    var r = kinder[i].getBoundingClientRect();
    if (p.y < r.top - 4){ ziel = i; break; }
    if (p.y > r.bottom + 4) continue;
    if (p.x < r.left + r.width/2){ ziel = i; break; }
    ziel = i + 1;
  }
  if (ziel > von) ziel--;
  ziel = Math.max(0, Math.min(h.length - 1, ziel));
  if (ziel === von) return;
  h.splice(ziel, 0, h.splice(von, 1)[0]);
  renderHand();
  var nn = $hand.querySelector('[data-id="' + greif.id + '"]');
  if (nn) nn.classList.add('greif');
}
function greifEnde(e){
  randScrollStop();
  if (!greif) return;
  var g = greif; greif = null;
  if (g.rollt) return;                 /* war nur ein Rollen, kein Zug */
  document.body.classList.remove('ordne');
  platzWeg();
  if (g.satz != null){
    geistWeg();
    if (!g.zieht){
      var bx = $table.querySelector('.satzbox[data-set="' + g.satz + '"]');
      if (bx) tippen({ target:bx, cancelable:false });
      return;
    }
    G.ziehHinweis = null;
    if (g.verbinden){
      if (!g.verbinden.ok){
        if (g.verbinden.grund === 'vorRaus') nichtAnlegen();
        else meldung('Diese beiden Sätze ergeben zusammen keinen gültigen Satz.', 3400);
        summ(30); renderAll(); return;
      }
      /* Das ist ein echter Umbau - also ein Schritt, den "Zurück" kennt. */
      merken();
      var weg = satzById(g.satz), bleibt = satzById(g.verbinden.id);
      bleibt.tiles = bleibt.tiles.concat(weg.tiles);
      G.saetze = G.saetze.filter(function(o){ return o !== weg; });
      G.fixSaetze = [bleibt.id];
      saetzeOrdnen(); summ(14); renderAll();
      return;
    }
    var st = satzById(g.satz);
    if (st && g.platz){ st.x = g.platz.x; st.y = g.platz.y; G.fixSaetze = [st.id]; }
    summ(8); renderAll();
    return;
  }
  if (!g.zieht){
    tippen({ target: $hand.querySelector('[data-id="'+g.id+'"]') ||
                     $table.querySelector('[data-id="'+g.id+'"]'), cancelable:false });
    return;
  }
  if (g.sortiert){
    if (cfg.sortMode !== 'm'){ cfg.sortMode = 'm'; saveCfg(); }
    handReiheSichern(); summ(8); knoepfe();
    return;
  }
  var p = zeigerXY(e), z = zielUnter(p.x, p.y);
  geistWeg(); zielMarkieren(null);
  if (!z){ renderAll(); return; }
  if (z.was === 'zu'){ nichtAnlegen(); renderAll(); return; }
  if (z.was === 'hand') hinlegen('hand');
  else if (z.was === 'satz') hinlegen('satz', z.sid);
  else hinlegen('neu', null, z.node ? null : rasterVon(p.x, p.y, false));
}
$frame.addEventListener(tapEvt, greifStart, {passive:true});
$hand.addEventListener(tapEvt, greifStart, {passive:true});
document.addEventListener(moveEvt, greifZieh, {passive:false});
document.addEventListener(upEvt, greifEnde, {passive:true});
if (window.PointerEvent) document.addEventListener('pointercancel', greifEnde, {passive:true});
if (!window.PointerEvent){
  $frame.addEventListener('touchstart', greifStart, {passive:true});
  $hand.addEventListener('touchstart', greifStart, {passive:true});
  document.addEventListener('touchmove', greifZieh, {passive:false});
  document.addEventListener('touchend', greifEnde, {passive:true});
}
/* Tippen auf alles, was kein Stein ist (Ablegefelder, freie Flaeche, Hand) */
var tippStart = null;
el('wrap').addEventListener(tapEvt, function(e){
  tippStart = null;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var p = e.target;
  while (p && p !== document.body){ if (p.tagName === 'BUTTON') return; p = p.parentNode; }
  if (steinNode(e.target) || griffNode(e.target)) return;   /* laufen ueber greifStart/greifEnde */
  var z = zeigerXY(e);
  tippStart = { target:e.target, x:z.x, y:z.y, t:Date.now() };
}, {passive:true});
/* Der Tipp zaehlt erst beim Loslassen - und nur, wenn der Finger ruhig lag.
   Sonst waehlt man beim Wischen oder Abstuetzen versehentlich etwas aus. */
el('wrap').addEventListener(upEvt, function(e){
  var s = tippStart; tippStart = null;
  if (!s) return;
  var z = zeigerXY(e);
  if (Math.abs(z.x - s.x) + Math.abs(z.y - s.y) > 12) return;
  if (Date.now() - s.t > 900) return;
  tippen({ target:s.target, clientX:z.x, clientY:z.y, cancelable:false });
}, {passive:true});

/* ---------- Sortieren ---------- */
function sortHand(modus){
  G.spieler[0].hand.sort(function(a,b){
    if (a.j !== b.j) return a.j ? 1 : -1;   /* Teddi ans Ende */
    if (a.j) return 0;
    if (modus === 'c') return (a.c - b.c) || (a.n - b.n);
    return (a.n - b.n) || (a.c - b.c);
  });
}
/* Reihenfolge von `arr` an die von `ref` angleichen (Vergleich ueber die id). */
function ordneNach(arr, ref){
  var pos = {}; ref.forEach(function(t,i){ pos[t.id] = i; });
  return arr.slice().sort(function(a,b){
    var pa = (a.id in pos) ? pos[a.id] : 9999, pb = (b.id in pos) ? pos[b.id] : 9999;
    return pa - pb;
  });
}
/* Die Handreihenfolge in alle Rueckschritte durchschreiben, damit sie
   beim Zuruecknehmen oder Ziehen nicht zurueckspringt. */
function handReiheSichern(){
  var ref = G.spieler[0].hand;
  if (G.zugStart) G.zugStart.hand = ordneNach(G.zugStart.hand, ref);
  for (var i=0;i<G.undo.length;i++) G.undo[i].hand = ordneNach(G.undo[i].hand, ref);
}
function sortiere(modus){
  cfg.sortMode = modus; saveCfg();
  if (modus !== 'm') sortHand(modus);
  handReiheSichern();
renderAll();
  if (modus === 'm') meldung('Steine frei anordnen – zum Verschieben ziehen.', 3400, 'gut');
}
/* Einen frisch gezogenen Stein an die passende Stelle setzen. */
function einsortieren(t){
  var h = G.spieler[0].hand;
  if (cfg.sortMode === 'm'){ h.push(t); return; }
  var i, platz = h.length;
  for (i=0;i<h.length;i++){
    var a = h[i];
    if (a.j) { platz = i; break; }            /* vor die Teddis */
    var vor = (cfg.sortMode === 'c')
      ? (a.c > t.c || (a.c === t.c && a.n > t.n))
      : (a.n > t.n || (a.n === t.n && a.c > t.c));
    if (vor){ platz = i; break; }
  }
  if (t.j) platz = h.length;
  h.splice(platz, 0, t);
}

/* ==================================================================
   Zug abschliessen
   ================================================================== */
function zugPruefen(){
  if (G.gehoben.length) return { ok:false, txt:'Du hältst noch Steine in der Hand – leg sie ab.' };
  if (!alleSaetzeGut()) return { ok:false, txt:'Ein Satz auf dem Tisch stimmt noch nicht (roter Rahmen).' };
  var gelegt = zugGelegt();
  if (!gelegt.length) return { ok:false, txt:'Du hast keinen eigenen Stein abgelegt.' };
  if (!G.spieler[0].aus){
    var e = ersteAuslagePunkte();
    if (!e.rein) return { ok:false, txt:'Beim ersten Mal nur eigene Steine – noch nicht anlegen oder umbauen.' };
    if (e.pts < G.minOut) return { ok:false, txt:'Zum Rauskommen brauchst du ' + G.minOut + ' Punkte, du hast ' + e.pts + '.' };
  }
  return { ok:true };
}
function spielen(){
  if (!amZug()) return;
  var gelegt = zugGelegt();
  if (!gelegt.length && !G.gehoben.length) return ziehen();
  var p = zugPruefen();
  if (!p.ok){ meldung(p.txt, 5000); summ([20,40,20]);return; }
  if (!G.spieler[0].aus){ G.spieler[0].aus = true; }

  G.passen = 0;
  G.undo = [];
  if (!G.spieler[0].hand.length) return ende(0);
  naechster();
}
function ziehen(){
  if (!amZug()) return;
  if (zugGelegt().length){ meldung('Du hast schon gelegt – dann kannst du nicht ziehen.', 3600); return; }
  zurueckAufAnfang();
  if (!G.deck.length){
    meldung('Der Stapel ist leer – du musst passen.', 2600);
    G.passen++;
    G.undo = [];
    if (G.passen >= G.spieler.length) return ende(-1);
    return naechster();
  }
  var t = G.deck.pop(), nr = G.spielNr;
  G.warten = true; knoepfe();
  summ(12);
  /* erst einmal gross ansehen, dann wandert er an seinen Platz */
  zeigeGezogen(t, function(){
    if (nr !== G.spielNr) return;
    G.warten = false;
    einsortieren(t);
    handReiheSichern();
    G.undo = [];
    renderAll();
    naechster();
  });
}
function zurueckAufAnfang(){
  if (G.zugStart) stelleHer(G.zugStart);
  G.gehoben = [];
  G.undo = [];
}
function zurueck(){
  if (!G.undo.length) return;
  stelleHer(G.undo.pop());renderAll();
}
function abbrechen(){ zurueckAufAnfang();renderAll(); }

/* ==================================================================
   Die Gegner
   ================================================================== */
function zuSorten(tiles){
  var c = new Array(52), j = 0, i;
  for (i=0;i<52;i++) c[i] = 0;
  for (i=0;i<tiles.length;i++){ if (tiles[i].j) j++; else c[idxOf(tiles[i].c, tiles[i].n)]++; }
  return { c:c, j:j };
}
/* Aus den Sorten-Saetzen wieder echte Steine machen - gleiche Reihenfolge
   wie im Rechner: erst Tisch, dann Hand. */
function materialisieren(sets, tischTiles, handTiles){
  var pt = {}, ph = {}, jt = [], jh = [], i, k, x;
  for (i=0;i<tischTiles.length;i++){
    var t = tischTiles[i];
    if (t.j) jt.push(t); else { x = idxOf(t.c,t.n); (pt[x] = pt[x] || []).push(t); }
  }
  for (i=0;i<handTiles.length;i++){
    var u = handTiles[i];
    if (u.j) jh.push(u); else { x = idxOf(u.c,u.n); (ph[x] = ph[x] || []).push(u); }
  }
  var raus = [], benutzt = {};
  for (i=0;i<sets.length;i++){
    var st = sets[i], tiles = [];
    for (k=0;k<st.need.length;k++){
      x = st.need[k];
      var t2 = (pt[x] && pt[x].length) ? pt[x].shift() : (ph[x] && ph[x].length ? ph[x].shift() : null);
      if (!t2) return null;
      tiles.push(t2); benutzt[t2.id] = 1;
    }
    for (k=0;k<st.jok;k++){
      var j2 = jt.length ? jt.shift() : (jh.length ? jh.shift() : null);
      if (!j2) return null;
      tiles.push(j2); benutzt[j2.id] = 1;
    }
    if (!checkSet(tiles).ok) return null;
    raus.push(tiles);
  }
  return { sets:raus, benutzt:benutzt };
}
/* einzelne Steine an bestehende Saetze anlegen */
function anlegenVersuch(hand, saetze){
  var geaendert = false, weiter = true;
  while (weiter){
    weiter = false;
    for (var i=0;i<hand.length;i++){
      for (var k=0;k<saetze.length;k++){
        var probe = saetze[k].tiles.concat([hand[i]]);
        if (checkSet(probe).ok){
          saetze[k].tiles = probe; hand.splice(i,1);
          geaendert = true; weiter = true; break;
        }
        /* Passt es nur, wenn der Satz dabei in zwei gueltige Stuecke
           zerfaellt (wie beim Spieler auch), dann eben so. */
        var vorher = saetze[k].tiles;
        saetze[k].tiles = probe;
        if (nachTeilen(saetze[k], saetze, null)){
          hand.splice(i,1); geaendert = true; weiter = true; break;
        }
        saetze[k].tiles = vorher;
      }
      if (weiter) break;
    }
  }
  return geaendert;
}

function kiZug(pi){
  var p = G.spieler[pi], stufe = G.kiStufe;
  var handS = zuSorten(p.hand);
  var tischTiles = [], i;
  for (i=0;i<G.saetze.length;i++) tischTiles = tischTiles.concat(G.saetze[i].tiles);
  var leer = new Array(52); for (i=0;i<52;i++) leer[i] = 0;
  var gelegt = false;

  if (!p.aus){
    /* Rauskommen: nur eigene Steine, Mindestpunkte noetig */
    var zeit = [0,90,150,300,600,1400][stufe] || 150;
    var r = rechne(leer, 0, handS.c, handS.j, zeit, 0);
    if (r.sets && r.sets.length){
      var m = materialisieren(r.sets, [], p.hand);
      if (m){
        var summe = 0;
        for (i=0;i<m.sets.length;i++) summe += checkSet(m.sets[i]).pts;
        if (summe >= G.minOut){
          for (i=0;i<m.sets.length;i++) G.saetze.push({ id:setId++, tiles:m.sets[i] });
          p.hand = p.hand.filter(function(t){ return !m.benutzt[t.id]; });
          p.aus = true; gelegt = true;
        }
      }
    }
  } else if (stufe >= 3 && tischTiles.length){
    /* Umbau des ganzen Tisches */
    var ts = zuSorten(tischTiles);
    var zeit2 = stufe >= 5 ? 1400 : (stufe >= 4 ? 500 : 240);
    var r2 = rechne(ts.c, ts.j, handS.c, handS.j, zeit2, 100);
    if (r2.ok && r2.sets && r2.sets.length){
      var m2 = materialisieren(r2.sets, tischTiles, p.hand);
      var allesDrin = !!m2;
      if (m2) for (i=0;i<tischTiles.length;i++) if (!m2.benutzt[tischTiles[i].id]) allesDrin = false;
      if (allesDrin){
        var vorher = p.hand.length;
        var neueHand = p.hand.filter(function(t){ return !m2.benutzt[t.id]; });
        if (neueHand.length < vorher){
          var alteSaetze = G.saetze;
          G.saetze = [];
          for (i=0;i<m2.sets.length;i++) G.saetze.push({ id:setId++, tiles:m2.sets[i] });
          erbePositionen(alteSaetze, G.saetze);
          p.hand = neueHand; gelegt = true;
        }
      }
    }
  }

  if (!gelegt && p.aus){
    /* eigene neue Saetze */
    var zeit3 = [0,80,140,220,400,900][stufe] || 140;
    var r3 = rechne(leer, 0, handS.c, handS.j, zeit3, 100);
    if (r3.sets && r3.sets.length){
      var m3 = materialisieren(r3.sets, [], p.hand);
      if (m3){
        var nimmAlle = stufe >= 2 ? m3.sets.length : 1;
        var benutzt2 = {};
        for (i=0;i<nimmAlle;i++){
          G.saetze.push({ id:setId++, tiles:m3.sets[i] });
          for (var q=0;q<m3.sets[i].length;q++) benutzt2[m3.sets[i][q].id] = 1;
          gelegt = true;
        }
        p.hand = p.hand.filter(function(t){ return !benutzt2[t.id]; });
      }
    }
    /* anlegen */
    if (stufe >= 2){
      if (anlegenVersuch(p.hand, G.saetze)) gelegt = true;
    }
    /* Grossmeister: nach dem ersten Anlauf hat sich der Tisch veraendert -
       kleinere Hand, mehr Steine auf dem Tisch. Ein zweiter, kuerzerer
       Umbau-Versuch findet manchmal, was der erste (groessere) nicht in
       der Zeit geschafft hat. */
    if (stufe >= 5 && p.hand.length){
      var tischTiles2 = [];
      for (i=0;i<G.saetze.length;i++) tischTiles2 = tischTiles2.concat(G.saetze[i].tiles);
      if (tischTiles2.length){
        var ts2 = zuSorten(tischTiles2), handS2 = zuSorten(p.hand);
        var r4 = rechne(ts2.c, ts2.j, handS2.c, handS2.j, 500, 100);
        if (r4.ok && r4.sets && r4.sets.length){
          var m4 = materialisieren(r4.sets, tischTiles2, p.hand);
          var allesDrin2 = !!m4;
          if (m4) for (i=0;i<tischTiles2.length;i++) if (!m4.benutzt[tischTiles2[i].id]) allesDrin2 = false;
          if (allesDrin2){
            var vorher2 = p.hand.length;
            var neueHand2 = p.hand.filter(function(t){ return !m4.benutzt[t.id]; });
            if (neueHand2.length < vorher2){
              var alteSaetze2 = G.saetze;
              G.saetze = [];
              for (i=0;i<m4.sets.length;i++) G.saetze.push({ id:setId++, tiles:m4.sets[i] });
              erbePositionen(alteSaetze2, G.saetze);
              p.hand = neueHand2; gelegt = true;
            }
          }
        }
      }
    }
  }

  saetzeAufraeumen();
  if (!alleSaetzeGut()){
    /* Notbremse: sollte nicht vorkommen - Zug verwerfen und ziehen */
    meldung(p.name + ' hat sich verrechnet.', 2000);
  }
  if (gelegt){
    G.passen = 0;
    meldung(p.name + ' hat gelegt.', 2200);
  } else if (G.deck.length){
    p.hand.push(G.deck.pop());
    meldung(p.name + ' zieht.', 2000);
  } else {
    G.passen++;
    meldung(p.name + ' passt.', 2000);
  }
  return p.hand.length === 0;
}

/* ==================================================================
   Rundenlauf
   ================================================================== */
function naechster(nr){
  if (nr !== undefined && nr !== G.spielNr) return;   /* Nachzuegler aus einer alten Partie */
  spielSpeichern();
  G.dran = (G.dran + 1) % G.spieler.length;
  if (G.dran === 0){
    G.warten = false;
    G.zugStart = schnapp();
    G.undo = [];
    G.meldung = '';
    renderAll(); spielSpeichern();
  } else {
    G.warten = true; renderAll();
    var nr2 = G.spielNr;
    setTimeout(function(){ kiSchritt(nr2); }, 620);
  }
}
function kiSchritt(nr){
  if (!G.laeuft || nr !== G.spielNr) return;
  var pi = G.dran, fertig = false;
  try { fertig = kiZug(pi); }
  catch(err){ meldung('Ein Gegner hat gestockt.', 2000); }
  renderAll();
  var nr3 = G.spielNr;
  if (fertig) return setTimeout(function(){ if (nr3 === G.spielNr) ende(pi); }, 500);
  if (G.passen >= G.spieler.length) return setTimeout(function(){ if (nr3 === G.spielNr) ende(-1); }, 500);
  setTimeout(function(){ naechster(nr3); }, 520);
}

/* ==================================================================
   Abrechnung
   ================================================================== */
function ende(gewinner){
  G.laeuft = false;
  try{ localStorage.removeItem('teddi.spiel'); }catch(e){}
  memStore['teddi.spiel'] = null;
  var i, werte = [];
  for (i=0;i<G.spieler.length;i++) werte.push(handWert(G.spieler[i].hand));
  if (gewinner < 0){
    var beste = 0;
    for (i=1;i<G.spieler.length;i++) if (werte[i] < werte[beste]) beste = i;
    gewinner = beste;
  }
  var summe = 0;
  for (i=0;i<G.spieler.length;i++) if (i !== gewinner) summe += werte[i];
  var zeilen = [];
  for (i=0;i<G.spieler.length;i++){
    var d = (i === gewinner) ? summe : -werte[i];
    G.spieler[i].punkte += d;
    zeilen.push({ name:G.spieler[i].name, delta:d, rest:G.spieler[i].hand.slice(),
                  gesamt:G.spieler[i].punkte, sieg:i === gewinner });
  }
  G.runde++;
  lsSet('teddi.karte', { runde:G.runde, stand:G.spieler.map(function(p,i){ return {platz:i, name:p.name, punkte:p.punkte}; }) });
  renderAll();
  setTimeout(function(){ zeigeErgebnis(zeilen, gewinner); }, 320);
}

/* ==================================================================
   Neues Spiel
   ================================================================== */
function neuesSpiel(){
  saveCfg();
  G.deck = neuerVorrat();
  G.minOut = cfg.minOut; G.kiStufe = cfg.ki;
  G.saetze = []; G.gehoben = []; G.undo = []; G.passen = 0; G.laeuft = true;
  G.dran = 0; G.warten = false; setId = 1; G.spielNr = (G.spielNr || 0) + 1;
  var alt = lsGet('teddi.karte', null), punkte = {};
  if (alt && alt.stand) alt.stand.forEach(function(x, k){
    punkte[x.platz != null ? x.platz : k] = x.punkte;
  });
  G.runde = (alt && alt.runde) || 0;
  G.spieler = [];
  for (var i=0;i<=cfg.foes;i++){
    var hand = [];
    for (var k=0;k<14;k++) hand.push(G.deck.pop());
    G.spieler.push({ name:spielerName(i), hand:hand, aus:false,
                     punkte: punkte[i] || 0, ki: i > 0 });
  }
  sortHand(cfg.sortMode === 'm' ? 'n' : cfg.sortMode);
  G.zugStart = schnapp();
  zu();
  G.meldung = '';
  renderAll(); spielSpeichern();
}

/* ---------- Spielstand sichern und laden ---------- */
function spielSpeichern(){
  if (!G.laeuft) return;
  try{
    lsSet('teddi.spiel', {
      deck:G.deck, dran:G.dran, minOut:G.minOut, kiStufe:G.kiStufe,
      passen:G.passen, runde:G.runde,
      saetze:G.saetze.map(function(s){ return { t:s.tiles, x:s.x, y:s.y }; }),
      spieler:G.spieler.map(function(p){ return {name:p.name, hand:p.hand, aus:p.aus, punkte:p.punkte, ki:p.ki}; })
    });
  }catch(e){}
}
function spielLaden(){
  var d = lsGet('teddi.spiel', null);
  if (!d || !d.spieler || !d.spieler.length) return false;
  var maxId = 0;
  function fix(t){ if (t.id > maxId) maxId = t.id; return t; }
  G.deck = d.deck.map(fix);
  G.saetze = d.saetze.map(function(o){
    if (o instanceof Array) return { id:setId++, tiles:o.map(fix) };      /* altes Format */
    return { id:setId++, tiles:o.t.map(fix), x:o.x, y:o.y };
  });
  G.spieler = d.spieler.map(function(p){
    return { name:p.name, hand:p.hand.map(fix), aus:p.aus, punkte:p.punkte, ki:p.ki };
  });
  nextId = maxId + 1;
  G.dran = 0; G.minOut = d.minOut; G.kiStufe = d.kiStufe; G.passen = d.passen || 0;
  G.runde = d.runde || 0; G.gehoben = []; G.undo = []; G.laeuft = true; G.warten = false;
  cfg.minOut = G.minOut; cfg.ki = G.kiStufe;
  G.spielNr = (G.spielNr || 0) + 1;
  G.zugStart = schnapp();
  return true;
}

/* ==================================================================
   Dialoge
   ================================================================== */
function auf(html){ $dlg.innerHTML = html; $veil.className = 'on'; $dlg.scrollTop = 0; bindeRegler(); }
function zu(){ $veil.className = ''; fitTiles(); }
$veil.addEventListener('click', function(e){ if (e.target === $veil && G.laeuft) zu(); });
$dlg.addEventListener('click', function(e){
  var n = e.target;
  while (n && n !== $dlg && !n.getAttribute('data-act')) n = n.parentNode;
  if (!n || n === $dlg) return;
  var a = n.getAttribute('data-act'), v = n.getAttribute('data-v');
  if (a === 'zu') zu();
  else if (a === 'neu') zeigeStart(true);
  else if (a === 'start') { zu(); neuesSpiel(); }
  else if (a === 'weiter') { if (spielLaden()) { zu(); renderAll(); } else zeigeStart(true); }
  else if (a === 'hilfe') zeigeHilfe();
  else if (a === 'opt') zeigeOptionen();
  else if (a === 'karte') zeigeKarte();
  else if (a === 'menu') zeigeMenu();
  else if (a === 'ecke') location.href = './';
  else if (a === 'ordnen'){ zu(); tischAufraeumen(); }
  else if (a === 'sw'){
    var f = n.getAttribute('data-f');
    cfg[f] = !cfg[f]; saveCfg();
    n.className = 'sw' + (cfg[f] ? ' on' : '');
  }
  else if (a === 'foes'){ cfg.foes = parseInt(v,10); saveCfg(); zeigeOptionen(); }
  else if (a === 'feld'){ cfg.feld = v; saveCfg(); feldAnwenden(); zeigeOptionen(); }
  else if (a === 'reset'){ lsSet('teddi.karte', null); zeigeOptionen(); }
});

}

/* Die beiden Schwierigkeitsregler. Sie stehen im Startbild und in den
   Einstellungen und schreiben beide in dasselbe cfg. */
function reglerHtml(){
  return ''+
  '<div class="reg">'+
    '<div class="kopf"><b>Minimum zum Rauskommen</b><em id="regMinWert">'+cfg.minOut+'</em></div>'+
    '<input type="range" id="regMin" min="'+MIN_KLEIN+'" max="'+MIN_GROSS+'" step="1" value="'+cfg.minOut+'">'+
    '<div class="skala"><span>'+MIN_KLEIN+' leicht</span><span>'+MIN_GROSS+' streng</span></div>'+
    '<p class="txt" id="regMinTxt">'+minText()+'</p>'+
  '</div>'+
  '<div class="reg">'+
    '<div class="kopf"><b>Spielniveau der Gegner</b><em id="regKiWert">'+KI_NAMEN[cfg.ki]+'</em></div>'+
    '<input type="range" id="regKi" min="1" max="5" step="1" value="'+cfg.ki+'">'+
    '<div class="skala"><span>1 ruhig</span><span>5 gnadenlos</span></div>'+
    '<p class="txt" id="regKiTxt">Sie '+KI_TEXTE[cfg.ki]+'.</p>'+
  '</div>';
}
function minText(){
  var m = cfg.minOut;
  var wie = m <= 21 ? 'Da ist man schnell draußen.'
          : m <= 33 ? 'Der übliche Bereich.'
          : m <= 42 ? 'Man muss auf gute Sätze warten.'
          : 'Nur mit hohen Zahlen oder Teddi zu schaffen.';
  return 'Dein erster Zug muss ' + m + ' Punkte aus eigenen Steinen bringen. ' + wie;
}
function bindeRegler(){
  var felder = $dlg.querySelectorAll('input.nam'), q;
  for (q=0;q<felder.length;q++) (function(f){
    f.oninput = function(){
      var i = parseInt(f.getAttribute('data-i'), 10);
      cfg.namen[i] = f.value.slice(0,14);
      saveCfg();
    };
    f.onblur = function(){
      var i = parseInt(f.getAttribute('data-i'), 10);
      if (!f.value.trim()){ cfg.namen[i] = NAMEN_STD[i]; f.value = NAMEN_STD[i]; saveCfg(); }
    };
  })(felder[q]);
  var rm = el('regMin'), rk = el('regKi');
  if (rm) rm.oninput = function(){
    cfg.minOut = begrenze(parseInt(this.value,10) || 30, MIN_KLEIN, MIN_GROSS); saveCfg();
    el('regMinWert').textContent = cfg.minOut;
    el('regMinTxt').textContent = minText();
  };
  if (rk) rk.oninput = function(){
    cfg.ki = begrenze(parseInt(this.value,10) || 2, 1, 5); saveCfg();
    el('regKiWert').textContent = KI_NAMEN[cfg.ki];
    el('regKiTxt').textContent = 'Sie ' + KI_TEXTE[cfg.ki] + '.';
  };
}

    for (var i=0;i<st.length;i++)
      h += '<tr'+(st[i].name==='Du'?' class="me"':'')+'><td>'+st[i].name+'</td><td class="n">'+
           (st[i].punkte>0?'+':'')+st[i].punkte+'</td></tr>';
    h += '</table>';
  }
  h += '<div class="row"><button class="btn" data-act="'+(G.laeuft?'zu':'neu')+'">Zurück</button></div>';
  auf(h);
}
function zeigeErgebnis(zeilen, gewinner){
  var duHast = gewinner === 0;
  var h = '<div style="text-align:center;margin-bottom:6px;">'+
          '<div style="width:120px;margin:0 auto;">'+(duHast ? teddyJubel() : teddyRuhig())+'</div>'+
          '<h2 style="margin:2px 0 0;">'+(duHast ? 'Gewonnen!' : zeilen[gewinner].name + ' gewinnt')+'</h2>'+
          '<p style="margin:0;opacity:.75;font-size:13px;">Runde '+G.runde+' &middot; '+stufenKurz()+'</p></div>';
  h += '<table class="sc">';
  for (var i=0;i<zeilen.length;i++){
    var z = zeilen[i], rest = '';
    for (var k=0;k<z.rest.length;k++) rest += miniTile(z.rest[k]);
    if (!rest) rest = '<span style="opacity:.6;font-size:12px;">Hand leer</span>';
    h += '<tr'+(i===0?' class="me"':'')+'><td><span class="big">'+z.name+'</span><br>'+rest+'</td>'+
         '<td class="n" style="font-size:19px;white-space:nowrap;">'+(z.delta>0?'+':'')+z.delta+
         '<br><span style="font-size:12px;font-weight:normal;opacity:.7;">gesamt '+
         (z.gesamt>0?'+':'')+z.gesamt+'</span></td></tr>';
  }
  h += '</table>';
  h += '<div class="row"><button class="btn" data-act="karte">Punktekarte</button>'+
       '<button class="btn go" data-act="start"><span class="ico">&#9654;</span>Nochmal</button>'+
       '<button class="btn" data-act="neu">Stufe wechseln</button></div>';
  auf(h);
}
function zeigeHilfe(){
  var h = '<h2>Teddikub - Regeln</h2>'+
  '<h3>Ziel</h3><p>Wer als Erster alle Steine losgeworden ist, gewinnt die Runde. '+
  'Die anderen zählen ihre übrigen Steine als Minuspunkte, der Gewinner bekommt die Summe gutgeschrieben.</p>'+
  '<h3>Sortieren</h3><p><b>Reihe</b> ordnet nach Zahl, <b>Farbe</b> nach Farbe, <b>Manuell</b> lässt die Steine, wo sie sind - dann ziehst du sie selbst zurecht. Der aktive Knopf ist hervorgehoben.</p><h3>Sätze</h3><ul>'+
  '<li><b>Gruppe:</b> drei oder vier gleiche Zahlen in verschiedenen Farben.</li>'+
  '<li><b>Reihe:</b> mindestens drei fortlaufende Zahlen derselben Farbe. '+
  '<b>Nach der 13 geht es bei der 1 weiter</b> - 12&#8209;13&#8209;1 ist also erlaubt.</li></ul>'+
  '<h3>Rauskommen</h3><p>Der erste Zug muss ' + '<b>' + (G.minOut || cfg.minOut) + ' Punkte</b> '+
  'aus eigenen Sätzen bringen. Solange du nicht raus bist, sind die Sätze der anderen '+
  '<b>gesperrt</b> – sie erscheinen blass und ohne <b>+</b>, du kannst sie also gar nicht '+
  'erst anfassen. Was du in diesem Zug selbst gelegt hast, bleibt offen: du darfst deinen '+
  'eigenen frischen Satz weiter ergänzen.</p>'+
  '<h3>Teddi, der Joker</h3><ul>'+
  '<li>Teddi vertritt jeden Stein. Er <b>zählt mit</b> - mit dem Wert des Steins, den er ersetzt.</li>'+
  '<li>In einem Satz dürfen nie mehr Teddis als echte Steine liegen.</li>'+
  '<li>Liegt Teddi auf dem Tisch, darfst du ihn herausnehmen und <b>frei anderswo einsetzen</b> - '+
  'zum Beispiel gegen den echten Stein tauschen.</li>'+
  '<li>Auf die Hand darf er nicht zurück: Er muss vor dem Zugende wieder auf dem Tisch liegen.</li>'+
  '<li>Bleibt Teddi am Rundenende auf deiner Hand, kostet er 25 Punkte.</li></ul>'+
  '<h3>Bedienung</h3><ul>'+
  '<li><b>Stein antippen</b> &rarr; du hebst ihn auf. Er bleibt liegen, wo er ist, nur angehoben. '+
  'Das geht mit Handsteinen <b>und</b> mit Steinen vom Tisch – auch aus mehreren Sätzen auf einmal.</li>'+
  '<li>Nochmal antippen &rarr; du legst ihn wieder hin.</li>'+
  '<li>Sobald du etwas aufgehoben hast, erscheinen die gelben <b>+</b>-Felder. '+
  'Auf ein <b>+</b> tippen &rarr; alles Aufgehobene wandert an diesen Satz. '+
  'Auf <b>+ neuer Satz</b> oder die freie Fläche tippen &rarr; es entsteht ein neuer Satz. '+
  'Auf die Hand tippen &rarr; die Steine gehen zurück auf die Hand (nur eigene).</li>'+
  '<li>Wer lieber schiebt: einen Stein einfach <b>an seinen Platz ziehen</b>. '+
  'Ist er Teil des Aufgehobenen, wandert alles mit.</li>'+
  '<li>Einen Handstein innerhalb der Hand ziehen &rarr; du ordnest selbst; das schaltet auf <b>Manuell</b>.</li>'+
  '<li><b>Sätze verschieben:</b> am gepunkteten Griff links neben jedem Satz fassen und ziehen. '+
  'Der gestrichelte Rahmen zeigt, wo er landet. Das ist nur fürs Auge und zählt nicht als Zug.</li>'+
  '<li><b>Sätze verbinden:</b> einen Satz am Griff auf einen anderen ziehen. Ergibt beides '+
  'zusammen einen gültigen Satz (etwa 9‑10‑11 und 12‑13‑1), leuchtet das Ziel gelb, und beim '+
  'Loslassen werden sie eins. Rot heißt: passt nicht. Vor dem Rauskommen geht das nur mit '+
  'deinen eigenen neuen Sätzen.</li>'+
  '<li><b>Ordnen</b> legt alle Sätze wieder gerade ins Raster – in derselben Reihenfolge, '+
  'nur ohne Lücken und mit gleichmäßigem Abstand.</li>'+
  '<li>Legst du an eine Reihe etwas an, das sie sprengt, sie aber sauber in zwei gültige '+
  'Reihen zerfallen lässt, <b>trennt sie sich von selbst</b> – etwa eine zweite 11 an '+
  '9‑10‑11‑12‑13‑1 ergibt 9‑10‑11 und 11‑12‑13‑1.</li>'+
  '<li>Nimmst du Steine aus der <b>Mitte</b> einer Reihe, <b>teilt sie sich von selbst</b> in die '+
  'Stücke links und rechts davon. Ist ein Stück dann zu kurz, bekommt es einen roten Rahmen – '+
  'ergänze es oder räume es weg, bevor du „Spielen" drückst. Gruppen gleicher Zahlen bleiben ganz.</li>'+
  '<li>Rote Rahmen heißen: dieser Satz stimmt so noch nicht. Gestrichelte heißen: hier fehlt noch etwas, '+
  'weil du daraus Steine aufgehoben hast.</li>'+
  '<li><b>Zurück</b> nimmt einen Schritt zurück, <b>Abbr.</b> den ganzen Zug – '+
  'auch alles, was du gerade in der Hand hältst.</li>'+
  '<li><b>Spielen</b> beendet den Zug. Hast du nichts gelegt, heißt der Knopf <b>Ziehen</b>.</li></ul>'+
  '<h3>Tasten</h3><p>Leertaste = Spielen/Ziehen &middot; Z = Zurück &middot; Esc = Abbrechen &middot; '+
  '1 = nach Reihe &middot; 2 = nach Farbe &middot; 3 = manuell &middot; O = Tisch ordnen.</p>'+
  '<p style="opacity:.7;font-size:13px;margin-top:14px;">Vorbild ist das bekannte Legespiel mit Zahlenplättchen. '+
  'Teddikub ist eine eigene Fassung: eigener Name, eigene Grafik, eigener Joker.</p>'+
  '<div class="row"><button class="btn" data-act="'+(G.laeuft?'zu':'neu')+'">Zurück</button></div>';
  auf(h);
}

/* ==================================================================
   Knoepfe und Tasten
   ================================================================== */
el('bEcke').onclick = function(){ location.href = './'; };
el('bMenu').onclick = function(){zeigeMenu(); };
el('bSortN').onclick = function(){ sortiere('n'); };
el('bSortC').onclick = function(){ sortiere('c'); };
el('bSortM').onclick = function(){ sortiere('m'); };
el('bOrdnen').onclick = function(){ tischAufraeumen(); };
el('bSort').onclick = function(){ sortiere(SORTFOLGE[cfg.sortMode] || 'n'); };
el('bUndo').onclick = function(){ zurueck(); };
el('bReset').onclick = function(){ abbrechen(); };
el('bPlay').onclick = function(){ spielen(); };
document.addEventListener('keydown', function(e){
  if ($veil.className === 'on'){ if (e.key === 'Escape' && G.laeuft) zu(); return; }
  if (!amZug()) return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); spielen(); }
  else if (e.key === 'z' || e.key === 'Z') zurueck();
  else if (e.key === 'Escape') abbrechen();
  else if (e.key === '1') sortiere('n');
  else if (e.key === '2') sortiere('c');
  else if (e.key === '3') sortiere('m');
  else if (e.key === 'o' || e.key === 'O') tischAufraeumen();
});

/* ==================================================================
   Start
   ================================================================== */
$hint.innerHTML = 'Steine antippen – sie heben sich an.<br>'+
  'Dann auf ein gelbes Feld tippen oder hierher.<br>'+
  '<span style="font-size:13px;opacity:.8">Ziehen geht auch.</span>';
feldAnwenden();
G.spieler = [{ name:'Du', hand:[], aus:false, punkte:0, ki:false }];
G.passen = 0; G.spielNr = 0;
if (!spielLaden()) zeigeStart(false);
renderAll();
setTimeout(fitTiles, 80);
