<script>
/* iOS zoomt sonst beim schnellen Doppeltippen oder mit zwei Fingern hinein -
   beim Spielen ist das immer ein Versehen. Wird der zweite Tipp unterdrueckt,
   loesen wir seine Wirkung selbst aus, damit nichts verloren geht. */
(function(){
  function imDialog(n){
    while (n && n !== document.body){
      if (n.id === 'dlg' || n.id === 'veil' || n.id === 'modal' || n.id === 'overlay') return true;
      n = n.parentNode;
    }
    return false;
  }
  function klickZiel(n){
    while (n && n !== document.body && !n.onclick) n = n.parentNode;
    return (n && n.onclick) ? n : null;
  }
  var t0 = 0, x0 = 0, y0 = 0;
  document.addEventListener('touchend', function(e){
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var jetzt = Date.now(), nah = Math.abs(t.clientX - x0) + Math.abs(t.clientY - y0) < 40;
    if (jetzt - t0 < 350 && nah && e.cancelable && !imDialog(e.target)){
      e.preventDefault();                       /* kein Zoom */
      var z = klickZiel(e.target);
      if (z && !z.disabled) z.onclick(e);       /* Wirkung trotzdem ausloesen */
    }
    t0 = jetzt; x0 = t.clientX; y0 = t.clientY;
  }, {passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(g){
    document.addEventListener(g, function(e){ if (e.cancelable) e.preventDefault(); }, {passive:false});
  });
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Teddikub</title>
<style>
:root{
  --holz1:#7a2f18; --holz2:#4e1c0d; --holz3:#8f3a1e;
  --leiste:#e2914a; --leiste2:#c9702f; --leiste3:#f3b478;
  --stein:#f4ece2; --stein2:#e0d4c4; --steinrand:#b9a894;
  --gruen:#2f9b3f; --rot:#d02a2a;
  --f0:#1b1b1b; --f1:#e07b17; --f2:#16803c; --f3:#cf2020;
  --tile:38px; --gap:2px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html,body{height:100%;}
body{
  margin:0; position:fixed; inset:0; overflow:hidden;
  background:var(--holz2);
  font-family:"Trebuchet MS","Segoe UI",Tahoma,Verdana,sans-serif;
  color:#fff; user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none; touch-action:manipulation; overscroll-behavior:none;
}
input, textarea{user-select:text; -webkit-user-select:text; font-size:16px;}
#wrap{position:absolute; inset:0; display:flex; flex-direction:column;}

/* ---------- Symbolleiste, unten bei der Hand ---------- */
#bar{
  flex:0 0 auto; display:flex; align-items:stretch; gap:3px;
  padding:3px 3px calc(3px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--leiste3),var(--leiste) 55%,var(--leiste2));
  border-top:2px solid #8c4a17;
}
.btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:46px; padding:2px 7px; border:2px solid; border-color:#ffdcb8 #9a5320 #9a5320 #ffdcb8;
  background:linear-gradient(180deg,#f6bd85,#dd8f45); color:#4a1d07; cursor:pointer;
  font-size:11px; line-height:1.1; border-radius:4px; font-weight:bold; white-space:nowrap;
}
.btn:active{border-color:#9a5320 #ffdcb8 #ffdcb8 #9a5320; background:linear-gradient(180deg,#dd8f45,#f6bd85);}
.btn[disabled]{opacity:.42; pointer-events:none;}
.btn .ico{font-size:16px; line-height:1;}
.ecke-ico{width:1.25em; height:1.25em; border-radius:22%; display:block; margin:0 auto;}
.btn.wide{min-width:64px;}
.btn.go{background:linear-gradient(180deg,#8fe08f,#3aa03a); color:#0b2f0b; border-color:#ccf5cc #1c6b1c #1c6b1c #ccf5cc;}
.btn.aktiv{background:linear-gradient(180deg,#ffe7b8,#e39b3d); box-shadow:inset 0 2px 6px rgba(122,47,24,.55);}
.btn.aktiv .ico,.btn.aktiv .lbl{color:#5a2109;}
.nurHandy{display:none;}
#spacer{flex:1 1 auto;}
#stack{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:46px; padding:2px 6px; border-radius:4px; background:#fff6ea; color:#4a1d07;
  border:2px solid #9a5320; font-weight:bold; font-size:15px;
}
#stack small{font-size:9px; font-weight:normal; display:block;}

/* ---------- Gegner ---------- */
#foes{
  flex:0 0 auto; display:flex; gap:6px; padding:4px 6px; align-items:center;
  background:linear-gradient(180deg,#5d2412,#4a1c0d);
  border-bottom:1px solid #2e1108; overflow:hidden;
}
.foe{
  display:flex; align-items:center; gap:5px; padding:2px 7px; border-radius:12px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16);
  font-size:12px; min-width:0;
}
.foe.turn{background:#e2914a; color:#3d1505; border-color:#ffd7ac; font-weight:bold;}
.foe .cnt{background:#fff6ea; color:#4a1d07; border-radius:8px; padding:0 6px; font-weight:bold; font-size:12px;}
.foe .pts{opacity:.85;}
.foe .bars{display:flex; gap:1px; align-items:flex-end; min-width:0; flex-wrap:nowrap; overflow:hidden;}
.foe .bars i{width:4px; height:13px; background:#f0e4d4; border:1px solid #8c6b4a; border-radius:1px; flex:0 0 auto;}
#msg{margin-left:auto; font-size:12px; opacity:.9; padding-right:4px; text-align:right; max-width:46%;}

/* ---------- Tisch ---------- */
/* Die Tischoberflaeche ist waehlbar (Einstellungen -> Spielfeld).
   Jede Oberflaeche ist eine Klasse .feld-xxx - so passt sie auf das Spielfeld
   und auf die kleinen Proben im Dialog gleichermassen. Alles reines CSS. */
#tableframe{
  flex:1 1 auto; min-height:0; position:relative; overflow:auto;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.30), inset 0 0 44px rgba(0,0,0,.38);
}
/* Filz, gruen - der klassische Spieltisch. Feines Kreuzgewebe statt Streifen. */
.feld-filz{
  --satzrand:#9be3a6;
  background-color:#25603f;
  background-image:
    radial-gradient(120% 85% at 50% -5%, rgba(255,255,255,.11), rgba(0,0,0,0) 60%),
    radial-gradient(110% 80% at 50% 112%, rgba(0,0,0,.30), rgba(0,0,0,0) 62%),
    repeating-linear-gradient(45deg,  rgba(255,255,255,.028) 0 1px, rgba(0,0,0,0) 1px 3px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, rgba(0,0,0,0) 1px 3px);
}
/* Filz, petrol */
.feld-petrol{
  --satzrand:#8fe0d0;
  background-color:#1f4d5a;
  background-image:
    radial-gradient(120% 85% at 50% -5%, rgba(255,255,255,.10), rgba(0,0,0,0) 60%),
    radial-gradient(110% 80% at 50% 112%, rgba(0,0,0,.32), rgba(0,0,0,0) 62%),
    repeating-linear-gradient(45deg,  rgba(255,255,255,.026) 0 1px, rgba(0,0,0,0) 1px 3px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, rgba(0,0,0,0) 1px 3px);
}
/* Eiche, honigfarben - heller als das dunkle Holz, Maserung laengs */
.feld-eiche{
  background-color:#9a6a3c;
  background-image:
    radial-gradient(120% 80% at 50% -10%, rgba(255,240,215,.16), rgba(0,0,0,0) 60%),
    repeating-linear-gradient(2deg, rgba(90,50,20,.10) 0 2px, rgba(0,0,0,0) 2px 9px),
    repeating-linear-gradient(-1deg, rgba(255,230,190,.06) 0 5px, rgba(0,0,0,0) 5px 31px),
    repeating-linear-gradient(1deg, rgba(70,40,15,.08) 0 11px, rgba(0,0,0,0) 11px 83px),
    linear-gradient(170deg, #a8773f 0%, #946338 50%, #7e5230 100%);
}
/* Schiefer, ruhig - nur weiche Wolken, keine Linien */
.feld-schiefer{
  background-color:#3d4447;
  background-image:
    radial-gradient(60% 45% at 25% 30%, rgba(255,255,255,.05), rgba(0,0,0,0) 70%),
    radial-gradient(55% 50% at 78% 70%, rgba(0,0,0,.16), rgba(0,0,0,0) 72%),
    radial-gradient(45% 35% at 70% 18%, rgba(255,255,255,.035), rgba(0,0,0,0) 70%),
    linear-gradient(165deg, #454d51 0%, #3b4245 55%, #33393c 100%);
}
/* Kork - warm, mit unregelmaessig verstreuten Koernern. Drei Kacheln mit
   teilerfremden Groessen (37x41, 53x47, 29x31), damit kein Raster sichtbar wird. */
.feld-kork{
  background-color:#a8794a;
  background-image:
    radial-gradient(circle at 12.0px 6.2px, rgba(72,40,14,0.40) 1.7px, rgba(0,0,0,0) 2.4px),
    radial-gradient(circle at 13.5px 2.4px, rgba(72,40,14,0.38) 1.5px, rgba(0,0,0,0) 2.2px),
    radial-gradient(circle at 2.6px 3.7px, rgba(255,226,182,0.20) 1.4px, rgba(0,0,0,0) 2.1px),
    radial-gradient(circle at 8.3px 25.7px, rgba(255,226,182,0.24) 2.1px, rgba(0,0,0,0) 2.8px),
    radial-gradient(circle at 36.1px 1.9px, rgba(72,40,14,0.33) 2.0px, rgba(0,0,0,0) 2.7px),
    radial-gradient(circle at 4.4px 12.6px, rgba(72,40,14,0.40) 1.9px, rgba(0,0,0,0) 2.6px),
    radial-gradient(circle at 23.6px 15.3px, rgba(72,40,14,0.31) 1.6px, rgba(0,0,0,0) 2.3px),
    radial-gradient(circle at 7.6px 27.9px, rgba(72,40,14,0.41) 1.4px, rgba(0,0,0,0) 2.1px),
    radial-gradient(circle at 16.8px 12.3px, rgba(255,226,182,0.21) 1.9px, rgba(0,0,0,0) 2.6px),
    radial-gradient(circle at 30.4px 24.7px, rgba(255,226,182,0.22) 2.0px, rgba(0,0,0,0) 2.7px),
    radial-gradient(circle at 51.9px 5.5px, rgba(255,226,182,0.20) 1.4px, rgba(0,0,0,0) 2.1px),
    radial-gradient(circle at 25.9px 1.8px, rgba(255,226,182,0.26) 1.7px, rgba(0,0,0,0) 2.4px),
    radial-gradient(circle at 46.4px 14.7px, rgba(255,226,182,0.26) 1.8px, rgba(0,0,0,0) 2.5px),
    radial-gradient(circle at 24.2px 39.5px, rgba(72,40,14,0.42) 2.1px, rgba(0,0,0,0) 2.8px),
    radial-gradient(circle at 3.2px 33.0px, rgba(255,226,182,0.30) 1.7px, rgba(0,0,0,0) 2.4px),
    radial-gradient(circle at 15.1px 18.1px, rgba(72,40,14,0.38) 1.7px, rgba(0,0,0,0) 2.4px),
    radial-gradient(circle at 8.9px 5.5px, rgba(255,226,182,0.20) 0.9px, rgba(0,0,0,0) 1.6px),
    radial-gradient(circle at 13.1px 18.4px, rgba(72,40,14,0.38) 2.0px, rgba(0,0,0,0) 2.7px),
    radial-gradient(circle at 29.1px 41.5px, rgba(255,226,182,0.22) 1.9px, rgba(0,0,0,0) 2.6px),
    radial-gradient(circle at 22.0px 16.9px, rgba(255,226,182,0.20) 2.0px, rgba(0,0,0,0) 2.7px),
    radial-gradient(circle at 5.1px 7.2px, rgba(72,40,14,0.41) 1.1px, rgba(0,0,0,0) 1.8px),
    radial-gradient(circle at 7.6px 0.1px, rgba(72,40,14,0.40) 1.4px, rgba(0,0,0,0) 2.1px),
    radial-gradient(circle at 27.6px 21.4px, rgba(255,226,182,0.27) 1.5px, rgba(0,0,0,0) 2.2px),
    radial-gradient(circle at 1.6px 27.9px, rgba(255,226,182,0.29) 1.9px, rgba(0,0,0,0) 2.6px),
    radial-gradient(circle at 11.4px 12.4px, rgba(255,226,182,0.19) 0.9px, rgba(0,0,0,0) 1.6px),
    radial-gradient(circle at 2.0px 6.5px, rgba(72,40,14,0.31) 1.0px, rgba(0,0,0,0) 1.7px),
    radial-gradient(120% 85% at 50% -5%, rgba(255,240,215,.14), rgba(0,0,0,0) 60%),
    linear-gradient(165deg, #b4844f 0%, #a27244 55%, #8f6139 100%);
  background-size:37px 41px, 37px 41px, 37px 41px, 37px 41px, 37px 41px, 37px 41px, 37px 41px, 37px 41px, 37px 41px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 53px 47px, 29px 31px, 29px 31px, 29px 31px, 29px 31px, 29px 31px, 29px 31px, auto, auto;
}
/* Nachtblau - schlicht, fast flaechig */
.feld-nacht{
  background-color:#1e2a45;
  background-image:
    radial-gradient(110% 80% at 50% -8%, rgba(160,190,255,.12), rgba(0,0,0,0) 60%),
    radial-gradient(110% 80% at 50% 112%, rgba(0,0,0,.32), rgba(0,0,0,0) 62%);
}
/* Holz, dunkel - wie am Anfang */
.feld-holz{
  background-image:
    radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.10), rgba(0,0,0,0) 60%),
    repeating-linear-gradient(94deg, rgba(0,0,0,.10) 0 3px, rgba(255,255,255,.035) 3px 7px),
    linear-gradient(160deg,var(--holz3),var(--holz1) 45%,var(--holz2));
}
/* Proben im Einstellungsdialog */
.felder{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin:6px 0 10px;}
.felder button{
  display:flex; flex-direction:column; align-items:stretch; gap:4px; cursor:pointer;
  border:2px solid #c9a57e; border-radius:8px; padding:3px 3px 5px; background:#fff6ea;
  font:inherit; font-size:12px; font-weight:bold; color:#4a1d07;
}
.felder button.an{border-color:#7a2f18; box-shadow:0 0 0 3px #ffd23a;}
.felder .probe{height:46px; border-radius:5px; box-shadow:inset 0 0 12px rgba(0,0,0,.35);}
#table{position:relative; min-height:100%; min-width:100%;}
.set{
  display:flex; gap:var(--gap); padding:3px; border-radius:6px;
  border:2px solid var(--satzrand, var(--gruen)); background:rgba(0,0,0,.16);
}
.set.bad{border-color:var(--rot); background:rgba(180,0,0,.22);}
.set.drop{outline:3px dashed #ffd23a; outline-offset:2px;}
#hint{
  position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
  color:rgba(255,255,255,.34); font-size:15px; text-align:center; pointer-events:none;
  line-height:1.5; padding:0 16px; max-width:90%;
}

/* ---------- Steine ---------- */
.t{
  position:relative; width:var(--tile); height:calc(var(--tile)*1.34);
  border-radius:calc(var(--tile)*.14); cursor:pointer; flex:0 0 auto;
  touch-action:none;
  background:linear-gradient(158deg,#fffaf3 0%,var(--stein) 42%,var(--stein2) 100%);
  border:1px solid var(--steinrand);
  box-shadow:inset 0 1px 0 #fff, inset 0 -2px 3px rgba(0,0,0,.14), 0 2px 3px rgba(0,0,0,.35);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-weight:bold; overflow:hidden;
}
.t::after{
  content:""; position:absolute; left:8%; right:8%; top:6%; height:52%;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,.05) 0 1px, rgba(0,0,0,0) 1px 4px);
  pointer-events:none;
}
.t .num{font-size:calc(var(--tile)*.62); line-height:.95; margin-top:calc(var(--tile)*-.06);}
.t .dot{width:calc(var(--tile)*.15); height:calc(var(--tile)*.15); border-radius:50%; margin-top:calc(var(--tile)*.08);}
.t.c0 .num,.t.c0 .dot{color:var(--f0); background-color:currentColor;}
.t.c1 .num,.t.c1 .dot{color:var(--f1); background-color:currentColor;}
.t.c2 .num,.t.c2 .dot{color:var(--f2); background-color:currentColor;}
.t.c3 .num,.t.c3 .dot{color:var(--f3); background-color:currentColor;}
.t .num{background-color:transparent !important;}
.t.sel{outline:3px solid #ffd23a; outline-offset:-1px; transform:translateY(-3px);}
#hand .t{transition:transform .09s ease-out;}
#hand .t.greif{
  outline:3px solid #ffd23a; outline-offset:-1px; z-index:4;
  transform:translateY(-5px) scale(1.05); box-shadow:0 7px 14px rgba(0,0,0,.45);
}
body.ordne, body.ordne #hand .t{cursor:grabbing;}
body.ordne{-webkit-user-select:none; user-select:none;}
.t.jk{background:linear-gradient(158deg,#fffdf6 0%,#ffeec6 55%,#f3d79a 100%); border-color:#c9a13c;
  box-shadow:inset 0 1px 0 #fff, inset 0 0 0 1px rgba(201,161,60,.55), 0 2px 3px rgba(0,0,0,.35);}
.t.jk svg{width:96%; height:96%; display:block; margin-top:-2%;}
.t.jk::after{display:none;}
.t .als{
  position:absolute; left:0; right:0; bottom:0; text-align:center;
  font-size:calc(var(--tile)*.32); line-height:1.25; font-weight:bold;
  background:rgba(255,255,255,.82); border-top:1px solid rgba(201,161,60,.5);
}

/* ---------- Statuszeile: steht immer da ---------- */
#status{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  padding:4px 10px; min-height:26px; text-align:center;
  background:linear-gradient(180deg,#6b3418,#54250f);
  border-bottom:1px solid #34150a; font-size:14px; line-height:1.25;
}
#status.warn{background:linear-gradient(180deg,#8c3a1a,#6e2510); color:#ffe0b8;}
#status.gut{background:linear-gradient(180deg,#1f6b2c,#14501f); color:#e6ffe6;}
#statusTxt{display:block;}

/* ---------- Hand ---------- */
#handbar{
  flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:5px 6px;
  background:linear-gradient(180deg,#f7c795,#e2914a 45%,#d07f36);
  border-top:2px solid #8c4a17;
}
#handCnt{
  flex:0 0 auto; background:#fff6ea; color:#4a1d07; border:2px solid #9a5320; border-radius:4px;
  padding:2px 6px; font-weight:bold; font-size:13px; min-width:30px; text-align:center;
}
#hand{display:flex; gap:var(--gap); flex-wrap:wrap; flex:1 1 auto; align-content:center;
  min-height:calc(var(--tile)*1.34);}
#handbar.ziel{box-shadow:inset 0 0 0 3px #ffd23a;}

/* ---------- Ablegefelder ---------- */
/* Saetze liegen auf einem Raster fest - sie fliessen nicht wie Text. */
.satzbox{position:absolute; display:flex; align-items:center;}
.satzbox.wandert{opacity:.22;}
.griff{
  flex:0 0 auto; width:calc(var(--tile)*.56); height:calc(var(--tile)*1.34 + 10px); margin-right:2px;
  border-radius:6px; cursor:grab; touch-action:none;
  background:
    radial-gradient(circle, rgba(255,226,190,.62) 1.7px, rgba(0,0,0,0) 2.2px) center/9px 9px,
    rgba(0,0,0,.2);
  background-clip:content-box, border-box; padding:calc(var(--tile)*.2) 3px;
}
.griff:active{background-color:rgba(0,0,0,.34);}

.set.teilt .t.hoch{margin:0 3px;}
#platz{
  position:absolute; pointer-events:none; border:3px dashed #ffd23a; border-radius:8px;
  background:rgba(255,210,58,.16); box-sizing:border-box;
}
#geist.satz{transform:none; background:transparent; padding:0; box-shadow:none;}
#geist.satz .set{box-shadow:0 12px 26px rgba(0,0,0,.55); background:rgba(22,28,34,.62);}
.drop{
  display:flex; flex:0 0 auto; align-items:center; justify-content:center;
  width:calc(var(--tile)*.8); height:calc(var(--tile)*1.34); margin-left:4px;
  border:3px dashed rgba(255,210,58,.75); border-radius:6px; color:#ffd23a;
  font-size:calc(var(--tile)*.6); line-height:1; font-weight:bold;
  background:rgba(255,210,58,.13); cursor:pointer;
  visibility:hidden;                 /* Platz bleibt reserviert */
}
.legen .satzbox:not(.zu) .drop{visibility:visible;}
.satzbox.ziel .drop{background:rgba(255,210,58,.4); border-style:solid;}
/* Schmale Schirme: Griff, Rahmen und Ablegefeld muessen zusammen in EINE
   Spalte passen (Steinbreite + 2px), sonst stossen dicht gepackte Saetze an. */
@media (max-width:560px){
  .griff{width:calc(var(--tile)*.32); margin-right:1px; padding-left:2px; padding-right:2px;}
  .drop{width:calc(var(--tile)*.36); margin-left:2px; font-size:calc(var(--tile)*.36); border-width:2px;}
}
#neuSatz{
  position:absolute; display:flex; align-items:center; justify-content:center; cursor:pointer;
  height:calc(var(--tile)*1.34 + 10px); padding:0 12px; box-sizing:border-box;
  border:3px dashed rgba(255,210,58,.75); border-radius:8px; color:#ffd23a;
  background:rgba(255,210,58,.13); font-size:13px; font-weight:bold; text-align:center;
}
#neuSatz.ziel{background:rgba(255,210,58,.4); border-style:solid;}
.satzbox.ziel .set{outline:3px solid #ffd23a; outline-offset:2px;}
.satzbox.nein .set{outline:3px solid #e0463a; outline-offset:2px;}
.set.arbeit{border-style:dashed;}
/* Solange man noch nicht raus ist, sind fremde Saetze zu. */
.legen .satzbox.zu .set{opacity:.42; border-color:#8a7a68; filter:saturate(.5);}

/* ---------- gehobene Steine bleiben sichtbar, wo sie herkommen ---------- */
.t.hoch{
  outline:3px solid #ffd23a; outline-offset:-1px; z-index:3;
  transform:translateY(-6px); box-shadow:0 7px 12px rgba(0,0,0,.45);
}
.t.hoch::before{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:rgba(255,210,58,.18); pointer-events:none;
}
body.ordne .t.hoch{opacity:.32;}

/* ---------- Der frisch gezogene Stein, einmal gross ---------- */
#gezogen{
  position:fixed; inset:0; z-index:55; display:none; pointer-events:none;
  align-items:center; justify-content:center; background:rgba(20,6,0,.66);
}
#gezogen.an{display:flex;}
#gezogen .karte{
  --tile:104px; display:flex; flex-direction:column; align-items:center; gap:16px;
  animation:auftauchen .2s ease-out;
}
#gezogen .karte b{
  font-size:16px; color:#ffe6c6; font-weight:bold; letter-spacing:1px;
  background:rgba(0,0,0,.5); border-radius:14px; padding:5px 18px;
}
#gezogen .t{box-shadow:0 16px 34px rgba(0,0,0,.6), inset 0 1px 0 #fff;}
@keyframes auftauchen{from{opacity:0; transform:scale(.6);} to{opacity:1; transform:scale(1);}}
/* und danach in der Hand kurz markiert, damit man ihn wiederfindet */
.t.frisch{outline:3px solid #4fbf5f; outline-offset:-1px;}
.t.frisch::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:rgba(79,191,95,.16); pointer-events:none;
}

/* ---------- Geist am Finger ---------- */
#geist{
  position:fixed; left:0; top:0; z-index:60; pointer-events:none; display:none;
  gap:var(--gap); padding:3px; border-radius:6px; background:rgba(255,210,58,.22);
  box-shadow:0 10px 22px rgba(0,0,0,.5); transform:translate(-50%,-60%);
}
#geist.an{display:flex;}

/* ---------- Dialoge ---------- */
#veil{position:absolute; inset:0; background:rgba(20,6,0,.66); display:none; z-index:40;
  align-items:center; justify-content:center; padding:14px; overflow:auto;}
#veil.on{display:flex;}
.dlg{
  background:linear-gradient(170deg,#fdf1e2,#eddcc4); color:#4a1d07; border-radius:12px;
  border:3px solid #a75c22; box-shadow:0 14px 40px rgba(0,0,0,.6);
  max-width:520px; width:100%; max-height:100%; overflow:auto; padding:16px 18px 18px;
}
.dlg h2{margin:0 0 8px; font-size:22px; color:#7a2f18;}
.dlg h3{margin:14px 0 4px; font-size:15px; color:#7a2f18;}
.dlg p,.dlg li{font-size:14px; line-height:1.5; margin:5px 0;}
.dlg ul{margin:4px 0; padding-left:20px;}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.row .btn{flex:1 1 auto; min-height:40px; font-size:14px;}
.lvl{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
.lvl button{
  display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer;
  border:2px solid #a75c22; border-radius:8px; padding:9px 12px; font-size:15px; font-weight:bold;
  background:linear-gradient(180deg,#fff6ea,#e8d3b6); color:#4a1d07; font-family:inherit;
}
.lvl button:active{background:linear-gradient(180deg,#e8d3b6,#fff6ea);}
.lvl b{flex:1 1 auto;}
.lvl span{font-size:12px; font-weight:normal; opacity:.8;}
.lvl em{font-style:normal; background:#7a2f18; color:#ffe4c4; border-radius:10px; padding:2px 9px; font-size:13px;}
.reg{margin:14px 0 4px;}
.reg .kopf{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.reg .kopf b{font-size:15px; color:#7a2f18;}
.reg .kopf em{
  font-style:normal; font-weight:bold; font-size:16px; color:#4a1d07;
  background:#ffe9c9; border:2px solid #a75c22; border-radius:12px; padding:1px 12px; white-space:nowrap;
}
.reg .txt{font-size:13px; line-height:1.4; opacity:.82; margin:2px 0 0; min-height:32px;}
.reg .skala{display:flex; justify-content:space-between; font-size:11px; opacity:.6; margin-top:-4px;}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:32px; background:transparent;
  margin:2px 0 0; display:block;
}
input[type=range]:focus{outline:none;}
input[type=range]::-webkit-slider-runnable-track{
  height:12px; border-radius:6px; border:1px solid #8c4a17;
  background:linear-gradient(90deg,#f3d0a6,#c9702f);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:30px; height:30px; margin-top:-10px; border-radius:50%;
  background:linear-gradient(180deg,#fff6ea,#dd8f45); border:2px solid #7a2f18;
  box-shadow:0 2px 4px rgba(0,0,0,.35); cursor:pointer;
}
input[type=range]::-moz-range-track{
  height:12px; border-radius:6px; border:1px solid #8c4a17;
  background:linear-gradient(90deg,#f3d0a6,#c9702f);
}
input[type=range]::-moz-range-thumb{
  width:28px; height:28px; border-radius:50%;
  background:linear-gradient(180deg,#fff6ea,#dd8f45); border:2px solid #7a2f18; cursor:pointer;
}
.namen{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 10px;}
.namen label{display:flex; flex-direction:column; gap:2px; flex:1 1 120px; font-size:12px; opacity:.85;}
.namen input{
  font-family:inherit; font-size:15px; font-weight:bold; color:#4a1d07;
  background:#fff6ea; border:2px solid #a75c22; border-radius:6px; padding:7px 9px; width:100%;
  min-height:40px;
}
.namen input:focus{outline:none; border-color:#7a2f18; background:#fffdf6;}
.opt{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid rgba(122,47,24,.18);}
.opt label{font-size:14px;}
.sw{
  width:52px; height:28px; border-radius:14px; border:2px solid #a75c22; background:#d9c4a6;
  position:relative; cursor:pointer; flex:0 0 auto;
}
.sw i{position:absolute; top:1px; left:1px; width:22px; height:22px; border-radius:50%;
  background:#7a2f18; transition:left .14s;}
.sw.on{background:#8fd08f;} .sw.on i{left:25px; background:#1c6b1c;}
table.sc{width:100%; border-collapse:collapse; margin-top:8px; font-size:14px;}
table.sc th,table.sc td{padding:5px 6px; border-bottom:1px solid rgba(122,47,24,.2); text-align:left;}
table.sc td.n{text-align:right; font-weight:bold;}
table.sc tr.me{background:rgba(255,210,58,.3);}
.big{font-size:17px; font-weight:bold;}

/* ---------- Startbild ---------- */
#title{text-align:center; margin-bottom:10px;}
#title .nm{font-size:44px; font-weight:bold; color:#7a2f18; letter-spacing:2px; line-height:1;
  text-shadow:2px 2px 0 #ffdcb8, 4px 4px 0 rgba(0,0,0,.14);}
#title svg{width:76px; height:76px; display:block; margin:0 auto -4px;}
#title .mk svg{width:104px; height:108px;}

/* ---------- Schmale Schirme: Symbolleiste auf Symbole eindampfen ---------- */
@media (max-width:560px){
  #bar{gap:2px; padding:2px 2px calc(2px + env(safe-area-inset-bottom)); flex-wrap:nowrap;}
  .btn{min-width:42px; padding:2px 3px;}
  #bSortN, #bSortC, #bSortM{display:none;}
  .nurHandy{display:flex;}
  .btn .lbl{font-size:9px; line-height:1.1;}
  .btn .ico{font-size:20px;}
  #bPlay{min-width:54px; font-size:12px;}
  #stack{min-width:30px; font-size:14px; padding:2px 2px;}
  #stack small{display:none;}
  #foes{padding:3px 4px; gap:4px;}
  .foe .bars{display:none;}
  #status{font-size:12.5px; padding:3px 6px; min-height:22px;}
}

/* ---------- Fingerbedienung ---------- */
@media (pointer:coarse){
  .btn{min-width:50px; min-height:48px; font-size:12px;}
  .btn .ico{font-size:19px;}
  #stack{min-width:54px; font-size:17px;}
  .foe{font-size:13px; padding:4px 9px;}
  .lvl button{padding:13px 14px; font-size:16px;}
  .row .btn{min-height:50px; font-size:15px;}
  .dlg p,.dlg li{font-size:15px;}
  .sw{width:58px; height:32px; border-radius:16px;}
  .sw i{width:26px; height:26px;} .sw.on i{left:27px;}
  input[type=range]{height:40px;}
  input[type=range]::-webkit-slider-thumb{width:36px; height:36px; margin-top:-13px;}
  input[type=range]::-moz-range-thumb{width:34px; height:34px;}
}

/* ---------- Schmal UND Finger: die Leiste teilt sich den Platz auf ---------- */
@media (max-width:560px){
  #spacer{display:none;}
  #bar .btn{min-width:0; flex:1 1 0; min-height:48px; padding:2px 1px; overflow:hidden; container-type:inline-size;}
  #bar .btn .ico{font-size:clamp(11px, 42cqi, 19px); white-space:nowrap;}
  #bar #bSort .ico{font-size:clamp(9px, 30cqi, 17px); letter-spacing:-.04em;}
  #bar .btn .lbl{font-size:clamp(7px, 19cqi, 10px); white-space:nowrap;}
  #bPlay{flex:2.1 1 0; min-width:0; font-size:12px;}
  #bPlay #playTxt{font-size:clamp(9px, 22cqi, 12px);}
  #stack{flex:0 0 auto; min-width:28px; padding:2px 3px;}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="foes"></div>
  <div id="status"><span id="statusTxt"></span></div>
  <div id="tableframe"><div id="table"></div><div id="hint"></div></div>
  <div id="handbar"><span id="handCnt">0</span><div id="hand"></div></div>
  <div id="bar">
    <button class="btn" id="bEcke"><span class="ico"><img class="ecke-ico" src="favicon.svg" alt=""></span><span class="lbl">Spieleecke</span></button>
    <button class="btn" id="bMenu"><span class="ico">&#9776;</span><span class="lbl">Menü</span></button>

  </div>
</div>

<div id="gezogen"></div>
<div id="veil"><div class="dlg" id="dlg"></div></div>
<script>
"use strict";

/* ==================================================================
   Teddikub - ein Legespiel mit Zahlensteinen
   Eine Datei, keine Bibliotheken, kein Netz.
   Vorbild ist das Familienspiel mit Zahlenplaettchen; Name, Grafik
   und Regelfeinheiten sind eigene Arbeit.
   ================================================================== */

/* ---------- Speichern mit Rueckfall in den Arbeitsspeicher ---------- */
var memStore = {};
function lsGet(k,d){
  try{ var v=localStorage.getItem(k); if(v!==null) return JSON.parse(v); }catch(e){}
  return (k in memStore) ? memStore[k] : d;
}
function lsSet(k,v){ memStore[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ---------- Einstellungen ---------- */
var cfg = { v:2, minOut:30, ki:2, foes:2, vibrate:true, sortMode:'n', feld:'nacht', feldV:1,
            namen:['Du','Bello','Luna','Nero'] };
var NAMEN_STD = ['Du','Bello','Luna','Nero'];
var savedCfg = lsGet('teddi.cfg', null);
if (savedCfg){
  for (var ck in savedCfg) if (ck in cfg) cfg[ck] = savedCfg[ck];
  if (!(cfg.namen instanceof Array) || cfg.namen.length !== 4) cfg.namen = NAMEN_STD.slice();
  /* Einmalig: Amelie hat sich fuer Nachtblau entschieden (11.09.2026). */
  if (savedCfg.feldV !== 1){ cfg.feld = 'nacht'; cfg.feldV = 1; }
  if (savedCfg.v !== 2){
    /* Einmalige Umstellung: aus der alten Stufe 0..3 werden zwei Werte. */
    var altStufe = savedCfg.level || 1;
    cfg.minOut = [27,30,33,36][altStufe] || 30;
    cfg.ki = altStufe + 1;
    cfg.v = 2;
  }
}
function saveCfg(){ lsSet('teddi.cfg', cfg); }

/* Die zwei Achsen der Schwierigkeit. */
var MIN_KLEIN = 15, MIN_GROSS = 50;
var KI_NAMEN = ['', 'Anfänger', 'Fortgeschritten', 'Stark', 'Meister', 'Großmeister'];
var KI_TEXTE = ['',
  'legen höchstens einen Satz je Zug und hängen nichts an',
  'legen alles, was aus ihrer Hand geht, und hängen an',
  'bauen dazu den ganzen Tisch um',
  'bauen um und rechnen jeden Zug länger durch',
  'rechnen am längsten, nutzen jede Teilung und bauen bei Bedarf zweimal um'];
function begrenze(x, a, b){ return x < a ? a : (x > b ? b : x); }
var FELDER = [
  { id:'nacht',    name:'Nachtblau' },
  { id:'filz',     name:'Filz grün' },
  { id:'petrol',   name:'Filz petrol' },
  { id:'eiche',    name:'Eiche' },
  { id:'kork',     name:'Kork' },
  { id:'schiefer', name:'Schiefer' },
  { id:'holz',     name:'Holz dunkel' }
];
function feldAnwenden(){
  var ok = false, i;
  for (i=0;i<FELDER.length;i++) if (FELDER[i].id === cfg.feld) ok = true;
  if (!ok) cfg.feld = 'nacht';
  var fr = document.getElementById('tableframe');
  for (i=0;i<FELDER.length;i++) fr.classList.remove('feld-' + FELDER[i].id);
  fr.classList.add('feld-' + cfg.feld);
}
function spielerName(i){
  var n = (cfg.namen && cfg.namen[i] || '').toString().trim();
  return n ? n.slice(0,14) : NAMEN_STD[i];
}
function stufenKurz(){ return cfg.minOut + ' Punkte · ' + KI_NAMEN[cfg.ki]; }

var FARBEN = ['#1b1b1b','#e07b17','#16803c','#cf2020'];
var FARBNAMEN = ['Schwarz','Orange','Gruen','Rot'];

/* ==================================================================
   Teddy - abstrahiert. Kopf(gross) fuer Dialoge, Marke(klein) fuer Steine.
   ================================================================== */

/* Der Jokerstein: sehr wenige Formen, damit er bei 34 px noch liest. */
function lockenKranz(cx, cy, r, n){
  /* Ein Kreis, dessen Rand aus n nach aussen gewoelbten Boegen besteht -
     das ist die Abkuerzung fuer "lockiges Fell". */
  var d = '', i, a, x, y, x2, y2;
  var bogen = (r * Math.sin(Math.PI / n) * 1.04).toFixed(2);
  for (i=0;i<n;i++){
    a  = (i/n)*Math.PI*2 - Math.PI/2;
    x  = cx + Math.cos(a)*r;  y  = cy + Math.sin(a)*r;
    a  = ((i+1)/n)*Math.PI*2 - Math.PI/2;
    x2 = cx + Math.cos(a)*r;  y2 = cy + Math.sin(a)*r;
    if (i === 0) d = 'M' + x.toFixed(1) + ' ' + y.toFixed(1);
    d += 'A' + bogen + ' ' + bogen + ' 0 0 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }
  return d + 'Z';
}
function teddiMarke(){
  /* Teddi als flache Marke: lockiger Kopf, lockige Schlappohren,
     helles Bartfeld, Nase, zwei Augen. Wenige Formen, damit er auf einem
     30 px breiten Stein noch als Hund lesbar bleibt. */
  return '<svg viewBox="0 0 100 104" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="'+lockenKranz(19,57,15,7)+'" fill="#4b3421"/>'+
    '<path d="'+lockenKranz(81,57,15,7)+'" fill="#4b3421"/>'+
    '<path d="'+lockenKranz(50,44,29,11)+'" fill="#75523a"/>'+
    '<path d="'+lockenKranz(50,73,21,9)+'" fill="#efe7da"/>'+
    '<path d="M40 64 C44 59 56 59 60 64 C62 69 56 74 50 74 C44 74 38 69 40 64 Z" fill="#2b1d15"/>'+
    '<path d="M50 74 L50 79 M50 79 C45 86 39 85 37 80 M50 79 C55 86 61 85 63 80"'+
      ' stroke="#2b1d15" stroke-width="3.4" fill="none" stroke-linecap="round"/>'+
    '<circle cx="36" cy="43" r="5.2" fill="#2b1d15"/>'+
    '<circle cx="64" cy="43" r="5.2" fill="#2b1d15"/>'+
    '</svg>';
}

/* Der grosse Teddy - Bauteilsatz aus teddy-varianten.html, ohne Doktorhut. */
function teddyKopf(o){
  o = o || {};
  var eyes = o.eyes || 'normal', mouth = o.mouth || 'neutral';
  var s = '';
  s += '<path d="M34 50 C19 54 13 72 15 87 C17 99 27 104 34 98 C29 84 28 66 34 54 Z" fill="#57402f"/>'+
       '<path d="M86 50 C101 54 107 72 105 87 C103 99 93 104 86 98 C91 84 92 66 86 54 Z" fill="#57402f"/>'+
       '<path d="M31 58 C22 64 19 76 21 86" stroke="#4a3527" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>'+
       '<path d="M89 58 C98 64 101 76 99 86" stroke="#4a3527" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>';
  s += '<path d="M60 28 C79 28 91 41 92 57 C93 73 84 88 60 91 C36 88 27 73 28 57 C29 41 41 28 60 28 Z" fill="#6b4d36"/>'+
       '<path d="M36 44 C44 33 58 30 68 34 C60 38 50 42 44 50 Z" fill="#7a5b42" opacity=".85"/>'+
       '<path d="M84 52 C88 62 87 74 81 82 C84 70 84 60 80 52 Z" fill="#7a5b42" opacity=".7"/>'+
       '<path d="M33 60 C31 70 33 80 39 86 C34 76 34 68 36 60 Z" fill="#5b4130" opacity=".8"/>'+
       '<path d="M52 33 C60 31 70 33 76 38 C68 37 60 37 52 39 Z" fill="#5b4130" opacity=".6"/>';
  s += '<path d="M42 70 C46 86 74 86 78 70 C81 82 73 92 60 93 C47 92 39 82 42 70 Z" fill="#cdc5b6"/>'+
       '<ellipse cx="60" cy="72" rx="13" ry="9.5" fill="#ddd6c9"/>';
  if (mouth === 'tongue')
    s += '<path d="M54 79 C54 90 66 90 66 79 C64 84 56 84 54 79 Z" fill="#d98a8a"/>';
  s += '<path d="M53 67 C56 63.5 64 63.5 67 67 C68.4 70.4 64.4 73.6 60 73.6 C55.6 73.6 51.6 70.4 53 67 Z" fill="#2e2019"/>'+
       '<ellipse cx="57.4" cy="66.8" rx="2" ry="1.2" fill="#5a4a41" opacity=".8"/>'+
       '<path d="M60 74 L60 77 M60 77 C55.5 83 50 82 48 78.5 M60 77 C64.5 83 70 82 72 78.5"'+
       ' stroke="#3a2b21" stroke-width="2.1" fill="none" stroke-linecap="round"/>';
  if (eyes === 'closed')
    s += '<path d="M42 57 C46 53 52 53 55 57 M65 57 C68 53 74 53 78 57" stroke="#291b13"'+
         ' stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  else if (eyes === 'wide')
    s += '<ellipse cx="47.5" cy="56" rx="5.4" ry="5.8" fill="#291b13"/>'+
         '<ellipse cx="72.5" cy="56" rx="5.4" ry="5.8" fill="#291b13"/>'+
         '<ellipse cx="49" cy="54" rx="1.6" ry="1.4" fill="#fff" opacity=".7"/>'+
         '<ellipse cx="74" cy="54" rx="1.6" ry="1.4" fill="#fff" opacity=".7"/>';
  else
    s += '<ellipse cx="47.5" cy="56.5" rx="4.1" ry="4.4" fill="#291b13"/>'+
         '<ellipse cx="72.5" cy="56.5" rx="4.1" ry="4.4" fill="#291b13"/>'+
         '<ellipse cx="48.8" cy="55" rx="1.2" ry="1.1" fill="#fff" opacity=".65"/>'+
         '<ellipse cx="73.8" cy="55" rx="1.2" ry="1.1" fill="#fff" opacity=".65"/>';
  s += '<path d="M40 51 C45 47 53 47 56 51 C50 49.5 45 49.5 40 51 Z" fill="#5b4130"/>'+
       '<path d="M64 51 C67 47 75 47 80 51 C75 49.5 70 49.5 64 51 Z" fill="#5b4130"/>';
  return s;
}
function teddyKonfetti(){
  var bits=[[10,18,'#e8412c',18],[104,40,'#2f8f30',-24],[22,96,'#2079d8',36],[100,96,'#f6a021',-12],
            [42,8,'#8b3fbf',12],[76,2,'#00a6a6',-30],[2,58,'#f6a021',-40],[112,72,'#e8412c',22],
            [30,120,'#2f8f30',28],[92,124,'#8b3fbf',-18],[118,52,'#2079d8',44],[0,96,'#e8412c',-34],
            [58,124,'#f6a021',8],[16,4,'#2079d8',-16]];
  var s='';
  bits.forEach(function(b){
    s += '<rect x="'+b[0]+'" y="'+b[1]+'" width="9" height="6" rx="1.5" fill="'+b[2]+
         '" transform="rotate('+b[3]+' '+(b[0]+4)+' '+(b[1]+3)+')"/>';
  });
  s += '<circle cx="16" cy="40" r="3.4" fill="#ffd23a"/><circle cx="108" cy="18" r="3" fill="#e8412c"/>'+
       '<circle cx="88" cy="118" r="3.2" fill="#2079d8"/>';
  return s;
}
function svgWrap(inner){
  return '<svg viewBox="-8 -8 136 136" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
}
/* Teddy jubelt - fuer die Ergebnisseite. */
function teddyJubel(){
  return svgWrap(teddyKonfetti() +
    '<g transform="rotate(-4 60 64)">'+teddyKopf({eyes:'closed', mouth:'tongue'})+'</g>');
}
function teddyRuhig(){ return svgWrap(teddyKopf({})); }

/* ==================================================================
   Steine, Saetze, Regeln
   ------------------------------------------------------------------
   Stein:  {id, c:0..3, n:1..13, j:false}   Joker: {id, j:true}
   Satz:   {id, tiles:[...]}  - nach der Pruefung zusaetzlich
           .ok, .kind ('g'=Gruppe, 'r'=Reihe), .order, .vals, .pts
   Reihen laufen im Kreis: nach 13 geht es bei 1 weiter.
   ================================================================== */

var nextId = 1;
function mkTile(c,n){ return {id:nextId++, c:c, n:n, j:false}; }
function mkJoker(){ return {id:nextId++, c:null, n:null, j:true}; }

function neuerVorrat(){
  var a = [], c, n, k;
  for (k=0;k<2;k++) for (c=0;c<4;c++) for (n=1;n<=13;n++) a.push(mkTile(c,n));
  a.push(mkJoker()); a.push(mkJoker());
  return mischen(a);
}
function mischen(a){
  for (var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* zyklischer Nachfolger / Fensterprobe */
function inWindow(n, start, len){
  var d = n - start; if (d < 0) d += 13;
  return d < len;
}
function stepN(start, k){ var n = ((start - 1 + k) % 13); if (n < 0) n += 13; return n + 1; }

/* ---------- Satzpruefung ---------- */
function checkSet(tiles){
  var res = { ok:false, kind:null, order:tiles.slice(), vals:null, pts:0, why:'' };
  var L = tiles.length;
  if (L < 3){ res.why = 'Ein Satz braucht mindestens drei Steine.'; return res; }
  if (L > 13){ res.why = 'Mehr als dreizehn Steine gehen nicht.'; return res; }
  var reals = [], jok = 0, i;
  for (i=0;i<L;i++){ if (tiles[i].j) jok++; else reals.push(tiles[i]); }
  if (jok === 0 && reals.length === 0) return res;
  if (jok > reals.length){ res.why = 'Es duerfen nie mehr Teddis als echte Steine in einem Satz sein.'; return res; }

  /* --- Gruppe: gleiche Zahl, verschiedene Farben --- */
  var groupOk = L <= 4 && reals.length > 0;
  if (groupOk){
    var num = reals[0].n, seen = {};
    for (i=0;i<reals.length;i++){
      if (reals[i].n !== num || seen[reals[i].c]) { groupOk = false; break; }
      seen[reals[i].c] = 1;
    }
    if (groupOk){
      var frei = [], c;
      for (c=0;c<4;c++) if (!seen[c]) frei.push(c);
      if (frei.length >= jok){
        var ord = reals.slice().sort(function(a,b){ return a.c-b.c; });
        var vals = [], f = 0, out = [];
        for (i=0;i<reals.length;i++){ out.push(ord[i]); vals.push({c:ord[i].c, n:num}); }
        for (i=0;i<L;i++) if (tiles[i].j){ out.push(tiles[i]); vals.push({c:frei[f++], n:num}); }
        res.ok = true; res.kind = 'g'; res.order = out; res.vals = vals; res.pts = num * L;
        return res;
      }
    }
  }

  /* --- Reihe: gleiche Farbe, fortlaufend, im Kreis --- */
  if (reals.length > 0){
    var col = reals[0].c, nums = {}, good = true;
    for (i=0;i<reals.length;i++){
      if (reals[i].c !== col || nums[reals[i].n]) { good = false; break; }
      nums[reals[i].n] = reals[i];
    }
    if (good){
      var best = null, s;
      for (s=1;s<=13;s++){
        var fits = true;
        for (i=0;i<reals.length;i++) if (!inWindow(reals[i].n, s, L)) { fits = false; break; }
        if (!fits) continue;
        /* Anordnung aufbauen */
        var o2 = [], v2 = [], jl = [], k, want, randJ = 0, sum = 0;
        for (i=0;i<L;i++) if (tiles[i].j) jl.push(tiles[i]);
        var jn = 0;
        for (k=0;k<L;k++){
          want = stepN(s, k);
          if (nums[want]) { o2.push(nums[want]); }
          else {
            if (jn >= jl.length) { o2 = null; break; }
            o2.push(jl[jn++]);
            if (k === 0 || k === L-1) randJ++;
          }
          v2.push({c:col, n:want}); sum += want;
        }
        if (!o2 || jn !== jl.length) continue;
        var cand = { s:s, order:o2, vals:v2, pts:sum, randJ:randJ };
        /* Teddi lieber innen als am Rand, sonst die punktreichere Lage */
        if (!best || cand.randJ < best.randJ ||
            (cand.randJ === best.randJ && cand.pts > best.pts)) best = cand;
      }
      if (best){
        res.ok = true; res.kind = 'r'; res.order = best.order; res.vals = best.vals; res.pts = best.pts;
        return res;
      }
    }
  }
  res.why = res.why || 'Das ist weder eine Gruppe gleicher Zahlen noch eine fortlaufende Reihe.';
  return res;
}
function setPunkte(tiles){ var r = checkSet(tiles); return r.ok ? r.pts : 0; }

/* Handwert fuer die Schlussabrechnung: Teddi zaehlt 25. */
function handWert(tiles){
  var s = 0;
  for (var i=0;i<tiles.length;i++) s += tiles[i].j ? 25 : tiles[i].n;
  return s;
}

/* ==================================================================
   Der Rechner fuer die Gegner
   ------------------------------------------------------------------
   Gearbeitet wird auf Zaehl-Feldern statt auf Steinen:
     idx = farbe*13 + (zahl-1),  dazu die Anzahl der Teddis.
   ================================================================== */

function idxOf(c,n){ return c*13 + (n-1); }
function idxCol(i){ return (i/13)|0; }
function idxNum(i){ return i%13 + 1; }

/* Alle Saetze, die Sorte `a` enthalten und aus (cnt, jok) baubar sind.
   Rueckgabe je Satz: {need:[idx,...], jok:k, len:L}  */
function setsWith(a, cnt, jok){
  var out = [], col = idxCol(a), num = idxNum(a), i, k, L, s, sub;

  /* Gruppen: gleiche Zahl, andere Farben */
  var andere = [];
  for (i=0;i<4;i++) if (i !== col && cnt[idxOf(i,num)] > 0) andere.push(i);
  for (sub=0; sub < (1<<andere.length); sub++){
    var pick = [];
    for (k=0;k<andere.length;k++) if (sub & (1<<k)) pick.push(andere[k]);
    for (var jj=0; jj<=jok && jj<=2; jj++){
      L = 1 + pick.length + jj;
      if (L < 3 || L > 4) continue;
      if (jj > 1 + pick.length) continue;
      if (pick.length + 1 + jj > 4) continue;
      var need = [a];
      for (k=0;k<pick.length;k++) need.push(idxOf(pick[k],num));
      out.push({need:need, jok:jj, len:L});
    }
  }

  /* Reihen in der Farbe col, im Kreis, die `num` enthalten.
     Teddis stehen nie am Rand einer Reihe - das waere immer die kuerzere
     Reihe plus ein verschwendeter Teddi und blaeht die Suche nur auf. */
  var gesehen = {};
  for (L=3; L<=13; L++){
    for (var off=0; off<L; off++){
      s = stepN(num, -off);
      if (cnt[idxOf(col, s)] < 1) continue;
      if (cnt[idxOf(col, stepN(s, L-1))] < 1) continue;
      var nd = [], nj = 0, drin = false;
      for (k=0;k<L;k++){
        var w = idxOf(col, stepN(s,k));
        if (cnt[w] > 0){ nd.push(w); if (w === a) drin = true; }
        else nj++;
      }
      if (nj > jok || nj > L - nj || !drin) continue;
      var sig = nd.join('.') + '/' + nj;
      if (gesehen[sig]) continue;
      gesehen[sig] = 1;
      out.push({need:nd, jok:nj, len:L});
    }
  }
  return out;
}

/* ---------- Der Umbau-Rechner ---------- */
var LOSE = { score:-1e9, sets:null };

function rechne(tischSorten, tischJok, handSorten, handJok, msLimit, wUsed){
  if (wUsed === undefined) wUsed = 100;
  var tc = tischSorten.slice(), hc = handSorten.slice();
  var jT = tischJok, jH = handJok;
  var memo = {}, ende = Date.now() + msLimit, abgebrochen = false, knoten = 0;
  /* Zustand als kurze Zeichenkette: je Sorte ein Zeichen, dazu die Teddis.
     Wird bei jedem Zug mitgefuehrt statt jedesmal neu gebaut. */
  var zust = new Array(54), alle = new Array(52), ii;
  for (ii=0;ii<52;ii++){ alle[ii] = tc[ii] + hc[ii]; zust[ii] = 65 + tc[ii]*3 + hc[ii]; }
  zust[52] = 65 + jT; zust[53] = 65 + jH;
  function setz(i){ zust[i] = 65 + tc[i]*3 + hc[i]; alle[i] = tc[i] + hc[i]; }
  function key(){ return String.fromCharCode.apply(null, zust); }

  function nimm(st){
    var hUsed = 0, hPts = 0, i, x, jk = st.jok;
    var log = { t:[], h:[], jt:0, jh:0 };
    for (i=0;i<st.need.length;i++){
      x = st.need[i];
      if (tc[x] > 0){ tc[x]--; setz(x); log.t.push(x); }
      else if (hc[x] > 0){ hc[x]--; setz(x); log.h.push(x); hUsed++; hPts += idxNum(x); }
      else { zurueck(log); return null; }
    }
    while (jk > 0){
      if (jT > 0){ jT--; zust[52] = 65 + jT; log.jt++; }
      else if (jH > 0){ jH--; zust[53] = 65 + jH; log.jh++; hUsed++; hPts += 12; }
      else { zurueck(log); return null; }
      jk--;
    }
    log.hUsed = hUsed; log.hPts = hPts;
    return log;
  }
  function zurueck(log){
    var i;
    for (i=0;i<log.t.length;i++){ tc[log.t[i]]++; setz(log.t[i]); }
    for (i=0;i<log.h.length;i++){ hc[log.h[i]]++; setz(log.h[i]); }
    jT += log.jt; jH += log.jh;
    zust[52] = 65 + jT; zust[53] = 65 + jH;
  }

  function rec(){
    if (++knoten % 256 === 0 && Date.now() > ende){ abgebrochen = true; }
    if (abgebrochen) return LOSE;
    var k = key();
    if (memo[k]) return memo[k];
    var i, anchor = -1, pflicht = false, mussJok = false;
    for (i=0;i<52;i++) if (tc[i] > 0){ anchor = i; pflicht = true; break; }
    if (anchor < 0 && jT > 0){
      for (i=0;i<52;i++) if (hc[i] > 0){ anchor = i; break; }
      if (anchor < 0) return (memo[k] = LOSE);
      mussJok = true;
    }
    if (anchor < 0){
      for (i=0;i<52;i++) if (hc[i] > 0){ anchor = i; break; }
      if (anchor < 0) return (memo[k] = { score:0, sets:[] });
    }
    var kand = setsWith(anchor, alle, jT + jH), best = LOSE;

    /* ohne diesen Stein weiter - nur erlaubt, wenn er von der Hand kommt */
    if (!pflicht){
      hc[anchor]--; setz(anchor);
      var r0 = rec();
      hc[anchor]++; setz(anchor);
      if (r0.score > best.score) best = { score:r0.score, sets:r0.sets };
    }
    for (var q=0; q<kand.length; q++){
      if (abgebrochen) break;
      if (mussJok && kand[q].jok < 1) continue;
      var log = nimm(kand[q]);
      if (!log) continue;
      var r = rec();
      if (r.score > -1e8){
        var sc = r.score + wUsed*log.hUsed + log.hPts;
        if (sc > best.score) best = { score:sc, sets:[kand[q]].concat(r.sets) };
      }
      zurueck(log);
    }
    if (jH > 0 && !pflicht && !mussJok && best.score < 0){
      /* uebrige Teddis in der Hand duerfen liegen bleiben */
      best = { score:0, sets:[] };
    }
    return (memo[k] = best);
  }

  var erg = rec();
  return { ok: !abgebrochen && erg.score > -1e8, score: erg.score, sets: erg.sets || [], abgebrochen: abgebrochen };
}

/* ==================================================================
   Spielstand
   ================================================================== */
var G = {
  deck: [], spieler: [], dran: 0, saetze: [],
  gehoben: [],            /* ids der aufgehobenen Steine, in Aufhebe-Reihenfolge */
  laeuft: false, minOut: 30, kiStufe: 2,
  undo: [], zugStart: null, runde: 0, warten: false
};
var setId = 1;

function el(id){ return document.getElementById(id); }
var $table = el('table'), $hand = el('hand'), $handbar = el('handbar'),
    $foes = el('foes'), $hint = el('hint'), $veil = el('veil'), $dlg = el('dlg'),
    $status = el('status'), $statusTxt = el('statusTxt'), $geist = el('geist'),
    $frame = el('tableframe');

/* Teddikub ist still - kein Ton, nur die Vibration, wenn sie an ist. */
function summ(ms){ if (cfg.vibrate && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

/* ==================================================================
   Aufheben und Hinlegen
   ------------------------------------------------------------------
   Es gibt keine Ablage mehr. Aufgehobene Steine bleiben sichtbar da
   liegen, wo sie herkommen, nur eben angehoben. Erst beim Hinlegen
   wandern sie. So sieht man jederzeit, woraus man gerade baut, und
   kann aus mehreren Saetzen gleichzeitig Steine ziehen.
   ================================================================== */
function istHoch(id){ return G.gehoben.indexOf(id) >= 0; }
function hochSteine(){
  var raus = [], i, t;
  for (i=0;i<G.gehoben.length;i++){ t = tileById(G.gehoben[i]); if (t) raus.push(t); }
  return raus;
}
/* Was von einem Satz gerade wirklich liegt - ohne die aufgehobenen Steine. */
function satzRest(st){
  var raus = [], i;
  for (i=0;i<st.tiles.length;i++) if (!istHoch(st.tiles[i].id)) raus.push(st.tiles[i]);
  return raus;
}
function handRest(){
  var h = G.spieler[0].hand, raus = [], i;
  for (i=0;i<h.length;i++) if (!istHoch(h[i].id)) raus.push(h[i]);
  return raus;
}
function legenAktiv(){ return G.gehoben.length > 0; }
/* Vor dem Rauskommen zaehlen nur eigene Saetze. An fremde darf man dann
   gar nicht erst anlegen - das wird gesperrt, nicht hinterher geruegt.
   Saetze, die man in diesem Zug selbst gelegt hat, bleiben offen. */
function darfAnlegen(st){
  if (G.spieler[0].aus) return true;
  for (var i=0;i<st.tiles.length;i++) if (!warInHand(st.tiles[i])) return false;
  return true;
}

/* ==================================================================
   Tischraster
   ------------------------------------------------------------------
   Saetze liegen frei auf dem Tisch, eingerastet in ein Raster:
   eine Spalte = eine Steinbreite, eine Zeile = eine Satzhoehe.
   Ein Satz belegt in seiner Zeile die Spalten [x, x+breite).
   Nichts verschiebt sich von allein - ausser ein Satz waechst in
   seinen Nachbarn hinein; dann weicht der Nachbar zum naechsten
   freien Platz aus.
   ================================================================== */
var RAND = 10;
/* Auf schmalen Schirmen ist jeder Satz eine Spalte schmaler und die Sätze
   rücken enger zusammen - sonst passt neben einen kurzen Satz nichts mehr. */
function schmal(){ return document.documentElement.clientWidth <= 560; }
function luft(){ return schmal() ? 1 : 2; }
function satzRand(){ return schmal() ? 1 : 2; }
function rasterMass(){
  var T = G.tile || 40;
  var u = T + 2, v = Math.round(T*1.34) + 10 + 14;
  var breite = $frame.clientWidth || 800;
  return { T:T, u:u, v:v, spalten: Math.max(5, Math.floor((breite - 2*RAND) / u)) };
}
/* Griff + Steine + Ablegefeld + Luft, in Spalten */
function satzBreite(st){ return (typeof st === 'number' ? st : st.tiles.length) + satzRand(); }
function boxPixel(n, m){ return n*(m.T+2) + Math.round((schmal() ? 0.68 : 1.36)*m.T) + (schmal() ? 11 : 14); }
function satzById(id){
  for (var i=0;i<G.saetze.length;i++) if (G.saetze[i].id === id) return G.saetze[i];
  return null;
}
function belegt(x, y, w, ohneId, m){
  if (x < 0 || y < 0) return true;
  if (x + w > m.spalten && !(x === 0 && w > m.spalten)) return true;
  for (var i=0;i<G.saetze.length;i++){
    var o = G.saetze[i];
    if (o.id === ohneId || o.x == null || o.y !== y) continue;
    if (x < o.x + satzBreite(o) && o.x < x + w) return true;
  }
  return false;
}
function tiefsteZeile(){
  var y = -1;
  for (var i=0;i<G.saetze.length;i++) if (G.saetze[i].y != null && G.saetze[i].y > y) y = G.saetze[i].y;
  return y;
}
/* Naechster freier Platz zu (x0,y0): erst dieselbe Zeile, dann die Nachbarzeilen.
   `frei` ist optional - ohne gilt der aktuelle Tisch. */
function naechsterPlatz(x0, y0, w, ohneId, m, frei){
  frei = frei || function(x, y){ return !belegt(x, y, w, ohneId, m); };
  var grenze = Math.max(tiefsteZeile(), y0) + 2;
  for (var d=0; d<=grenze; d++){
    var reihen = d === 0 ? [y0] : [y0 + d, y0 - d], best = null;
    for (var r=0;r<reihen.length;r++){
      var y = reihen[r]; if (y < 0) continue;
      for (var x=0; x<=Math.max(0, m.spalten - w); x++)
        if (frei(x, y, w)){
          var dist = Math.abs(x - x0);
          if (!best || dist < best.d) best = { x:x, y:y, d:dist };
        }
    }
    if (best) return { x:best.x, y:best.y };
  }
  return { x:0, y:grenze + 1 };
}
/* Erster freier Platz in Lesereihenfolge, mit LUFT Spalten Abstand zu beiden
   Nachbarn. Ein Satz waechst beim Anlegen nach rechts - die Luft rechts vom
   Vordermann gehoert dem Vordermann, die Luft rechts von uns uns selbst. */
function ersterPlatz(w, m, frei){
  frei = frei || function(x, y, ww){ return !belegt(x, y, ww, null, m); };
  for (var y=0; y<400; y++)
    for (var x=0; x<=Math.max(0, m.spalten - w); x++){
      var L = luft();
      var a = Math.max(0, x - L), b = Math.min(m.spalten, x + w + L);
      if (frei(a, y, b - a) && frei(x, y, w)) return { x:x, y:y };
    }
  return { x:0, y:tiefsteZeile() + 1 };
}
/* Jeder Satz bekommt einen gueltigen, ueberlappungsfreien Platz.
   Wer zuletzt angefasst wurde (G.fixSaetze), behaelt seinen. Wer weichen
   muss, rueckt in seiner Zeile nach rechts; nur wenn dort kein Platz mehr
   ist, zieht er um - und zwar auf wirklich freien Platz, nie auf den eines
   Satzes, der erst spaeter an der Reihe ist. Das verhindert Kettenspruenge. */
function tischOrdnen(){
  var m = rasterMass(), vor = G.fixSaetze || [];
  var plan = G.saetze.map(function(o){ return { o:o, x:o.x, y:o.y, w:satzBreite(o) }; });
  plan.sort(function(a,b){
    var pa = vor.indexOf(a.o.id), pb = vor.indexOf(b.o.id);
    if (pa < 0) pa = 999; if (pb < 0) pb = 999;
    if (pa !== pb) return pa - pb;
    if (a.x == null) return b.x == null ? 0 : 1;
    if (b.x == null) return -1;
    return (a.y - b.y) || (a.x - b.x);
  });
  var fertig = [], warten = plan.filter(function(p){ return p.x != null; });
  function stoesst(liste, x, y, w, id){
    for (var i=0;i<liste.length;i++){
      var b = liste[i];
      if (b.o.id !== id && b.y === y && x < b.x + b.w && b.x < x + w) return true;
    }
    return false;
  }
  function imFeld(x, y, w){ return x >= 0 && y >= 0 && (x + w <= m.spalten || (x === 0 && w > m.spalten)); }
  plan.forEach(function(p){
    warten = warten.filter(function(b){ return b !== p; });
    var id = p.o.id, w = p.w, q = null, x;
    var nurFertig = function(xx, yy, ww){ return imFeld(xx, yy, ww) && !stoesst(fertig, xx, yy, ww, id); };
    var ganzFrei  = function(xx, yy, ww){ return nurFertig(xx, yy, ww) && !stoesst(warten, xx, yy, ww, id); };
    if (p.x != null){
      if (nurFertig(p.x, p.y, w)) q = { x:p.x, y:p.y };
      else {
        for (x = p.x + 1; x + w <= m.spalten; x++)
          if (nurFertig(x, p.y, w)){ q = { x:x, y:p.y }; break; }
        if (!q) q = naechsterPlatz(p.x, p.y, w, id, m, ganzFrei);
      }
    } else q = ersterPlatz(w, m, ganzFrei);
    p.o.x = q.x; p.o.y = q.y; p.x = q.x; p.y = q.y;
    fertig.push(p);
  });
  G.fixSaetze = [];
}
/* Knopf "Ordnen": die Saetze so dicht wie moeglich packen. Die laengsten
   kommen zuerst, jeder weitere in die erste Zeile, in die er noch passt -
   so fuellen kurze Saetze die Luecken neben langen. Extra-Luft braucht es
   nicht: das (unsichtbare) Ablegefeld jedes Satzes haelt sie auseinander. */
function tischAufraeumen(){
  if (!amZug() || !G.saetze.length) return;
  var m = rasterMass(), luecke = 0, zeilen = [];
  var reihe = G.saetze.slice().sort(function(a,b){
    return (b.tiles.length - a.tiles.length) || ((a.y || 0) - (b.y || 0)) || ((a.x || 0) - (b.x || 0));
  });
  reihe.forEach(function(o){
    var w = satzBreite(o), z = null, i;
    for (i=0;i<zeilen.length;i++){
      if (zeilen[i].frei + luecke + w <= m.spalten){ z = zeilen[i]; break; }
    }
    if (!z){ z = { y:zeilen.length, frei:-luecke }; zeilen.push(z); }
    o.x = z.frei + luecke; o.y = z.y;
    z.frei = o.x + w;
  });
  G.fixSaetze = [];
  summ(10); renderAll();
}

/* Bildschirmpunkt -> Rasterfeld */
function rasterVon(cx, cy, runden){
  var m = rasterMass(), r = $table.getBoundingClientRect();
  var fx = (cx - r.left - RAND) / m.u, fy = (cy - r.top - RAND) / m.v;
  var f = runden ? Math.round : Math.floor;
  return { x: Math.max(0, f(fx)), y: Math.max(0, f(fy)) };
}
/* Nach einem Umbau durch einen Gegner: jeder neue Satz erbt den Platz des
   alten, mit dem er die meisten Steine teilt. So bleibt der Tisch ruhig. */
function erbePositionen(alt, neu){
  var vergeben = {};
  neu.forEach(function(ns){
    var ids = {}, best = null, bestN = 0;
    ns.tiles.forEach(function(t){ ids[t.id] = 1; });
    alt.forEach(function(os){
      if (vergeben[os.id] || os.x == null) return;
      var n = 0; os.tiles.forEach(function(t){ if (ids[t.id]) n++; });
      if (n > bestN){ bestN = n; best = os; }
    });
    if (best){ vergeben[best.id] = 1; ns.id = best.id; ns.x = best.x; ns.y = best.y; }
  });
}

/* ==================================================================
   Automatisch teilen
   ------------------------------------------------------------------
   Nimmt man Steine aus der Mitte einer Kette, zerfaellt sie von selbst
   in die Stuecke links und rechts davon - immer, auch wenn ein Stueck
   dann zu kurz ist. Das ist dann rot und muss repariert werden, bevor der
   Zug gilt. Gruppen gleicher Zahlen haben keine Mitte und bleiben ganz.
   Geteilt wird an den Stellen, an denen die Steine sichtbar liegen.
   ================================================================== */
function istKette(tiles){
  var c = null, n = null, verschieden = false, echte = 0;
  for (var i=0;i<tiles.length;i++){
    var t = tiles[i];
    if (t.j) continue;
    echte++;
    if (c === null){ c = t.c; n = t.n; continue; }
    if (t.c !== c) return false;          /* verschiedene Farben: eine Gruppe */
    if (t.n !== n) verschieden = true;
  }
  return echte >= 2 && verschieden;
}
function teilstuecke(tiles, weg){
  if (!istKette(tiles)) return null;
  var stuecke = [], akt = [], i;
  for (i=0;i<tiles.length;i++){
    if (weg[tiles[i].id]){ if (akt.length){ stuecke.push(akt); akt = []; } }
    else akt.push(tiles[i]);
  }
  if (akt.length) stuecke.push(akt);
  return stuecke.length < 2 ? null : stuecke;
}
/* Passt eine Steinmenge nicht mehr als ein Satz, zerfaellt sie vielleicht sauber
   in mehrere. Das rechnet derselbe Zerleger aus, den auch die Gegner benutzen:
   alle Steine muessen aufgehen, nichts darf uebrig bleiben.
   Beispiel: an 9-10-11-12-13-1 noch eine 11 anlegen
             -> 9-10-11 und 11-12-13-1. */
function zerlegen(tiles){
  if (tiles.length < 6) return null;          /* zwei Saetze brauchen sechs Steine */
  var so = zuSorten(tiles), leer = new Array(52), i;
  for (i=0;i<52;i++) leer[i] = 0;
  var r = rechne(so.c, so.j, leer, 0, 200, 0);
  if (!r.ok || !r.sets || r.sets.length < 2) return null;
  var m = materialisieren(r.sets, tiles, []);
  if (!m) return null;
  for (i=0;i<tiles.length;i++) if (!m.benutzt[tiles[i].id]) return null;
  return m.sets;
}
/* Einen Satz, der so nicht aufgeht, in seine gueltigen Stuecke zerlegen.
   Die Stuecke reihen sich rechts an den urspruenglichen Platz an. */
function nachTeilen(st, liste, vorrang){
  if (checkSet(st.tiles).ok) return false;
  var teile = zerlegen(st.tiles);
  if (!teile) return false;
  /* Die Stuecke in der Reihenfolge lassen, in der die Steine vorher lagen -
     sonst springt das hintere Stueck nach vorn. */
  var pos = {};
  st.tiles.forEach(function(t, i){ pos[t.id] = i; });
  teile.sort(function(a, b){
    var pa = 1e9, pb = 1e9;
    a.forEach(function(t){ if (pos[t.id] < pa) pa = pos[t.id]; });
    b.forEach(function(t){ if (pos[t.id] < pb) pb = pos[t.id]; });
    return pa - pb;
  });
  st.tiles = teile[0]; if (vorrang) vorrang.push(st.id);
  var x = st.x, k, nach = liste.indexOf(st) + 1;
  for (k=1;k<teile.length;k++){
    x = x == null ? null : x + satzBreite(teile[k-1].length);
    var stueck = { id:setId++, tiles:teile[k], x:x, y:st.y };
    liste.splice(nach++, 0, stueck); if (vorrang) vorrang.push(stueck.id);
  }
  return true;
}
function stueckeGut(stuecke){
  for (var i=0;i<stuecke.length;i++) if (!checkSet(stuecke[i]).ok) return false;
  return true;
}
function hochMap(){
  var m = {};
  for (var i=0;i<G.gehoben.length;i++) m[G.gehoben[i]] = 1;
  return m;
}

function tileHtml(t, extra, als){
  var cls = 't' + (t.j ? ' jk' : ' c' + t.c) + (istHoch(t.id) ? ' hoch' : '') +
            (G.frischId === t.id ? ' frisch' : '') + (extra || '');
  if (t.j){
    var marke = als ? '<span class="als" style="color:'+FARBEN[als.c]+'">'+als.n+'</span>' : '';
    return '<div class="'+cls+'" data-id="'+t.id+'">'+teddiMarke()+marke+'</div>';
  }
  return '<div class="'+cls+'" data-id="'+t.id+'"><span class="num">'+t.n+'</span><span class="dot"></span></div>';
}
function renderHand(){
  var h = G.spieler[0].hand, s = '', i;
  for (i=0;i<h.length;i++) s += tileHtml(h[i], '');
  $hand.innerHTML = s;
  el('handCnt').textContent = handRest().length;
}
function renderTable(){
  saetzeOrdnen();
  tischOrdnen();
  var m = rasterMass(), hoch = hochMap(), s = '', i, k, rechts = 0, unten = -1;
  for (i=0;i<G.saetze.length;i++){
    var st = G.saetze[i], rest = satzRest(st);
    var inArbeit = rest.length !== st.tiles.length;
    var teile = inArbeit ? teilstuecke(st.tiles, hoch) : null;
    var r = checkSet(rest), vals = {};
    /* Joker-Werte: aus dem Rest, oder - wenn der Satz gleich zerfaellt - je Stueck */
    if (teile) teile.forEach(function(tl){
      var rr = checkSet(tl);
      if (rr.ok && rr.vals) for (var q=0;q<rr.order.length;q++) vals[rr.order[q].id] = rr.vals[q];
    });
    else if (r.ok && r.vals) for (k=0;k<r.order.length;k++) vals[r.order[k].id] = r.vals[k];
    var gut = teile ? stueckeGut(teile) : r.ok;
    var offen = darfAnlegen(st);
    var kl = 'set' + (rest.length === 0 ? '' : (gut ? '' : ' bad')) +
             (inArbeit ? ' arbeit' : '') + (teile ? ' teilt' : '');
    var ord = st.tiles;
    s += '<div class="satzbox'+(offen ? '' : ' zu')+'" data-set="'+st.id+'" style="left:'+
         (RAND + st.x*m.u)+'px;top:'+(RAND + st.y*m.v)+'px">';
    s += '<div class="griff" data-set="'+st.id+'"></div>';
    s += '<div class="'+kl+'" data-set="'+st.id+'">';
    for (k=0;k<ord.length;k++) s += tileHtml(ord[k], '', ord[k].j ? vals[ord[k].id] : null);
    s += '</div>';
    s += '<div class="drop" data-set="'+st.id+'">+</div>';
    s += '</div>';
    rechts = Math.max(rechts, st.x + satzBreite(st)); unten = Math.max(unten, st.y);
  }
  G.neuPlatz = null;
  if (legenAktiv()){
    var wn = satzBreite(Math.max(3, G.gehoben.length));
    G.neuPlatz = ersterPlatz(wn, m);
    s += '<div id="neuSatz" style="left:'+(RAND + G.neuPlatz.x*m.u)+'px;top:'+(RAND + G.neuPlatz.y*m.v)+
         'px;width:'+boxPixel(Math.max(3, G.gehoben.length), m)+'px">+ neuer Satz</div>';
    rechts = Math.max(rechts, G.neuPlatz.x + wn); unten = Math.max(unten, G.neuPlatz.y);
  }
  $table.innerHTML = s;
  $table.style.width  = Math.max($frame.clientWidth,  2*RAND + rechts*m.u) + 'px';
  $table.style.height = Math.max($frame.clientHeight, 2*RAND + (unten + 3)*m.v) + 'px';
  $hint.style.display = (G.saetze.length || legenAktiv()) ? 'none' : '';
  $frame.classList.toggle('legen', legenAktiv());
}
function renderFoes(){
  var s = '', i;
  for (i=1;i<G.spieler.length;i++){
    var p = G.spieler[i], bars = '', k;
    for (k=0;k<Math.min(p.hand.length,16);k++) bars += '<i></i>';
    s += '<div class="foe'+(G.dran===i?' turn':'')+'"><span>'+p.name+'</span>'+

         '<span class="cnt">'+p.hand.length+'</span><span class="bars">'+bars+'</span></div>';
  }
  $foes.innerHTML = s;
}

/* ---------- Die Zeile, die immer stehen bleibt ---------- */
function statusText(){
  if (!G.laeuft) return { t:'Teddikub', k:'' };
  if (G.dran !== 0) return { t: G.spieler[G.dran] ? G.spieler[G.dran].name + ' ist dran …' : 'Bitte warten …', k:'' };
  var hoch = G.gehoben.length;
  if (hoch){
    var hm = hochMap(), teilt = false;
    for (var q=0;q<G.saetze.length;q++) if (teilstuecke(G.saetze[q].tiles, hm)) teilt = true;
    return { t: hoch + (hoch === 1 ? ' Stein aufgehoben' : ' Steine aufgehoben') +
                (teilt ? ' · der Satz wird geteilt' : '') +
                ' – jetzt auf ein + tippen oder auf den Tisch', k:'gut' };
  }
  var gelegt = zugGelegt().length;
  if (!G.spieler[0].aus){
    if (gelegt){
      var e = ersteAuslagePunkte();
      if (!e.rein) return { t:'Beim ersten Mal nur eigene Steine – noch nicht anlegen oder umbauen', k:'warn' };
      return { t:'Auslage ' + e.pts + ' von ' + G.minOut + ' Punkten',
               k: e.pts >= G.minOut ? 'gut' : 'warn' };
    }
    return { t:'Du bist dran · zum Rauskommen brauchst du ' + G.minOut + ' Punkte', k:'' };
  }
  if (gelegt) return { t:'Du bist dran · ' + gelegt + (gelegt === 1 ? ' Stein gelegt' : ' Steine gelegt'), k:'gut' };
  return { t:'Du bist dran', k:'' };
}
function renderStatus(){
  if (G.ziehHinweis){ $statusTxt.textContent = G.ziehHinweis.t; $status.className = G.ziehHinweis.k; return; }
  if (G.meldung){ $statusTxt.textContent = G.meldung; $status.className = G.meldungArt || 'warn'; return; }
  var st = statusText();
  $statusTxt.textContent = st.t;
  $status.className = st.k;
}
function meldung(txt, dauer, art){
  G.meldung = txt || ''; G.meldungArt = art || 'warn';
  if (G.meldTimer) clearTimeout(G.meldTimer);
  if (txt) G.meldTimer = setTimeout(function(){ G.meldung = ''; renderStatus(); }, dauer || 3600);
  renderStatus();

/* ---------- Steingroesse ---------- */
function fitTiles(){
  var w = document.documentElement.clientWidth;
  var h = document.documentElement.clientHeight;
  var karten = G.spieler.length ? G.spieler[0].hand.length : 14;
  /* Auf schmalen Schirmen darf die Hand umbrechen - lieber zwei Reihen mit
     Steinen, die man treffen kann, als eine Reihe mit Briefmarken. */
  var jeReihe = w < 560 ? 8 : (w < 760 ? 13 : 19);
  var n = Math.max(8, Math.min(karten, jeReihe));
  var t = Math.floor((w - 58) / n) - 3;
  t = Math.min(t, Math.floor(h / 11));
  t = Math.max(w < 560 ? 30 : 26, Math.min(54, t));
  G.tile = t;
  document.documentElement.style.setProperty('--tile', t + 'px');
}
function neuMessen(){ if (greif) return; fitTiles(); renderTable(); }

window.addEventListener('orientationchange', function(){ setTimeout(neuMessen, 250); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', neuMessen);

/* ==================================================================
   Zughilfen
   ================================================================== */
function tileById(id){
  var i, k;
  for (i=0;i<G.spieler[0].hand.length;i++) if (G.spieler[0].hand[i].id === id) return G.spieler[0].hand[i];
  for (i=0;i<G.saetze.length;i++) for (k=0;k<G.saetze[i].tiles.length;k++)
    if (G.saetze[i].tiles[k].id === id) return G.saetze[i].tiles[k];
  return null;
}
function schnapp(){
  return {
    hand: G.spieler[0].hand.slice(),
    gehoben: G.gehoben.slice(),
    saetze: G.saetze.map(function(s){ return { id:s.id, tiles:s.tiles.slice(), x:s.x, y:s.y }; })
  };
}
/* Plaetze auf dem Tisch sind Kosmetik: beim Zuruecknehmen bleibt jeder Satz,
   den es noch gibt, dort liegen, wo man ihn zuletzt hingeschoben hat. */
function stelleHer(s){
  var jetzt = {};
  G.saetze.forEach(function(o){ jetzt[o.id] = o; });
  G.spieler[0].hand = s.hand.slice();
  G.gehoben = (s.gehoben || []).slice();
  G.saetze = s.saetze.map(function(o){
    var j = jetzt[o.id];
    return { id:o.id, tiles:o.tiles.slice(), x: j ? j.x : o.x, y: j ? j.y : o.y };
  });
}
function merken(){ G.undo.push(schnapp()); if (G.undo.length > 90) G.undo.shift(); }

/* Steine, die in diesem Zug von der Hand auf den Tisch gewandert sind */
function zugGelegt(){
  if (!G.zugStart) return [];
  var vorher = {}, i, k;
  for (i=0;i<G.zugStart.hand.length;i++) vorher[G.zugStart.hand[i].id] = 1;
  var raus = [];
  for (i=0;i<G.saetze.length;i++) for (k=0;k<G.saetze[i].tiles.length;k++)
    if (vorher[G.saetze[i].tiles[k].id] && !istHoch(G.saetze[i].tiles[k].id)) raus.push(G.saetze[i].tiles[k]);
  return raus;
}
function alleSaetzeGut(){
  var hm = hochMap();
  for (var i=0;i<G.saetze.length;i++){
    var rest = satzRest(G.saetze[i]);
    if (!rest.length || checkSet(rest).ok) continue;
    var tl = teilstuecke(G.saetze[i].tiles, hm);
    if (!tl || !stueckeGut(tl)) return false;
  }
  return true;
}
/* Punkte der Saetze, die in diesem Zug ganz neu entstanden sind */
function ersteAuslagePunkte(){
  var alt = {}, i;
  for (i=0;i<G.zugStart.saetze.length;i++){
    var ids = G.zugStart.saetze[i].tiles.map(function(t){ return t.id; }).sort().join(',');
    alt[ids] = 1;
  }
  var summe = 0, fremd = false;
  for (i=0;i<G.saetze.length;i++){
    var rest = satzRest(G.saetze[i]);
    if (!rest.length) continue;
    var key = rest.map(function(t){ return t.id; }).sort().join(',');
    if (alt[key]) continue;
    var r = checkSet(rest);
    if (!r.ok) return { pts:0, rein:false };
    for (var k=0;k<rest.length;k++){
      var id = rest[k].id, warHand = false, q;
      for (q=0;q<G.zugStart.hand.length;q++) if (G.zugStart.hand[q].id === id) warHand = true;
      if (!warHand) fremd = true;
    }
    summe += r.pts;
  }
  return { pts:summe, rein:!fremd };
}
function saetzeAufraeumen(){
  G.saetze = G.saetze.filter(function(s){ return s.tiles.length > 0; });
}
/* Die gepruefte Reihenfolge festschreiben, damit die Steine nicht springen,
   sobald man einen davon aufhebt. */
function saetzeOrdnen(){
  for (var i=0;i<G.saetze.length;i++){
    var r = checkSet(G.saetze[i].tiles);
    if (r.ok) G.saetze[i].tiles = r.order;
  }
}
function warInHand(t){
  if (!G.zugStart) return true;
  for (var i=0;i<G.zugStart.hand.length;i++) if (G.zugStart.hand[i].id === t.id) return true;
  return false;
}
function amZug(){ return G.laeuft && G.dran === 0 && !G.warten; }
