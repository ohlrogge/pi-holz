<!DOCTYPE html>
<html lang="de">
<head>
  <meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>if('serviceWorker' in navigator && location.protocol.indexOf('http')===0) navigator.serviceWorker.register('sw.js');</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teddymania!</title>
<style>
/* ------------------------------------------------------------------
   Teddymania! - ein Fenster im Windows-98-Stil, ohne Desktop drumherum.
   Laeuft offline, funktioniert mit Maus und mit Fingertipp.
   ------------------------------------------------------------------ */
:root{
  --face:#d4d0c8; --face2:#c0c0c0; --face-light:#dfdfdf; --white:#ffffff;
  --shadow:#808080; --black:#000000; --navy:#000080; --navy2:#1084d0;
  --ground:#0f6b6b; --ground2:#08504f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; padding:0;}
body{
  position:fixed; top:0; left:0; right:0; bottom:0; overflow:hidden;
  background:var(--face); color:#000;
  font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,Geneva,Verdana,sans-serif;
  font-size:13px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; overscroll-behavior:none;
}
button{font:inherit; color:#000;}

/* ---------- Fenster ---------- */
.win{
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column;
  background:var(--face); padding:3px;
  border:2px solid; border-color:var(--face-light) var(--black) var(--black) var(--face-light);
  box-shadow:inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--shadow);
}
.titlebar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:6px; height:26px; padding:0 6px;
  background:linear-gradient(90deg,var(--navy),var(--navy2)); color:#fff; font-weight:bold; font-size:14px;
}
.tb-icon{width:20px; height:20px; flex:0 0 20px; background:var(--face2); border:1px solid #000;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1px; padding:1px;}
.tb-icon i:nth-child(1){background:#e8412c;} .tb-icon i:nth-child(2){background:#f6a021;}
.tb-icon i:nth-child(3){background:#2079d8;} .tb-icon i:nth-child(4){background:#2f8f30;}
.tb-text{flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tb-rec{font-weight:normal; opacity:.9; white-space:nowrap;}
.tb-close{flex:0 0 auto; width:22px; height:18px; margin-left:4px; display:flex; align-items:center; justify-content:center;
  background:var(--face); color:#000; font:bold 15px/1 Arial,sans-serif; cursor:pointer; border:2px solid;
  border-color:var(--face-light) var(--black) var(--black) var(--face-light);
  box-shadow:inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--shadow);}
.tb-close:active{border-color:var(--black) var(--face-light) var(--face-light) var(--black);}
.tbtn .ecke-ico{width:26px; height:26px; border-radius:22%; display:block;}

/* ---------- Menue ---------- */
.menubar{flex:0 0 auto; display:flex; padding:2px 0; position:relative; z-index:20;}
.menutitle{padding:5px 12px; cursor:pointer;}
.menutitle.open{background:var(--navy); color:#fff;}
.menu{position:absolute; top:100%; left:0; min-width:250px; font-size:14px; padding:2px; background:var(--face); color:#000;
  z-index:40; display:none; border:2px solid;
  border-color:var(--face-light) var(--black) var(--black) var(--face-light);
  box-shadow:inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--shadow), 2px 2px 0 rgba(0,0,0,.25);}
.menu.show{display:block;}
@media (max-width: 700px){
  .tb-rec{overflow:hidden; text-overflow:ellipsis; max-width:58%; font-size:12px;}
  .menu{min-width:230px; max-width:calc(100vw - 14px);}
}
.mi{display:flex; align-items:center; padding:9px 16px 9px 26px; position:relative; cursor:pointer; white-space:nowrap;}
.mi:hover{background:var(--navy); color:#fff;}
.mi .mark{position:absolute; left:9px; width:12px; text-align:center;}
.mi .key{margin-left:auto; padding-left:26px;}
.mi.disabled{color:var(--shadow); text-shadow:1px 1px 0 #fff;}
.mi.disabled:hover{background:transparent; color:var(--shadow);}
.msep{height:2px; margin:3px 2px; border-top:1px solid var(--shadow); border-bottom:1px solid var(--white);}

/* ---------- Symbolleiste ---------- */
.toolbar{flex:0 0 auto; display:flex; align-items:center; flex-wrap:wrap; gap:2px; padding:3px 3px 4px;
  border-bottom:1px solid var(--shadow); box-shadow:0 1px 0 var(--white); margin-bottom:4px;}
.tbtn{width:42px; height:38px; display:flex; align-items:center; justify-content:center;
  background:transparent; border:2px solid transparent; cursor:pointer;}
.tbtn:hover{border-color:var(--white) var(--shadow) var(--shadow) var(--white);}
.tbtn:active{border-color:var(--shadow) var(--white) var(--white) var(--shadow);}
.tbtn.off{opacity:.35;}
.tbtn b{font-size:21px; line-height:1;}
.tbsep{width:2px; height:28px; margin:0 6px; border-left:1px solid var(--shadow); border-right:1px solid var(--white);}

/* ---------- Spielfeld ---------- */
.board-frame{position:relative; flex:1 1 auto; min-height:0; padding:1px; background:var(--face2);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  border:2px solid; border-color:var(--shadow) var(--white) var(--white) var(--shadow);
  box-shadow:inset 1px 1px 0 var(--black), inset -1px -1px 0 var(--face-light);}
#board{position:relative; flex:0 0 auto; overflow:hidden; background:#bdb9b1; touch-action:manipulation;}
.stone{position:absolute; background:var(--bg);
  transition:left .15s cubic-bezier(.45,0,.9,.55), top .17s cubic-bezier(.45,0,.9,.55),
             transform .12s linear, opacity .12s linear, filter .06s linear;}
.stone.noanim{transition:none;}
.stone.hl{filter:brightness(1.24) saturate(1.12);}
.stone.pop{transform:scale(.2); opacity:0;}
/* Farben wie im Original: rot, orange, gruen, blau, weiss (+ violett, tuerkis) */
.c0{--bg:#e8412c;} .c1{--bg:#f6a021;} .c2{--bg:#2f8f30;} .c3{--bg:#2079d8;}
.c4{--bg:#f2f2ee;} .c5{--bg:#8b3fbf;} .c6{--bg:#00a6a6;}

/* ---------- Statuszeile ---------- */
.statusbar{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:2px; margin-top:4px;}
.sp{padding:6px 8px; white-space:nowrap; overflow:hidden;
  border:1px solid; border-color:var(--shadow) var(--white) var(--white) var(--shadow);}
.sp.num{width:66px; flex:0 1 66px; min-width:0; text-align:right; font-variant-numeric:tabular-nums;}
.sp.grow{flex:1 1 110px; min-width:0; text-align:left;}
.sp.arrow{color:#c00; font-weight:bold; cursor:pointer;}

/* ---------- Bestätigen-Knopf am Finger ---------- */
#confirm{display:none !important;}        /* nicht mehr verwendet */
#confirm .ok, #confirm .no{
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  min-height:50px; padding:0 18px; font-size:16px; font-weight:bold; color:#fff;
  border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,.45);
  background:linear-gradient(180deg,#4ab84f,#2f8f30); border:2px solid #1f6b22;
}
#confirm .no{padding:0 14px; background:linear-gradient(180deg,#e46a5c,#c9382a); border-color:#8f2418;}
#confirm .ok:active{filter:brightness(.92);} #confirm .no:active{filter:brightness(.92);}

/* ---------- Fingerbedienung: größere Ziele, weniger Fummelei ---------- */
@media (pointer:coarse){
  .tb-close{width:30px; height:22px; font-size:18px;}
  body{font-size:15px;}
  .titlebar{height:32px; font-size:16px;}
  .menutitle{padding:9px 16px; font-size:16px;}
  .menu{min-width:270px; font-size:17px;}
  .mi{padding:14px 18px 14px 30px;}
  .mi .mark{left:11px;}
  .tbtn{width:54px; height:48px;}
  .tbtn svg{width:24px; height:24px;}
  .tbtn b{font-size:25px;}
  .tbsep{height:34px;}
  .sp{padding:9px 10px; font-size:15px;}
  .sp.num{width:60px; flex:1 1 54px;}
  .sp.grow{flex:1 1 100%; order:2;}
  .sp.arrow{order:1; padding:9px 14px;}
  .btn{min-height:50px; font-size:16px;}
  .opt{margin:12px 0; font-size:16px;}
  .opt input{width:22px; height:22px;}
  input[type=text],input[type=number]{font-size:16px; padding:9px 8px;}
  .dlg .body{font-size:16px;}
}

/* ---------- Dialoge ---------- */
#modal{position:fixed; top:0; left:0; right:0; bottom:0; display:none; z-index:200;
  background:rgba(0,0,0,.18); overflow:auto; padding:10px;}
#modal.show{display:flex; align-items:center; justify-content:center;}
.dlg{width:auto; min-width:270px; max-width:min(460px,94vw); background:var(--face); padding:3px;
  border:2px solid; border-color:var(--face-light) var(--black) var(--black) var(--face-light);
  box-shadow:inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--shadow), 4px 4px 8px rgba(0,0,0,.45);}
.dlg .body{padding:14px 12px; line-height:1.5; max-height:66vh; overflow:auto;}
.dlg .body p{margin:0 0 10px;} .dlg .body p:last-child{margin-bottom:0;}
.dlg .btns{display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:0 12px 12px;}
.btn{min-width:96px; padding:9px 14px; background:var(--face2); cursor:pointer;
  border:2px solid; border-color:var(--face-light) var(--black) var(--black) var(--face-light);
  box-shadow:inset 1px 1px 0 var(--white), inset -1px -1px 0 var(--shadow);}
.btn:active{border-color:var(--black) var(--white) var(--white) var(--black); box-shadow:none;}
.btn:focus-visible{outline:1px dotted #000; outline-offset:-5px;}
input[type=text],input[type=number]{font:inherit; padding:5px 6px; background:#fff;
  border:2px solid; border-color:var(--shadow) var(--white) var(--white) var(--shadow);
  box-shadow:inset 1px 1px 0 var(--black); outline:none;}
input[type=text]{width:100%;} input[type=number]{width:76px;}
fieldset.g98{border:1px solid var(--shadow); box-shadow:1px 1px 0 var(--white);
  margin:0 0 12px; padding:8px 10px 10px;}
fieldset.g98:last-of-type{margin-bottom:0;}
fieldset.g98 legend{padding:0 4px;}
.row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:4px 0;}
.opt{display:flex; align-items:center; gap:7px; margin:6px 0; cursor:pointer;}
.opt input{margin:0; width:16px; height:16px;}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:28px;
  background:transparent; margin:2px 0 0; outline:none;}
input[type=range]::-webkit-slider-runnable-track{height:7px; background:var(--face2);
  border:1px solid; border-color:var(--shadow) var(--white) var(--white) var(--shadow);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:26px; margin-top:-10px;
  background:var(--face); border:2px solid; border-color:var(--white) var(--black) var(--black) var(--white);
  box-shadow:inset 1px 1px 0 var(--face-light), inset -1px -1px 0 var(--shadow);}
input[type=range]::-moz-range-track{height:7px; background:var(--face2);
  border:1px solid; border-color:var(--shadow) var(--white) var(--white) var(--shadow);}
input[type=range]::-moz-range-thumb{width:16px; height:24px; border-radius:0;
  background:var(--face); border:2px solid; border-color:var(--white) var(--black) var(--black) var(--white);}
.ticks{display:flex; justify-content:space-between; margin:0 8px 4px;}
.ticks span{width:1px; height:6px; background:var(--shadow); box-shadow:1px 0 0 var(--white);}
.levelname{margin-top:4px; font-weight:bold;}
.presets{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.presets .btn{min-width:0; padding:5px 10px;}
.hintline{margin-top:8px; color:#3a3a3a;}
.hs-wrap{background:#fff; padding:2px; border:2px solid;
  border-color:var(--shadow) var(--white) var(--white) var(--shadow); box-shadow:inset 1px 1px 0 var(--black);}
table.hs{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
table.hs td{padding:3px 6px; border-bottom:1px solid #dfdfdf;}
table.hs td.r{text-align:right;}
</style>
</head>
<body>

<div class="win" id="win">
  <div class="titlebar">
    <div class="tb-icon"><i></i><i></i><i></i><i></i></div>
    <div class="tb-text">Teddymania!</div>
    <div class="tb-rec" id="tb-rec"></div>
    <div class="tb-close" id="tb-close" title="Zur Spieleecke">&times;</div>
  </div>
  <div class="menubar" id="menubar"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="board-frame"><div id="board"></div><div id="confirm"></div></div>
  <div class="statusbar">
    <div class="sp num" id="sp-total" title="Steine gesamt">0</div>
    <div class="sp num" id="sp-left"  title="Steine übrig">0</div>
    <div class="sp num" id="sp-click" title="klickbare Steine">0</div>
    <div class="sp num" id="sp-score" title="Punkte">0</div>
    <div class="sp grow" id="sp-hint">Lege los!</div>
    <div class="sp arrow" id="sp-arrow" title="Bestenliste">&#9660;</div>
  </div>
</div>

<div id="modal"></div>

<script>
"use strict";

/* ==========================================================================
   Teddymania! - Nachbau des Clickomania-Klassikers von Ulrich Kortenkamp
   (clickomania.ch); Spielprinzip nach SameGame (Kuniaki Moribe, 1985).
   Gruppen ab 2 gleichfarbigen Steinen wegklicken, Steine fallen nach unten,
   leergeraeumte Spalten schliessen sich nach links.
   Alles offline: keine Bilder, keine Bibliotheken, kein Netz.
   ========================================================================== */

var CW = 30, CH = 26;
var cfg = { v:2, cols:25, rows:13, colors:5, level:3, tile:'auto', cellW:30, twotap:'auto',
            sound:false, vibrate:true, marker:true, preview:true, touchAsked:false, sizeAuto:true };
/* Feldgröße "automatisch": Handy hochkant 10×16, sonst quer 25×13 */
var handyMq = window.matchMedia('(max-width: 700px)');
function autoFormat(){ return handyMq.matches ? [10,16] : [25,13]; }
/* Schwierigkeitsstufen: sie steuern, wie stark die Farben beim Aufbau
   verklumpen (leicht) bzw. wie sehr gleiche Nachbarn vermieden werden (schwer). */
var LEVELS = {
  1:{name:'sehr leicht', min:4, max:6, split:0.08},
  2:{name:'leicht',      min:3, max:5, split:0.38},
  3:{name:'normal',      min:2, max:4, split:0.72},
  4:{name:'schwer',      min:2, max:3, split:0.88},
  5:{name:'sehr schwer', min:2, max:2, split:0.97}
};
function levelName(n){ return (LEVELS[n]||LEVELS[3]).name; }
var COLS, ROWS, TOTAL;
var grid = [], score = 0, moves = 0, running = false;
var undoStack = [], hlGroup = [], armed = null;   // armed = Gruppe, die beim 2. Tippen faellt

var board  = document.getElementById('board');
var winEl  = document.getElementById('win');
var elTotal= document.getElementById('sp-total');
var elLeft = document.getElementById('sp-left');
var elClick= document.getElementById('sp-click');
var elScore= document.getElementById('sp-score');
var elHint = document.getElementById('sp-hint');
var elRec  = document.getElementById('tb-rec');

/* ---------- Speichern (mit Rueckfall in den Arbeitsspeicher) ---------- */
var memStore = {};
function lsGet(k,d){
  try{ var v=localStorage.getItem(k); if(v!==null) return JSON.parse(v); }catch(e){}
  return (k in memStore) ? memStore[k] : d;
}
function lsSet(k,v){ memStore[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function cfgKey(){ return cfg.cols+'x'+cfg.rows+'x'+cfg.colors+'L'+cfg.level; }
function scoresFor(k){ return lsGet('clicko.hs.'+k, []); }
function bestFor(k){ var s=scoresFor(k); return s.length? s[0].score : 0; }
var savedCfg = lsGet('clicko.cfg', null);
if (savedCfg) {
  for (var sk in savedCfg) if (sk in cfg) cfg[sk] = savedCfg[sk];
  if (savedCfg.v !== 2) { cfg.sound = false; cfg.v = 2; }   /* Ton ist jetzt standardmaessig aus */
}
function saveCfg(){ lsSet('clicko.cfg', cfg); }

/* ---------- Ton ---------- */
var actx=null;
function audio(){ if(!cfg.sound) return null;
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
       if(actx.state==='suspended') actx.resume(); return actx; }catch(e){ return null; } }
function beep(f,d,type,vol,delay){
  var a=audio(); if(!a) return;
  var t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.09));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+(d||0.09)+0.02);
}
function sndTick(){ beep(660,0.035,'square',0.03); }
function buzz(ms){ if(!cfg.vibrate || !navigator.vibrate) return; try{ navigator.vibrate(ms); }catch(e){} }
function sndPop(n){ var f=210+Math.min(n,14)*34; beep(f,0.06,'square',0.045); beep(f*1.5,0.05,'square',0.025,0.035); }
function sndNope(){ beep(115,0.11,'sawtooth',0.045); }
function sndWin(){ [523,659,784,1047].forEach(function(f,i){ beep(f,0.14,'square',0.055,i*0.11); }); }
function sndOver(){ [392,330,262,196].forEach(function(f,i){ beep(f,0.17,'square',0.045,i*0.12); }); }

/* ---------- Groesse: Fenster fuellt den verfuegbaren Platz ---------- */
var MAXCELL = { s:18, m:26, l:36, xl:52, auto:999, custom:999 };
var frame = document.querySelector('.board-frame');
/* Freier Platz im Spielfeldrahmen - der Rahmen bekommt per Flexbox alles,
   was Titel, Menue, Symbolleiste und Statuszeile uebrig lassen. */
function freeArea(){
  var w = frame.clientWidth  - 2, h = frame.clientHeight - 2;
  if(!(w>20)) w = Math.max(120, (window.visualViewport? window.visualViewport.width : window.innerWidth) - 16);
  if(!(h>20)) h = Math.max(100, (window.visualViewport? window.visualViewport.height : window.innerHeight) - 150);
  return [w, h];
}
/* Kacheln fuellen die Flaeche aus; das Seitenverhaeltnis darf dabei zwischen
   0.7 und 1.7 (Breite:Hoehe) wandern, damit nichts unfoermig wird. */
function cellsForArea(bw,bh,cols,rows){
  var w = Math.floor(bw/cols), h = Math.floor(bh/rows);
  if(w/h > 1.7) w = Math.round(h*1.7);
  if(w/h < 0.70) h = Math.round(w/0.70);
  return [Math.max(7,w), Math.max(6,h)];
}
function fitCells(){
  var a = freeArea();
  var c = cellsForArea(a[0], a[1], cfg.cols, cfg.rows);
  var cap = (cfg.tile==='custom') ? (cfg.cellW||30) : (MAXCELL[cfg.tile]||999);
  if(c[0] > cap){ CW = cap; CH = Math.max(6, Math.min(c[1], Math.round(cap*26/30))); }
  else { CW = c[0]; CH = c[1]; }
  CW = Math.max(7, CW); CH = Math.max(6, CH);
}
function applyCellSize(){
  board.style.width=(COLS*CW)+'px'; board.style.height=(ROWS*CH)+'px';
  eachStone(function(s){ s.el.classList.add('noanim'); s.el.style.width=CW+'px'; s.el.style.height=CH+'px'; });
  layout(); board.offsetHeight;
  eachStone(function(s){ s.el.classList.remove('noanim'); });
}
function zoom(step){
  fitCells();
  var a = freeArea(), maxC = cellsForArea(a[0], a[1], COLS, ROWS)[0];
  var w = Math.max(8, Math.min(maxC, CW+step));
  if(w===CW && step>0){ sndNope(); elHint.textContent='Größer geht nicht – der Bildschirm ist voll.'; return; }
  cfg.tile='custom'; cfg.cellW=w; saveCfg();
  fitCells(); applyCellSize(); buildToolbar();
}

/* ---------- Spiel aufbauen ---------- */
/* ==========================================================================
   Feldaufbau rueckwaerts: wir setzen Bloecke so ein, dass sie sich in
   umgekehrter Reihenfolge wieder wegklicken lassen. Damit ist jedes Feld
   garantiert vollstaendig abraeumbar - fuer beliebige Felder ist das sonst
   nicht entscheidbar (Clickomania ist NP-vollstaendig).
   ========================================================================== */
var nextBlockId = 1;
/* Darf ein Block der Farbe c in Spalte j ab Hoehe h mit k Steinen stehen,
   ohne einen gleichfarbigen Nachbarn zu beruehren? */
function canPlace(cols, j, h, k, c){
  var col = cols[j], r, N;
  if(h>0 && col[h-1].c===c) return false;                 /* darunter */
  if(h<col.length && col[h].c===c) return false;           /* darueber */
  for(r=h; r<h+k; r++){
    if(j>0){ N=cols[j-1]; if(r<N.length && N[r].c===c) return false; }
    if(j+1<cols.length){ N=cols[j+1]; if(r<N.length && N[r].c===c) return false; }
  }
  return true;
}
/* Waagerechter Block: in jede der Spalten j..j+w-1 ein Stein auf Höhe h */
function canPlaceRow(cols, j, w, h, c){
  var x, col, N;
  for(x=j; x<j+w; x++){
    col=cols[x];
    if(!col || h>col.length) return false;                 /* Höhe muss erreichbar sein */
    if(col.length>=ROWS) return false;
    if(h>0 && col[h-1].c===c) return false;
    if(h<col.length && col[h].c===c) return false;
  }
  if(j>0){ N=cols[j-1]; if(h<N.length && N[h].c===c) return false; }
  if(j+w<cols.length){ N=cols[j+w]; if(h<N.length && N[h].c===c) return false; }
  return true;
}
function erlaubteFarben(cols, j, h, k){
  var out=[], c;
  for(c=0;c<cfg.colors;c++) if(canPlace(cols,j,h,k,c)) out.push(c);
  return out;
}
function erlaubteFarbenReihe(cols, j, w, h){
  var out=[], c;
  for(c=0;c<cfg.colors;c++) if(canPlaceRow(cols,j,w,h,c)) out.push(c);
  return out;
}
function zufall(a){ return a[Math.floor(Math.random()*a.length)]; }
function blockOf(k, c){
  var id=nextBlockId++, b=[], i;
  for(i=0;i<k;i++) b.push({c:c, id:id});
  return b;
}
/* Gruppe im Aufbau-Gitter (Objekte mit .c) */
function groupIn(b, c0, r0){
  var col = (b[c0] && b[c0][r0]!==undefined) ? b[c0][r0].c : -1;
  if(col<0) return [];
  var seen={}, stack=[[c0,r0]], out=[];
  seen[c0+','+r0]=1;
  while(stack.length){
    var p=stack.pop(); out.push(p);
    var nb=[[p[0]+1,p[1]],[p[0]-1,p[1]],[p[0],p[1]+1],[p[0],p[1]-1]];
    for(var i=0;i<4;i++){
      var q=nb[i], key=q[0]+','+q[1];
      if(seen[key]) continue;
      if(b[q[0]] && b[q[0]][q[1]]!==undefined && b[q[0]][q[1]].c===col){ seen[key]=1; stack.push(q); }
    }
  }
  return out;
}
/* Probe: laesst sich der Plan rueckwaerts wirklich abspielen? */
function planWorks(cols, plan){
  var b = cols.map(function(col){ return col.slice(); }), i, c, r;
  for(i=plan.length-1;i>=0;i--){
    var id=plan[i].id, fc=-1, fr=-1;
    for(c=0;c<b.length && fc<0;c++) for(r=0;r<b[c].length;r++) if(b[c][r].id===id){ fc=c; fr=r; break; }
    if(fc<0) return false;
    var grp=groupIn(b,fc,fr);
    if(grp.length!==plan[i].size) return false;
    for(var q=0;q<grp.length;q++) if(b[grp[q][0]][grp[q][1]].id!==id) return false;
    grp.sort(function(a,z){ return z[1]-a[1]; });
    grp.forEach(function(p){ b[p[0]].splice(p[1],1); });
    for(var x=b.length-1;x>=0;x--) if(b[x].length===0) b.splice(x,1);
  }
  return b.length===0;
}
/* Blockgroesse waehlen: nie eine Luecke von genau einem Stein lassen */
/* Stellen, an denen ein gleichfarbiger Lauf aufgetrennt würde */
function splitSpots(col){
  var out=[], h;
  for(h=1;h<col.length;h++) if(col[h-1].c===col[h].c) out.push(h);
  return out;
}
function pickSpot(col, L){
  if(Math.random() < (L.split||0)){
    var sp=splitSpots(col);
    if(sp.length) return sp[Math.floor(Math.random()*sp.length)];
  }
  return Math.floor(Math.random()*(col.length+1));
}
function pickSize(rest, L){
  var lo=Math.min(L.min, rest), hi=Math.min(L.max, rest), k;
  var moeglich=[];
  for(k=Math.max(2,lo); k<=hi; k++) if(rest-k!==1) moeglich.push(k);
  if(!moeglich.length) for(k=2; k<=rest; k++) if(rest-k!==1) moeglich.push(k);
  if(!moeglich.length) return rest>=2 ? rest : 0;
  return moeglich[Math.floor(Math.random()*moeglich.length)];
}
/* Alle gültigen Einsetzstellen aufzählen - Notausgang, wenn das Würfeln
   nicht mehr weiterkommt (wichtig bei wenigen Farben). */
function alleStellen(cols, L){
  var out=[], j, h, k, w, x, fr;
  for(j=0;j<cols.length;j++){
    var rest=ROWS-cols[j].length;
    for(k=2;k<=Math.min(L.max+2, rest);k++){
      for(h=0;h<=cols[j].length;h++){
        fr=erlaubteFarben(cols,j,h,k);
        if(fr.length) out.push({typ:'v', j:j, h:h, k:k, farben:fr});
      }
    }
  }
  for(w=2;w<=3;w++) for(j=0;j+w<=cols.length;j++){
    var hmin=ROWS, ok=true;
    for(x=j;x<j+w;x++){ if(cols[x].length>=ROWS){ ok=false; break; } if(cols[x].length<hmin) hmin=cols[x].length; }
    if(!ok) continue;
    for(h=0;h<=hmin;h++){
      fr=erlaubteFarbenReihe(cols,j,w,h);
      if(fr.length) out.push({typ:'h', j:j, h:h, w:w, farben:fr});
    }
  }
  return out;
}
function setzeStelle(cols, plan, z){
  var id=nextBlockId++, x;
  var c=zufall(z.farben);
  if(z.typ==='v'){
    var blk=[];
    for(x=0;x<z.k;x++) blk.push({c:c, id:id});
    cols[z.j]=cols[z.j].slice(0,z.h).concat(blk, cols[z.j].slice(z.h));
    plan.push({id:id, size:z.k});
  } else {
    for(x=z.j; x<z.j+z.w; x++)
      cols[x]=cols[x].slice(0,z.h).concat([{c:c, id:id}], cols[x].slice(z.h));
    plan.push({id:id, size:z.w});
  }
}
function solvableGrid(){
  var L=LEVELS[cfg.level]||LEVELS[3], cols=[], plan=[], j, k, c, versuch;
  nextBlockId=1;

  /* 1. Spalten anlegen - jede beginnt mit einem eigenen Block */
  for(j=0;j<COLS;j++){
    k=pickSize(ROWS, L);
    cols.splice(j,0,[]);                          /* leere Spalte zum Prüfen */
    var frei=erlaubteFarben(cols, j, 0, k);
    cols.splice(j,1);
    if(!frei.length) return null;
    c=zufall(frei);
    cols.splice(j,0,blockOf(k,c));
    plan.push({id:cols[j][0].id, size:k});
  }

  /* 2. Spalten auffuellen, bis jede ROWS hoch ist */
  var offen=true, runden=0;
  while(offen && runden++ < 20000){
    var kandidaten=[];
    for(j=0;j<COLS;j++) if(cols[j].length<ROWS) kandidaten.push(j);
    if(!kandidaten.length){ offen=false; break; }
    j=kandidaten[Math.floor(Math.random()*kandidaten.length)];
    var rest=ROWS-cols[j].length, gesetzt=false;

    /* Waagerechte Blöcke geben dem Feld sein gewohntes Aussehen; bei nur noch
       einem freien Feld sind sie die einzige Möglichkeit. */
    var wagerecht = (rest===1) || (Math.random() < 0.5);
    if(wagerecht){
      for(versuch=0; versuch<40 && !gesetzt; versuch++){
        var wMax=Math.max(2, Math.min(3, L.max));            /* breiter nur, wenn die Stufe große Blöcke erlaubt */
        var w=2+Math.floor(Math.random()*(wMax-1));
        var start=Math.max(0, Math.min(COLS-w, j-Math.floor(Math.random()*w)));
        var hmin=ROWS, x;
        for(x=start; x<start+w; x++) if(cols[x] && cols[x].length<hmin) hmin=cols[x].length;
        var hr=Math.floor(Math.random()*(hmin+1));
        var freiR=erlaubteFarbenReihe(cols, start, w, hr);
        if(!freiR.length) continue;
        var cr=zufall(freiR);
        var idr=nextBlockId++;
        for(x=start; x<start+w; x++)
          cols[x]=cols[x].slice(0,hr).concat([{c:cr, id:idr}], cols[x].slice(hr));
        plan.push({id:idr, size:w});
        gesetzt=true;
      }
    }

    if(!gesetzt && rest>=2){                                  /* senkrechter Block */
      k=pickSize(rest, L);
      if(k<2) k=rest;
      for(versuch=0; versuch<30 && !gesetzt; versuch++){
        var h=pickSpot(cols[j], L);
        var frei2=erlaubteFarben(cols, j, h, k);
        if(!frei2.length) continue;
        c=zufall(frei2);
        var blk=blockOf(k,c);
        cols[j]=cols[j].slice(0,h).concat(blk, cols[j].slice(h));
        plan.push({id:blk[0].id, size:k});
        gesetzt=true;
      }
      if(!gesetzt && k>2 && rest-2!==1){
        for(versuch=0; versuch<30 && !gesetzt; versuch++){
          var h2=pickSpot(cols[j], L);
          var frei3=erlaubteFarben(cols, j, h2, 2);
          if(!frei3.length) continue;
          var c2=zufall(frei3);
          var blk2=blockOf(2,c2);
          cols[j]=cols[j].slice(0,h2).concat(blk2, cols[j].slice(h2));
          plan.push({id:blk2[0].id, size:2});
          gesetzt=true;
        }
      }
    }
    if(!gesetzt){                                  /* Würfeln hilft nicht mehr: alles absuchen */
      var stellen=alleStellen(cols, L);
      if(!stellen.length) return null;
      /* bevorzugt etwas, das die am wenigsten gefüllte Spalte bedient */
      var leerste=0, jj;
      for(jj=1;jj<COLS;jj++) if(cols[jj].length<cols[leerste].length) leerste=jj;
      var passend=stellen.filter(function(z){
        return z.typ==='v' ? z.j===leerste : (leerste>=z.j && leerste<z.j+z.w);
      });
      setzeStelle(cols, plan, zufall(passend.length? passend : stellen));
      gesetzt=true;
    }
  }
  for(j=0;j<COLS;j++) if(cols[j].length!==ROWS) return null;
  if(!planWorks(cols, plan)) return null;
  return cols.map(function(col){ return col.map(function(z){ return z.c; }); });
}
/* Zweiter Weg: Schicht für Schicht mauern. Jede Reihe besteht aus waagerechten
   Blöcken von zwei bis vier Steinen, deren Farbe sich von der Reihe darunter und
   vom linken Nachbarn unterscheidet. Sehr regelmäßig, aber es klappt immer -
   deshalb nur als Rückfallebene, vor allem bei drei Farben. */
function schichtGrid(){
  var cols=[], plan=[], j, layer, versuch;
  for(j=0;j<COLS;j++) cols[j]=[];
  nextBlockId=1;
  for(layer=0; layer<ROWS; layer++){
    var fertig=false;
    for(versuch=0; versuch<80 && !fertig; versuch++){
      var teile=[], rest=COLS;
      while(rest>0){
        if(rest<=4){ teile.push(rest); rest=0; }
        else { var w=2+Math.floor(Math.random()*3); if(rest-w===1) w++; teile.push(w); rest-=w; }
      }
      var probe=[], x=0, okAlle=true, linksFarbe=-1, t;
      for(t=0;t<teile.length && okAlle;t++){
        var w2=teile[t], moeglich=[], c, q;
        for(c=0;c<cfg.colors;c++){
          if(c===linksFarbe) continue;
          var passt=true;
          for(q=x;q<x+w2;q++) if(layer>0 && cols[q][layer-1].c===c){ passt=false; break; }
          if(passt) moeglich.push(c);
        }
        if(!moeglich.length){ okAlle=false; break; }
        var gew=zufall(moeglich);
        probe.push({start:x, w:w2, c:gew});
        linksFarbe=gew; x+=w2;
      }
      if(!okAlle) continue;
      probe.forEach(function(b){
        var id=nextBlockId++, q2;
        for(q2=b.start; q2<b.start+b.w; q2++) cols[q2].push({c:b.c, id:id});
        plan.push({id:id, size:b.w});
      });
      fertig=true;
    }
    if(!fertig) return null;
  }
  if(!planWorks(cols, plan)) return null;
  return cols.map(function(col){ return col.map(function(z){ return z.c; }); });
}
/* Notnagel: rein zufaellig, falls der Aufbau wider Erwarten scheitert */
function randomGrid(){
  var g=[],c,r;
  for(c=0;c<COLS;c++){ g[c]=[]; for(r=0;r<ROWS;r++) g[c][r]=Math.floor(Math.random()*cfg.colors); }
  return g;
}
function newGame(){
  if(cfg.sizeAuto){ var af=autoFormat(); cfg.cols=af[0]; cfg.rows=af[1]; }
  COLS=cfg.cols; ROWS=cfg.rows; TOTAL=COLS*ROWS;
  fitCells();
  board.style.width=(COLS*CW)+'px'; board.style.height=(ROWS*CH)+'px';
  var g=null, versuche=0;
  var maxVersuche = (cfg.colors<=3) ? 250 : 30;           /* wenige Farben brauchen mehr Anläufe */
  while(!g && versuche++ < maxVersuche) g = solvableGrid();
  versuche=0;
  while(!g && versuche++ < 25) g = schichtGrid();          /* gemauert - klappt immer */
  if(!g){ do { g=randomGrid(); } while(!hasMove(g)); }     /* letzter Notnagel */
  build(g);
  score=0; moves=0; running=true; undoStack=[]; hlGroup=[]; armed=null; hideConfirm();
  elHint.textContent='Lege los!  (Stufe '+cfg.level+' – '+levelName(cfg.level)+')';
  fitCells(); applyCellSize();
  update();
}
function build(colorGrid){
  board.innerHTML=''; grid=[];
  for(var c=0;c<colorGrid.length;c++){
    grid[c]=[];
    for(var r=0;r<colorGrid[c].length;r++){
      var el=document.createElement('div');
      el.className='stone noanim c'+colorGrid[c][r];
      el.style.width=CW+'px'; el.style.height=CH+'px';
      board.appendChild(el);
      grid[c][r]={color:colorGrid[c][r], el:el};
    }
  }
  layout(); board.offsetHeight;
  eachStone(function(s){ s.el.classList.remove('noanim'); });
}
function eachStone(fn){ for(var c=0;c<grid.length;c++) for(var r=0;r<grid[c].length;r++) fn(grid[c][r],c,r); }
function layout(){ eachStone(function(s,c,r){ s.el.style.left=(c*CW)+'px'; s.el.style.top=((ROWS-1-r)*CH)+'px'; }); }
function countStones(){ var n=0; for(var c=0;c<grid.length;c++) n+=grid[c].length; return n; }

/* ---------- Gruppen ---------- */
function at(g,c,r){ return (g[c]&&g[c][r]!==undefined)? g[c][r] : null; }
function colorAt(g,c,r){ var s=at(g,c,r); if(s===null) return -1; return (typeof s==='object')? s.color : s; }
function findGroup(g,c0,r0){
  var col=colorAt(g,c0,r0); if(col<0) return [];
  var seen={}, stack=[[c0,r0]], out=[]; seen[c0+','+r0]=1;
  while(stack.length){
    var p=stack.pop(); out.push(p);
    var nb=[[p[0]+1,p[1]],[p[0]-1,p[1]],[p[0],p[1]+1],[p[0],p[1]-1]];
    for(var i=0;i<4;i++){ var q=nb[i], k=q[0]+','+q[1];
      if(!seen[k] && colorAt(g,q[0],q[1])===col){ seen[k]=1; stack.push(q); } }
  }
  return out;
}
function hasMove(g){
  for(var c=0;c<g.length;c++) for(var r=0;r<g[c].length;r++){
    if(colorAt(g,c,r)===colorAt(g,c,r+1)) return true;
    if(colorAt(g,c,r)===colorAt(g,c+1,r)) return true;
  }
  return false;
}
function countClickable(){
  var n=0;
  for(var c=0;c<grid.length;c++) for(var r=0;r<grid[c].length;r++){
    var col=grid[c][r].color;
    if(colorAt(grid,c,r+1)===col||colorAt(grid,c,r-1)===col||
       colorAt(grid,c+1,r)===col||colorAt(grid,c-1,r)===col) n++;
  }
  return n;
}
function pointsFor(n){ return (n-2)*(n-2); }

/* ---------- Zug ---------- */
function snapshot(){
  return { g:grid.map(function(col){ return col.map(function(s){ return s.color; }); }), score:score, moves:moves };
}
function removeGroup(cells){
  undoStack.push(snapshot()); if(undoStack.length>300) undoStack.shift();
  var n=cells.length;
  score+=pointsFor(n); moves++; sndPop(n);

  var dead=[];
  cells.sort(function(a,b){ return b[1]-a[1]; });
  cells.forEach(function(p){ var s=grid[p[0]][p[1]]; if(s){ dead.push(s.el); grid[p[0]].splice(p[1],1); } });
  dead.forEach(function(el){ el.classList.add('pop'); });
  setTimeout(function(){ dead.forEach(function(el){ if(el.parentNode) el.parentNode.removeChild(el); }); },200);

  for(var c=grid.length-1;c>=0;c--) if(grid[c].length===0) grid.splice(c,1);

  hlGroup=[]; armed=null; hideConfirm(); layout();
  elHint.textContent = n+' Steine  =  '+pointsFor(n)+' Punkte';
  update();

  if(countStones()===0){
    running=false; score+=1000; update(); sndWin();
    setTimeout(function(){ finish(true); },500);
  } else if(!hasMove(grid)){
    running=false;
    var rest=countStones(); score-=rest*3; update(); sndOver();
    setTimeout(function(){ finish(false); },450);
  }
}
function undo(){
  if(!undoStack.length){ sndNope(); elHint.textContent='Nichts mehr rückgängig zu machen.'; return; }
  var h=undoStack.pop();
  build(h.g); score=h.score; moves=h.moves; running=true; armed=null; hideConfirm();
  elHint.textContent='Zug zurückgenommen.'; update();
}
function restart(){
  if(!undoStack.length){ sndNope(); return; }
  var first=undoStack[0];
  confirmNew(function(){ build(first.g); score=0; moves=0; running=true; undoStack=[]; armed=null;
    elHint.textContent='Feld zurückgesetzt.'; update(); });
}
function update(){
  elTotal.textContent=TOTAL; elLeft.textContent=countStones();
  elClick.textContent=countClickable(); elScore.textContent=score;
  var b=bestFor(cfgKey());
  elRec.textContent = 'Stufe '+cfg.level+' – '+levelName(cfg.level) + (b? '  ·  Rekord '+b : '');
  buildMenus(); buildToolbar();
  spielSpeichern();
}

/* ---------- Spielstand sichern ---------- */
function spielSpeichern(){
  if(!running || moves===0){ lsSet('clicko.spiel', null); return; }
  lsSet('clicko.spiel', { g:snapshot().g, score:score, moves:moves, cols:COLS, rows:ROWS,
    colors:cfg.colors, level:cfg.level, undo:undoStack.slice(-50) });
}
function spielLaden(){
  var d=lsGet('clicko.spiel', null);
  if(!d || !d.g || !d.cols) return false;
  cfg.cols=d.cols; cfg.rows=d.rows; cfg.colors=d.colors; cfg.level=d.level;
  COLS=d.cols; ROWS=d.rows; TOTAL=COLS*ROWS;
  fitCells();
  board.style.width=(COLS*CW)+'px'; board.style.height=(ROWS*CH)+'px';
  build(d.g);
  score=d.score; moves=d.moves; running=true; undoStack=d.undo||[]; hlGroup=[]; armed=null; hideConfirm();
  elHint.textContent='Spiel fortgesetzt.';
  fitCells(); applyCellSize();
  update();
  return true;
}

/* ---------- Eingabe: Maus und Finger ---------- */
function cellFromPoint(x,y){
  var b=board.getBoundingClientRect();
  return [ Math.floor((x-b.left)/CW), ROWS-1-Math.floor((y-b.top)/CH) ];
}
/* Am Touchscreen trifft man selten mittig: liegt unter dem Finger nur ein
   einzelner Stein, schauen wir beim näheren Nachbarn nach einer Gruppe. */
function cellForTouch(x,y){
  var p=cellFromPoint(x,y);
  if(at(grid,p[0],p[1]) && findGroup(grid,p[0],p[1]).length>=2) return p;
  var b=board.getBoundingClientRect();
  var fx=(x-b.left)/CW, fy=(y-b.top)/CH;
  var dx=fx-Math.floor(fx)-0.5, dy=fy-Math.floor(fy)-0.5;
  var kand=[];
  if(dx> 0.15) kand.push([p[0]+1, p[1], Math.abs(dx)]);
  if(dx< -0.15) kand.push([p[0]-1, p[1], Math.abs(dx)]);
  if(dy> 0.15) kand.push([p[0], p[1]-1, Math.abs(dy)]);
  if(dy< -0.15) kand.push([p[0], p[1]+1, Math.abs(dy)]);
  kand.sort(function(a,b2){ return b2[2]-a[2]; });
  for(var i=0;i<kand.length;i++){
    var q=kand[i];
    if(at(grid,q[0],q[1]) && findGroup(grid,q[0],q[1]).length>=2) return [q[0],q[1]];
  }
  return p;
}

/* ---------- Grüner Bestätigen-Knopf neben der markierten Gruppe ---------- */
var confirmEl=document.getElementById('confirm');
function hideConfirm(){ confirmEl.classList.remove('show'); confirmEl.innerHTML=''; }
function showConfirm(cells){
  var minC=99, maxC=-1, minR=99, maxR=-1;
  cells.forEach(function(p){
    if(p[0]<minC) minC=p[0]; if(p[0]>maxC) maxC=p[0];
    if(p[1]<minR) minR=p[1]; if(p[1]>maxR) maxR=p[1];
  });
  confirmEl.innerHTML='<div class="ok">&#10003; '+cells.length+' Steine &middot; '+pointsFor(cells.length)+' Punkte</div>'+
                      '<div class="no">&#10005;</div>';
  confirmEl.classList.add('show');
  confirmEl.querySelector('.ok').onclick=function(e){
    e.stopPropagation();
    if(armed){ var g=armed; armed=null; hideConfirm(); removeGroup(g); }
  };
  confirmEl.querySelector('.no').onclick=function(e){
    e.stopPropagation(); armed=null; clearHl(); hideConfirm(); elHint.textContent=' ';
  };
  var fr=frame.getBoundingClientRect(), bo=board.getBoundingClientRect();
  var ox=bo.left-fr.left, oy=bo.top-fr.top;
  var gx=ox+minC*CW, gw=(maxC-minC+1)*CW;
  var gyTop=oy+(ROWS-1-maxR)*CH, gh=(maxR-minR+1)*CH;
  var w=confirmEl.offsetWidth, h=confirmEl.offsetHeight;
  var x=Math.max(4, Math.min(fr.width-w-4, gx+gw/2-w/2));
  var y=gyTop+gh+10;
  if(y+h>fr.height-4) y=gyTop-h-10;
  if(y<4) y=Math.max(4, Math.min(fr.height-h-4, gyTop+gh/2-h/2));
  confirmEl.style.left=x+'px'; confirmEl.style.top=y+'px';
}
function clearHl(){ hlGroup.forEach(function(s){ if(s) s.el.classList.remove('hl'); }); hlGroup=[]; }
function markGroup(cells){
  clearHl();
  if(!cfg.marker) return;
  hlGroup=cells.map(function(q){ return grid[q[0]][q[1]]; });
  hlGroup.forEach(function(st){ if(st) st.el.classList.add('hl'); });
}
function sameGroup(a,b){
  if(!a||!b||a.length!==b.length) return false;
  var key={}; a.forEach(function(p){ key[p[0]+','+p[1]]=1; });
  for(var i=0;i<b.length;i++) if(!key[b[i][0]+','+b[i][1]]) return false;
  return true;
}
function wantsConfirm(isTouch){
  if(cfg.twotap==='yes') return true;
  if(cfg.twotap==='no') return false;
  return isTouch;                      /* 'auto': am Bildschirm tippen = bestaetigen */
}
function hoverAt(x,y){
  if(!running) return;
  var p=cellFromPoint(x,y), s=at(grid,p[0],p[1]);
  if(!s){ if(hlGroup.length){ clearHl(); elHint.textContent=' '; } return; }
  if(hlGroup.length && hlGroup.indexOf(s)>=0) return;
  var cells=findGroup(grid,p[0],p[1]);
  if(cells.length<2){ clearHl(); elHint.textContent='Einzelner Stein – kein Zug.'; return; }
  markGroup(cells);
  elHint.textContent = cfg.preview
    ? cells.length+' Steine  =  '+pointsFor(cells.length)+' Punkte'
    : cells.length+' Steine';
}
function pressAt(x,y,isTouch){
  if(!running){ sndNope(); return; }
  var p = isTouch ? cellForTouch(x,y) : cellFromPoint(x,y);
  if(!at(grid,p[0],p[1])){ armed=null; clearHl(); hideConfirm(); return; }
  var cells=findGroup(grid,p[0],p[1]);
  if(cells.length<2){
    armed=null; clearHl(); hideConfirm(); sndNope();
    elHint.textContent='Mindestens zwei gleiche Steine nötig.';
    return;
  }
  if(wantsConfirm(isTouch) && !sameGroup(armed,cells)){
    armed=cells; markGroup(cells); sndTick(); buzz(8);
    elHint.textContent = (cfg.preview ? cells.length+' Steine = '+pointsFor(cells.length)+' Punkte – ' : '')
                       + 'nochmal tippen';
    return;                                   /* kein aufpoppender Knopf */
  }
  hideConfirm(); buzz(18);
  removeGroup(cells);
}
if(window.PointerEvent){
  board.addEventListener('pointerdown', function(e){
    e.preventDefault(); pressAt(e.clientX, e.clientY, e.pointerType!=='mouse');
  });
  board.addEventListener('pointermove', function(e){
    if(e.pointerType==='mouse' && !armed) hoverAt(e.clientX, e.clientY);
  });
  board.addEventListener('pointerleave', function(e){
    if(e.pointerType==='mouse' && !armed){ clearHl(); if(running) elHint.textContent=' '; }
  });
} else {
  board.addEventListener('mousedown', function(e){ pressAt(e.clientX,e.clientY,false); });
  board.addEventListener('mousemove', function(e){ if(!armed) hoverAt(e.clientX,e.clientY); });
  board.addEventListener('mouseleave', function(){ if(!armed){ clearHl(); if(running) elHint.textContent=' '; } });
  board.addEventListener('touchstart', function(e){
    var t=e.changedTouches[0]; e.preventDefault(); pressAt(t.clientX,t.clientY,true);
  }, {passive:false});
}

/* Spalten/Zeilen so waehlen, dass das Feld die Bildschirmform trifft */
function screenFormat(total){
  var a = freeArea();
  total = total || (cfg.cols*cfg.rows);
  var rows = Math.round(Math.sqrt(total * a[1] / a[0]));
  rows = Math.max(4, Math.min(24, rows));
  var cols = Math.max(4, Math.min(40, Math.round(total/rows)));
  return [cols, rows];
}
/* Spalten/Zeilen so, dass jeder Stein mindestens ~44 px misst */
function touchFormat(){
  var a=freeArea();
  return [ Math.max(4, Math.min(40, Math.floor(a[0]/44))),
           Math.max(4, Math.min(24, Math.floor(a[1]/44))) ];
}
function fitFieldToTouch(){
  var f=touchFormat();
  cfg.cols=f[0]; cfg.rows=f[1]; cfg.tile='auto'; cfg.sizeAuto=false; saveCfg(); confirmNew(newGame);
}
function fitFieldToScreen(){
  var f = screenFormat();
  cfg.cols=f[0]; cfg.rows=f[1]; cfg.sizeAuto=false; saveCfg(); confirmNew(newGame);
}
function setOpt(k,v){ cfg[k]=v; saveCfg(); confirmNew(newGame); }
function setSize(c,r){ cfg.cols=c; cfg.rows=r; cfg.sizeAuto=false; saveCfg(); confirmNew(newGame); }
function buildMenus(){
  menubar.innerHTML='';
  menuDef().forEach(function(m){
    var t=document.createElement('div'); t.className='menutitle'; t.textContent=m.label;
    var dd=document.createElement('div'); dd.className='menu';
    m.items.forEach(function(it){
      if(it.sep){ var s=document.createElement('div'); s.className='msep'; dd.appendChild(s); return; }
      var mi=document.createElement('div'); mi.className='mi'+(it.disabled?' disabled':'');
      mi.innerHTML='<span class="mark">'+(it.radio?'&bull;':(it.check?'&#10003;':''))+'</span><span>'+it.label+'</span>'+
                   (it.key?'<span class="key">'+it.key+'</span>':'');
      mi.onclick=function(ev){ ev.stopPropagation(); closeMenus(); if(!it.disabled&&it.fn) it.fn(); };
      dd.appendChild(mi);
    });
    t.appendChild(dd);
    t.onclick=function(ev){
      ev.stopPropagation();
      if(openMenu===dd){ closeMenus(); }
      else { closeMenus(); dd.classList.add('show'); t.classList.add('open'); openMenu=dd; }
    };
    menubar.appendChild(t);
  });
}

    {html:'<b>+</b>',       title:'Größer',  fn:function(){ zoom(4); }},
    {sep:true},
    {html:svgSound(cfg.sound), title:(cfg.sound?'Ton aus':'Ton an'),
     fn:function(){ cfg.sound=!cfg.sound; saveCfg(); if(cfg.sound) beep(880,0.09); buildToolbar(); buildMenus(); }},
    {sep:true},
    {html:'<b style="color:#c00000">!</b>', title:'Bestenliste', fn:showScores},
    {html:'<b style="color:#000080">?</b>', title:'Hilfe (F1)',  fn:showRules}
  ];
  host.innerHTML='';
  items.forEach(function(it){
    if(it.sep){ var s=document.createElement('div'); s.className='tbsep'; host.appendChild(s); return; }
    var b=document.createElement('div'); b.className='tbtn'+(it.off?' off':'');
    b.title=it.title; b.innerHTML=it.html;
    b.onclick=function(ev){ ev.stopPropagation(); closeMenus(); if(!it.off) it.fn(); };
    host.appendChild(b);
  });
}
document.getElementById('sp-arrow').onclick=showScores;
document.getElementById('tb-close').onclick=function(){ location.href='./'; };

/* ---------- Tastatur ---------- */
document.addEventListener('keydown', function(e){
  if(e.key==='F2'){ e.preventDefault(); confirmNew(newGame); }
  else if(e.key==='F1'){ e.preventDefault(); showRules(); }
  else if(e.key==='F5'){ e.preventDefault(); showSettings(); }
  else if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); undo(); }
  else if(e.key==='Escape'){ closeDialog(); closeMenus(); }
});

/* ---------- Groesse nachfuehren ---------- */
function relayout(){ fitCells(); applyCellSize(); if(armed) showConfirm(armed); }
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', function(){ setTimeout(relayout,250); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
/* Wechsel Handy <-> Desktop: unberührtes Feld sofort neu im passenden Format,
   ein laufendes Spiel bleibt erhalten und wechselt erst beim nächsten Spiel. */
function onFormatChange(){ if(cfg.sizeAuto && moves===0 && !undoStack.length) newGame(); }
if(handyMq.addEventListener) handyMq.addEventListener('change', onFormatChange); else handyMq.addListener(onFormatChange);

/* Auf kleinen Touchgeräten einmalig ein größeres Rasterformat anbieten */
var touchOfferShown=false;
function maybeOfferTouchLayout(){
  if(touchOfferShown || cfg.touchAsked || cfg.sizeAuto) return;
  if(!(window.matchMedia && matchMedia('(pointer:coarse)').matches)) return;
  if(CW>=24) return;
  touchOfferShown=true;
  var f=touchFormat();
  dialog({ title:'Steine sehr klein', body:
    '<p>Auf diesem Bildschirm sind die Steine nur '+CW+' Pixel breit – zum Tippen ziemlich schmal.</p>'+
    '<p>Soll ich das Feld auf '+f[0]+'&times;'+f[1]+' umstellen? Dann werden die Steine gut dreimal so groß. '+
    'Ändern kannst du das jederzeit unter <i>Einstellungen</i>.</p>',
    buttons:[
      {label:'Ja, umstellen', fn:function(){ cfg.touchAsked=true; saveCfg(); fitFieldToTouch(); }},
      {label:'So lassen', fn:function(){ cfg.touchAsked=true; saveCfg(); }}
    ]});
}

/* ---------- Start ---------- */
buildMenus(); buildToolbar();
if(!spielLaden()) newGame();
setTimeout(function(){ relayout(); maybeOfferTouchLayout(); }, 80);
</script>
</body>
</html>
