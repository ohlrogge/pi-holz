<!DOCTYPE html>
<html lang="de">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Teddys Spieleecke</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fdf6ec;
      color: #3a2e22;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 8px;
      text-align: center;
    }
    p.subtitle {
      margin: 0 0 36px;
      opacity: 0.7;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 720px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .card-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease;
    }
    .card-link:hover, .card-link:active {
      transform: translateY(-3px);
    }
    .icon {
      font-size: 3rem;
      line-height: 1;
    }
    .jk-icon {
      width: 64px;
      height: 86px;
      border-radius: 9px;
      background: linear-gradient(158deg,#fffdf6 0%,#ffeec6 55%,#f3d79a 100%);
      border: 1px solid #c9a13c;
      box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(201,161,60,.55), 0 2px 3px rgba(0,0,0,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .jk-icon svg { width: 96%; height: 96%; display: block; }
    .name {
      font-weight: 600;
      font-size: 1.1rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1a15; color: #f1e9dc; }
      .card { background: #2a251e; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
    }
  </style>
</head>
<body>
  <h1>🧸 Teddys Spieleecke</h1>
  <p class="subtitle">Einfach ein Spiel auswählen</p>
  <div class="grid">
    <div class="card">
      <a class="card-link" href="teddikub.html">
        <span class="jk-icon"><svg viewBox="0 0 100 104" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.0 42.0A6.77 6.77 0 0 1 30.7 47.6A6.77 6.77 0 0 1 33.6 60.3A6.77 6.77 0 0 1 25.5 70.5A6.77 6.77 0 0 1 12.5 70.5A6.77 6.77 0 0 1 4.4 60.3A6.77 6.77 0 0 1 7.3 47.6A6.77 6.77 0 0 1 19.0 42.0Z" fill="#4b3421"/>
          <path d="M81.0 42.0A6.77 6.77 0 0 1 92.7 47.6A6.77 6.77 0 0 1 95.6 60.3A6.77 6.77 0 0 1 87.5 70.5A6.77 6.77 0 0 1 74.5 70.5A6.77 6.77 0 0 1 66.4 60.3A6.77 6.77 0 0 1 69.3 47.6A6.77 6.77 0 0 1 81.0 42.0Z" fill="#4b3421"/>
          <path d="M50.0 15.0A8.5 8.5 0 0 1 65.7 19.6A8.5 8.5 0 0 1 76.4 32.0A8.5 8.5 0 0 1 78.7 48.1A8.5 8.5 0 0 1 71.9 63.0A8.5 8.5 0 0 1 58.2 71.8A8.5 8.5 0 0 1 41.8 71.8A8.5 8.5 0 0 1 28.1 63.0A8.5 8.5 0 0 1 21.3 48.1A8.5 8.5 0 0 1 23.6 32.0A8.5 8.5 0 0 1 34.3 19.6A8.5 8.5 0 0 1 50.0 15.0Z" fill="#75523a"/>
          <path d="M50.0 52.0A7.47 7.47 0 0 1 63.5 56.9A7.47 7.47 0 0 1 70.7 69.4A7.47 7.47 0 0 1 68.2 83.5A7.47 7.47 0 0 1 57.2 92.7A7.47 7.47 0 0 1 42.8 92.7A7.47 7.47 0 0 1 31.8 83.5A7.47 7.47 0 0 1 29.3 69.4A7.47 7.47 0 0 1 36.5 56.9A7.47 7.47 0 0 1 50.0 52.0Z" fill="#efe7da"/>
          <path d="M40 64 C44 59 56 59 60 64 C62 69 56 74 50 74 C44 74 38 69 40 64 Z" fill="#2b1d15"/>
          <path d="M50 74 L50 79 M50 79 C45 86 39 85 37 80 M50 79 C55 86 61 85 63 80" stroke="#2b1d15" stroke-width="3.4" fill="none" stroke-linecap="round"/>
          <circle cx="36" cy="43" r="5.2" fill="#2b1d15"/>
          <circle cx="64" cy="43" r="5.2" fill="#2b1d15"/>
        </svg></span>
        <span class="name">Teddikub</span>
      </a>
    </div>
    <div class="card">
      <a class="card-link" href="teddydoku.html">
        <span class="icon">🔢</span>
        <span class="name">Teddydoku</span>
      </a>
    </div>
    <div class="card">
      <a class="card-link" href="teddymania.html">
        <span class="icon">🟥🟩🟦</span>
        <span class="name">Teddymania</span>
      </a>
    </div>
    <div class="card">
      <a class="card-link" href="teddyversi.html">
        <span class="icon">⚫🔴</span>
        <span class="name">Teddyversi</span>
      </a>
    </div>
  </div>
</body>
</html>
