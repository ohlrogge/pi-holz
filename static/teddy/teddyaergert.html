<style>
:root{
  --schrift:"Arial Rounded MT Bold","Arial Rounded MT",ui-rounded,"SF Pro Rounded","Helvetica Rounded","Nunito","Trebuchet MS",sans-serif;
  --stein-grau:#a9ada2;
  --schwarz:#161616; --tinte:#1c1c1c;
  --rot:#d8232b; --rot2:#a8141b;
  --blau:#1f4fa8; --gelb:#f2b200;
  --weiss:#f6f4ee;
  --wuerfel:56px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; position:fixed; inset:0; overflow:hidden;
  background:var(--stein-grau);
  font-family:var(--schrift);
  color:var(--tinte); user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none; touch-action:manipulation; overscroll-behavior:none;
}
#wrap{position:absolute; inset:0; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top);}

.kugel{border-radius:50%; box-shadow:inset -3px -3px 5px rgba(0,0,0,.35), inset 3px 3px 5px rgba(255,255,255,.55);}
.k0{background:var(--rot);} .k1{background:var(--blau);} .k2{background:var(--gelb);} .k3{background:#3a3a3a; outline:1.5px solid #777;}

/* ---------- Spielfläche: Brett und Würfelschale ---------- */
#main{flex:1 1 auto; min-height:0; position:relative;}
#brett{position:absolute; display:block; touch-action:none;}
#schale{
  position:absolute; overflow:hidden; touch-action:none; cursor:grab;
  background:#e9e7e0; border:4px solid var(--schwarz); border-radius:4px;
  perspective:1100px;
}
#schale::before{  /* Bauhaus-Viertelkreis in der Ecke */
  content:""; position:absolute; right:-38%; bottom:-38%; width:76%; aspect-ratio:1; border-radius:50%;
  background:var(--dran, var(--rot)); opacity:.9; transition:background .35s;
}
#schale::after{
  content:""; position:absolute; left:10px; top:10px; width:18%; height:6px; background:var(--schwarz);
}
#schale.dran{box-shadow:0 0 0 3px var(--weiss), 0 0 0 6px var(--dran, var(--rot));}
#schatten{
  position:absolute; left:0; top:0; width:var(--wuerfel); height:var(--wuerfel);
  margin:calc(var(--wuerfel) / -2) 0 0 calc(var(--wuerfel) / -2);
  border-radius:28%; background:rgba(0,0,0,.34); filter:blur(5px); pointer-events:none;
}
#wuerfel{
  position:absolute; left:0; top:0; width:var(--wuerfel); height:var(--wuerfel);
  margin:calc(var(--wuerfel) / -2) 0 0 calc(var(--wuerfel) / -2);
  transform-style:preserve-3d; pointer-events:none;
}
#wuerfel .seite{
  position:absolute; inset:0; border-radius:16%;
  background:var(--weiss); box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.28);
}
#wuerfel .auge{position:absolute; width:19%; height:19%; margin:-9.5% 0 0 -9.5%; border-radius:50%; background:var(--schwarz);}
/* Kommentare mitten in der Schale, unter dem Würfel */
#kommentar{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; padding:18px 14px; text-align:center; pointer-events:none;
  color:var(--tinte); text-shadow:0 0 4px #e9e7e0, 0 0 10px #e9e7e0, 0 0 14px #e9e7e0;
}
#statusTxt{font-size:19px; line-height:1.2; letter-spacing:.3px;}
#kommentar.warn #statusTxt{color:var(--rot2);}
#hinweis{font-size:13px; line-height:1.3; opacity:.72; max-width:30em;}

/* Markierungen auf dem Brett */
.ring{fill:none; stroke:var(--schwarz); stroke-width:1.1; stroke-dasharray:2.2 1.6; animation:laufen 1s linear infinite;}
.ring.ziel{stroke-width:.8; stroke-dasharray:1.6 1.2; animation:laufen 1.4s linear infinite reverse;}
.ring.fest{stroke-dasharray:none; animation:none; stroke-width:1.5;}
.ring.blass{opacity:.3;}
#geister{pointer-events:none;}
#lupe{position:absolute; display:none; z-index:20; border-radius:50%; overflow:hidden; touch-action:none;
  border:4px solid var(--schwarz); background:#f6f4ee; box-shadow:0 10px 28px rgba(0,0,0,.4);}
#lupe.on{display:block; animation:auf .12s ease-out;}
@keyframes auf{from{transform:scale(.6); opacity:0;}}
#lupe svg{width:100%; height:100%; display:block;}
#lupeTxt{position:absolute; left:0; right:0; bottom:9%; text-align:center; font-size:12px; pointer-events:none;
  color:var(--tinte); text-shadow:0 0 3px #fff, 0 0 6px #fff;}
@keyframes laufen{to{stroke-dashoffset:-7.6;}}

/* ---------- Symbolleiste ---------- */
#bar{
  flex:0 0 auto; display:flex; align-items:stretch; gap:6px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:var(--schwarz); box-shadow:0 -3px 0 var(--rot);
}
.btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:46px; padding:3px 9px; cursor:pointer; flex:1 1 0;
  border:2px solid #111; border-radius:10px;
  background:var(--weiss); color:var(--tinte);
  font-family:var(--schrift); font-size:11px; line-height:1.15; white-space:nowrap;
}
.btn:active{opacity:.75;}
.btn[disabled]{opacity:.42; pointer-events:none;}
.btn .ico{font-size:16px; line-height:1;}
.ecke-ico{width:1.25em; height:1.25em; border-radius:22%; display:block; margin:0 auto;}
.btn.go{background:var(--rot); color:#fff; flex:1.6 1 0;}

/* ---------- Dialoge ---------- */
#veil{position:absolute; inset:0; background:rgba(10,10,10,.62); display:none; z-index:40;
  align-items:center; justify-content:center; padding:14px; overflow:auto;}
#veil.on{display:flex;}
.dlg{
  background:#e8e9e3; color:var(--tinte); border-radius:14px;
  border:4px solid var(--schwarz);
  max-width:480px; width:100%; max-height:100%; overflow:auto; padding:16px 18px 18px;
}
.dlg h2{margin:0 0 8px; font-size:24px; color:var(--rot); letter-spacing:.5px;}
.dlg h3{margin:14px 0 4px; font-size:16px; color:var(--tinte);}
.dlg p,.dlg li{font-size:14px; line-height:1.5; margin:5px 0; font-family:var(--schrift);}
.dlg ul{margin:4px 0; padding-left:20px;}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.row .btn{flex:1 1 auto; min-height:42px; font-size:15px;}
.lvl{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.lvl button{
  display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer;
  border:2px solid var(--schwarz); border-radius:10px; padding:9px 12px; font-size:16px;
  background:var(--weiss); color:var(--tinte); font-family:var(--schrift);
}
.lvl button.an{background:var(--rot); color:#fff;}
.lvl button:active{opacity:.75;}
.lvl b{flex:1 1 auto; font-weight:normal;}
.lvl span{font-size:12px; opacity:.8; display:block; margin-top:1px;}
table.sc{width:100%; border-collapse:collapse; margin-top:8px; font-size:15px;}
table.sc th,table.sc td{padding:6px; border-bottom:2px solid rgba(0,0,0,.15); text-align:left;}
table.sc td.n{text-align:right;}
table.sc tr.me{background:rgba(216,35,43,.16);}
.opt{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:2px solid rgba(0,0,0,.12);}
.opt label{font-size:15px;}
.opt label span{display:block; font-size:12px; opacity:.7;}
.sw{
  width:52px; height:28px; border-radius:14px; border:2px solid var(--schwarz); background:#bdb9b0;
  position:relative; cursor:pointer; flex:0 0 auto;
}
.sw i{position:absolute; top:1px; left:1px; width:22px; height:22px; border-radius:50%;
  background:var(--weiss); box-shadow:0 0 0 2px #111 inset; transition:left .14s;}
.sw.on{background:var(--rot);} .sw.on i{left:25px;}
.sw.aus{opacity:.35; pointer-events:none;}
p.klein{font-size:13px; opacity:.8; margin:6px 0 2px;}
.sitz{display:flex; align-items:center; gap:10px; padding:5px 0;}
.sitz .kugel{width:24px; height:24px; flex:0 0 auto;}
.sitz b{flex:1 1 auto; font-weight:normal; font-size:16px;}
.seg{display:flex; flex:0 0 auto; border:2px solid var(--schwarz); border-radius:10px; overflow:hidden;}
.seg button{border:0; border-left:2px solid var(--schwarz); background:var(--weiss); color:var(--tinte);
  font-family:var(--schrift); font-size:14px; padding:8px 10px; cursor:pointer;}
.seg button:first-child{border-left:0;}
.seg button.an{background:var(--rot); color:#fff;}
.seg.breit button, .sitz .seg button{flex:1 1 0; padding-left:2px; padding-right:2px;}
.sitz .seg{flex:0 0 176px; width:176px;}
.sitz b{min-width:0; overflow:hidden; text-overflow:ellipsis;}
.namezeile{padding:0 0 6px 34px;}
.teamblock{border:2px solid var(--schwarz); border-left-width:8px; border-radius:12px; padding:4px 10px 4px 10px; margin:8px 0;}
.teamkopf{display:flex; align-items:center; gap:4px; font-size:14px; padding:4px 0 2px;}
.teamkopf .kugel{width:14px; height:14px;}
.teamkopf .kugel + .kugel{margin-right:6px;}
.namefeld{width:100%; font-family:var(--schrift); font-size:16px; padding:8px 10px; color:var(--tinte);
  border:2px solid var(--schwarz); border-radius:10px; background:#fff; user-select:text; -webkit-user-select:text;}
.namefeld::placeholder{color:#8d8a82;}
.seg.aus{opacity:.4; pointer-events:none;}

/* ---------- Startbild ---------- */
#title{text-align:center; margin-bottom:6px;}
#title .nm{font-size:34px; line-height:1.05; color:var(--rot); letter-spacing:.5px;}
#title .streifen{height:6px; margin:10px 18px 0; background:var(--schwarz);}
#title svg{width:64px; height:67px; display:block; margin:0 auto 4px;}

@media (pointer:coarse){
  .btn{min-width:50px; min-height:50px; font-size:12px;}
  .btn .ico{font-size:19px;}
  .lvl button{padding:13px 14px; font-size:17px;}
  .row .btn{min-height:50px; font-size:16px;}
  .dlg p,.dlg li{font-size:15px;}
  .sw{width:58px; height:32px; border-radius:16px;}
  .sw i{width:26px; height:26px;} .sw.on i{left:27px;}
  .seg button{padding:11px 11px; font-size:15px;}
}
@media (max-width:420px){
  #statusTxt{font-size:17px;}
  #title .nm{font-size:29px;}
}
</style>

</div>
<div id="veil"><div class="dlg" id="dlg"></div></div>
<script>
"use strict";

/* ==================================================================
   Teddy ärgert dich nicht - nach dem Vorbild von "Mensch ärgere dich
   nicht": Du gegen drei Teddys. Eine Datei, keine Bibliotheken, kein Netz.
   Der Würfel ist ein kleiner Physik-Körper in einer Schale: Schütteln
   des Handys oder ein Wurf mit dem Finger bestimmen, wie er fällt.
   ================================================================== */

/* ---------- Einstellungen ---------- */
var cfg = { v:2, stufe:2, schlagzwang:true, team:false, schuetteln:true, bestaetigen:false, vibrate:true, sound:false,
            sitze:['mensch','teddy','teddy','teddy'], namen:['','','',''], vorschau:false };
var saved = lsGet('teddy.aerger.cfg', null);
/* Fassung 1 kannte nur zwei Stufen - deren Nummern bedeuten heute etwas anderes */
if (saved) for (var ck in saved) if (ck in cfg && ck !== 'v' && (ck !== 'stufe' || saved.v === 2)) cfg[ck] = saved[ck];
if (!(cfg.sitze instanceof Array) || cfg.sitze.length !== 4) cfg.sitze = ['mensch','teddy','teddy','teddy'];
if (!(cfg.namen instanceof Array) || cfg.namen.length !== 4) cfg.namen = ['','','',''];
function saveCfg(){ lsSet('teddy.aerger.cfg', cfg); }

var STUFEN = [
  { name:'Gemütlich', txt:'Die Teddys ziehen meist irgendeine Figur.' },
  { name:'Normal',    txt:'Die Teddys schlagen, wenn es geht, und laufen sonst drauflos.' },
  { name:'Gewitzt',   txt:'Die Teddys bringen sich in Sicherheit – und haben es besonders auf Menschen abgesehen.' },
  { name:'Meister',   txt:'Die Teddys wägen ab, was auf dem Spiel steht, und spielen so gut, wie sie können.' }
];
/* Die Plätze liegen fest: Rot unten links, dann im Uhrzeigersinn */
var SPIELER = [
  { wort:'Rot',     farbe:'#d8232b', dunkel:'#7d0d12' },
  { wort:'Blau',    farbe:'#1f4fa8', dunkel:'#0b2560' },
  { wort:'Gelb',    farbe:'#f2b200', dunkel:'#8a6200' },
  { wort:'Schwarz', farbe:'#2c2c2c', dunkel:'#000000' }
];

/* ---------- Zufall: vom Gerät, nicht vorhersagbar ---------- */
function zufall(){
  try{ var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
  catch(e){ return Math.random(); }
}

/* ---------- Ton und Vibration ---------- */
var actx = null;
function ton(f, d, typ, laut){
  if (!cfg.sound) return;
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = typ || 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(laut || .16, actx.currentTime + .005);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + d + .02);
  }catch(e){}
}
function summ(ms){ if (cfg.vibrate && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

/* PHYSIK-ANFANG ======================================================
   Der Würfel als starrer Körper: Kantenlänge 2 (Einheit = halbe Kante),
   Masse 1. Koordinaten wie im Bildschirm: x nach rechts, y nach unten,
   z aus dem Bildschirm heraus. Die Schale ist ein Kasten mit Boden (z=0),
   vier Wänden und einem unsichtbaren Glasdeckel.
   Stöße werden an den acht Ecken als Impulse aufgelöst; das Ergebnis ist
   die Seite, die am Ende nach oben zeigt.
   ================================================================== */
var PH = {
  G: 250,            /* Schwerkraft in Einheiten/s² (gemächlicher als echt, damit man zusehen kann) */
  DT: 1/240,
  DECKE: 5,
  REIB: 0.25,
  STOSS: 0.55,
  INV_I: 1.5         /* 1 / (m·a²/6) mit a = 2 */
};
/* Seiten: Normale im Würfel und Augenzahl; Gegenseiten ergeben 7 */
var SEITEN = [
  { n:[0,0,1],  z:1 }, { n:[0,0,-1], z:6 },
  { n:[1,0,0],  z:2 }, { n:[-1,0,0], z:5 },
  { n:[0,1,0],  z:3 }, { n:[0,-1,0], z:4 }
];
var ECKEN = [];
(function(){ for (var i=0;i<8;i++) ECKEN.push([i&1?1:-1, i&2?1:-1, i&4?1:-1]); })();

function neuerWuerfel(breite, tiefe){
  return { p:[breite/2, tiefe/2, 1], v:[0,0,0], q:[1,0,0,0], om:[0,0,0],
           breite:breite, tiefe:tiefe, gehalten:false, wach:false, ruhe:0,
           aufprall:null };
}
function kreuz(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function punkt(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function laenge(a){ return Math.sqrt(punkt(a,a)); }
function qMal(a,b){
  return [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
          a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
          a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
          a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
}
function qNorm(q){ var l = Math.sqrt(q[0]*q[0]+q[1]*q[1]+q[2]*q[2]+q[3]*q[3]); return [q[0]/l,q[1]/l,q[2]/l,q[3]/l]; }
function matrix(q){
  var w=q[0], x=q[1], y=q[2], z=q[3];
  return [[1-2*(y*y+z*z), 2*(x*y-w*z),   2*(x*z+w*y)],
          [2*(x*y+w*z),   1-2*(x*x+z*z), 2*(y*z-w*x)],
          [2*(x*z-w*y),   2*(y*z+w*x),   1-2*(x*x+y*y)]];
}
function drehen(R, v){
  return [R[0][0]*v[0]+R[0][1]*v[1]+R[0][2]*v[2],
          R[1][0]*v[0]+R[1][1]*v[1]+R[1][2]*v[2],
          R[2][0]*v[0]+R[2][1]*v[1]+R[2][2]*v[2]];
}
/* Welche Seite zeigt nach oben, und wie gerade liegt sie? */
function obenAuf(W){
  var R = matrix(W.q), best = null, bz = -2;
  for (var i=0;i<6;i++){
    var nz = R[2][0]*SEITEN[i].n[0] + R[2][1]*SEITEN[i].n[1] + R[2][2]*SEITEN[i].n[2];
    if (nz > bz){ bz = nz; best = SEITEN[i].z; }
  }
  return { zahl:best, gerade:bz };
}
/* Lage, in der die Seite `zahl` oben liegt, um `gier` um die Hochachse gedreht */
function lageFuer(zahl, gier){
  var c = Math.SQRT1_2, basis = { 1:[1,0,0,0], 6:[0,1,0,0], 2:[c,0,-c,0], 5:[c,0,c,0], 3:[c,c,0,0], 4:[c,-c,0,0] }[zahl];
  return qMal([Math.cos(gier/2),0,0,Math.sin(gier/2)], basis);
}

function stossAnEcke(W, r, n){
  var u = [W.v[0] + W.om[1]*r[2]-W.om[2]*r[1], W.v[1] + W.om[2]*r[0]-W.om[0]*r[2], W.v[2] + W.om[0]*r[1]-W.om[1]*r[0]];
  var vn = punkt(u, n);
  if (vn >= 0) return;
  var e = vn < -2 ? PH.STOSS : 0;
  var rn = kreuz(r, n);
  var j = -(1+e) * vn / (1 + PH.INV_I * punkt(rn, rn));
  W.v[0] += j*n[0]; W.v[1] += j*n[1]; W.v[2] += j*n[2];
  W.om[0] += PH.INV_I*j*rn[0]; W.om[1] += PH.INV_I*j*rn[1]; W.om[2] += PH.INV_I*j*rn[2];
  if (W.aufprall && vn < -12) W.aufprall(-vn);
  /* Reibung entlang der Fläche, höchstens REIB mal der Stoß */
  u = [W.v[0] + W.om[1]*r[2]-W.om[2]*r[1], W.v[1] + W.om[2]*r[0]-W.om[0]*r[2], W.v[2] + W.om[0]*r[1]-W.om[1]*r[0]];
  var un = punkt(u, n), ut = [u[0]-un*n[0], u[1]-un*n[1], u[2]-un*n[2]], lt = laenge(ut);
  if (lt < 1e-7) return;
  var t = [ut[0]/lt, ut[1]/lt, ut[2]/lt], rt = kreuz(r, t);
  var jt = -lt / (1 + PH.INV_I * punkt(rt, rt));
  if (jt < -PH.REIB*j) jt = -PH.REIB*j;
  W.v[0] += jt*t[0]; W.v[1] += jt*t[1]; W.v[2] += jt*t[2];
  W.om[0] += PH.INV_I*jt*rt[0]; W.om[1] += PH.INV_I*jt*rt[1]; W.om[2] += PH.INV_I*jt*rt[2];
}

/* Ein Zeitschritt; `aussen` ist die Scheinkraft aus dem Schütteln (Einheiten/s²). */
function schritt(W, dt, aussen){
  var i, k, it;
  W.v[0] += aussen[0]*dt; W.v[1] += aussen[1]*dt; W.v[2] += (aussen[2] - PH.G)*dt;
  var dl = 1 - 0.15*dt, dw = 1 - 0.3*dt;
  for (i=0;i<3;i++){ W.v[i] *= dl; W.om[i] *= dw; }
  W.p[0] += W.v[0]*dt; W.p[1] += W.v[1]*dt; W.p[2] += W.v[2]*dt;
  var om = W.om, q = W.q;
  var dq = qMal([0, om[0], om[1], om[2]], q);
  W.q = qNorm([q[0]+.5*dq[0]*dt, q[1]+.5*dq[1]*dt, q[2]+.5*dq[2]*dt, q[3]+.5*dq[3]*dt]);

  var ebenen = [[[0,0,1],0], [[1,0,0],0], [[-1,0,0],-W.breite], [[0,1,0],0], [[0,-1,0],-W.tiefe], [[0,0,-1],-PH.DECKE]];
  var R = matrix(W.q), rs = [];
  for (k=0;k<8;k++) rs.push(drehen(R, ECKEN[k]));
  var amBoden = false;
  for (it=0; it<3; it++){
    for (i=0;i<ebenen.length;i++){
      var n = ebenen[i][0], d = ebenen[i][1], tief = 0;
      for (k=0;k<8;k++){
        var pen = d - (n[0]*(W.p[0]+rs[k][0]) + n[1]*(W.p[1]+rs[k][1]) + n[2]*(W.p[2]+rs[k][2]));
        if (pen > 0){
          stossAnEcke(W, rs[k], n);
          if (pen > tief) tief = pen;
          if (i === 0) amBoden = true;
        }
      }
      if (tief > 0 && it === 0){ W.p[0] += n[0]*tief; W.p[1] += n[1]*tief; W.p[2] += n[2]*tief; }
    }
  }
  /* Rollwiderstand auf dem Filz */
  if (amBoden){ var rw = 1 - 1.2*dt; for (i=0;i<3;i++) W.om[i] *= rw; }
}

/* Ruht der Würfel? Liegt er schief (an der Wand gelehnt), wird er leicht angestupst. */
function ruhePruefen(W, dt, rnd){
  if (laenge(W.v) < 2.5 && laenge(W.om) < 1.2) W.ruhe += dt; else W.ruhe = 0;
  if (W.ruhe < 0.18) return false;
  var o = obenAuf(W);
  if (o.gerade > 0.96){ W.v = [0,0,0]; W.om = [0,0,0]; W.wach = false; return true; }
  var mx = W.breite/2 - W.p[0], my = W.tiefe/2 - W.p[1], ml = Math.sqrt(mx*mx+my*my) || 1;
  W.v = [mx/ml*8, my/ml*8, 7];
  W.om = [(rnd()-.5)*14, (rnd()-.5)*14, (rnd()-.5)*6];
  W.ruhe = 0;
  return false;
}

/* In der Hand oder im Becher wird der Würfel durchgemischt: Er verlässt sie in
   einer ganz zufälligen Lage. Weil der Würfel symmetrisch ist, wird dadurch
   jede Augenzahl exakt gleich wahrscheinlich - welche es wird, entscheidet
   dann der Flug durch die Schale, also Richtung und Schwung des Wurfs. */
function gemischteLage(rnd){
  var u1 = rnd(), u2 = rnd()*Math.PI*2, u3 = rnd()*Math.PI*2, a = Math.sqrt(1-u1), b = Math.sqrt(u1);
  return [a*Math.sin(u2), a*Math.cos(u2), b*Math.sin(u3), b*Math.cos(u3)];
}
/* Ein Wurf aus der Hand: Schwung in zufälliger Richtung, kräftiger Drall. */
function zufallsWurf(W, rnd){
  var a = rnd()*Math.PI*2, sp = 30 + 25*rnd();
  W.p[2] = Math.max(W.p[2], 2.4);
  W.q = gemischteLage(rnd);
  W.v = [Math.cos(a)*sp, Math.sin(a)*sp, 18 + 12*rnd()];
  W.om = [(rnd()-.5)*80, (rnd()-.5)*80, (rnd()-.5)*40];
  W.wach = true; W.ruhe = 0;
}
/* Ein Wurf mit dem Finger: v ist die Geschwindigkeit beim Loslassen. */
function fingerWurf(W, v, rnd){
  var sp = Math.sqrt(v[0]*v[0]+v[1]*v[1]);
  if (sp < 8){                           /* nur angetippt: in zufällige Richtung */
    var a = rnd()*Math.PI*2;
    v = [Math.cos(a), Math.sin(a)]; sp = 1;
  }
  /* Richtung vom Finger, Schwung mindestens so viel, dass er sicher kullert */
  var ziel = Math.max(40, Math.min(65, sp));
  v = [v[0]/sp*ziel, v[1]/sp*ziel]; sp = ziel;
  W.p[2] = Math.max(W.p[2], 2.6);        /* aus der Hand bzw. dem Becher: er fällt erst */
  W.q = gemischteLage(rnd);
  W.v = [v[0], v[1], 18 + sp*0.2];
  /* Rollen in Wurfrichtung, dazu ein Hauch Luftwirbel */
  var om = [-v[1]*0.9 + (rnd()-.5)*30, v[0]*0.9 + (rnd()-.5)*30, (rnd()-.5)*24];
  var ol = laenge(om);
  if (ol < 60){ om = [om[0]*60/ol, om[1]*60/ol, om[2]*60/ol]; }
  W.om = om;
  W.gehalten = false; W.wach = true; W.ruhe = 0;
}

/* ==================================================================
   Das Brett
   ------------------------------------------------------------------
   11 × 11 Raster. Die Laufbahn hat 40 Felder; Feld 0 ist dein Start,
   die Teddys starten jeweils 10 Felder weiter im Uhrzeigersinn.
   Eine Figur zählt ihre Schritte relativ: -1 = im Haus, 0..39 auf der
   Bahn, 40..43 im Ziel.
   ================================================================== */
var BAHN = [[4,10],[4,9],[4,8],[4,7],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5],
            [0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[4,0],[5,0],
            [6,0],[6,1],[6,2],[6,3],[6,4],[7,4],[8,4],[9,4],[10,4],[10,5],
            [10,6],[9,6],[8,6],[7,6],[6,6],[6,7],[6,8],[6,9],[6,10],[5,10]];
var ZIEL = [[[5,9],[5,8],[5,7],[5,6]], [[1,5],[2,5],[3,5],[4,5]],
            [[5,1],[5,2],[5,3],[5,4]], [[9,5],[8,5],[7,5],[6,5]]];
var HAUS = [[[0,9],[1,9],[0,10],[1,10]], [[0,0],[1,0],[0,1],[1,1]],
            [[9,0],[10,0],[9,1],[10,1]], [[9,9],[10,9],[9,10],[10,10]]];
var ECKE = [[-3,113], [-3,-3], [113,-3], [113,113]];

function absolut(p, rel){ return (rel + 10*p) % 40; }
function feldXY(p, i, rel){
  var c = rel < 0 ? HAUS[p][i] : (rel < 40 ? BAHN[absolut(p, rel)] : ZIEL[p][rel-40]);
  return [c[0]*10 + 5, c[1]*10 + 5];
}

/* ==================================================================
   Spielregeln
   ------------------------------------------------------------------
   Ein Zug ist { p, i, von, nach, schlag }: Figur i von Spieler p.
   Im Team-Spiel darf man auch die Figuren des Partners ziehen, die
   schon draußen sind - rausholen darf jeder nur seine eigenen.
   ================================================================== */
/* Im Team-Spiel gehören die schräg gegenüberliegenden Farben zusammen */
function partner(p, team){ return team ? (p+2) % 4 : -1; }
function freunde(p, q, team){ return p === q || q === partner(p, team); }
function besetzt(fig, feldAbs){
  for (var q=0;q<4;q++) for (var i=0;i<4;i++){
    var r = fig[q][i];
    if (r >= 0 && r < 40 && absolut(q, r) === feldAbs) return { p:q, i:i };
  }
  return null;
}
function kannZiehen(fig, q, i, w, team){
  var r = fig[q][i], nach, k;
  if (r === -1){
    if (w !== 6) return -1;
    nach = 0;
  } else {
    nach = r + w;
    if (nach > 43) return -1;
    if (nach >= 40){
      /* Im Ziel wird nicht übersprungen */
      for (k = Math.max(r+1, 40); k <= nach; k++) if (fig[q].indexOf(k) >= 0) return -1;
      return nach;
    }
  }
  /* Auf eigene Figuren zieht man nicht; den Partner darf man schlagen */
  if (fig[q].indexOf(nach) >= 0) return -1;
  return nach;
}
function zuegeFuer(fig, p, w, team){
  var liste = [], wer = team ? [p, partner(p, team)] : [p], eng;
  wer.forEach(function(q){
    for (var i=0;i<4;i++){
      if (q !== p && fig[q][i] < 0) continue;
      var nach = kannZiehen(fig, q, i, w, team);
      if (nach < 0) continue;
      liste.push({ p:q, i:i, von:fig[q][i], nach:nach, schlag: nach < 40 ? besetzt(fig, absolut(q, nach)) : null });
    }
  });
  var imHaus = fig[p].indexOf(-1) >= 0, aufStart = fig[p].indexOf(0);
  /* Pflicht 1: mit einer Sechs raus, wenn das Startfeld frei ist */
  if (w === 6 && imHaus && aufStart < 0){
    eng = liste.filter(function(z){ return z.p === p && z.von === -1; });
    if (eng.length) liste = eng;
  }
  /* Pflicht 2: das Startfeld räumen, solange noch Figuren im Haus warten */
  else if (imHaus && aufStart >= 0){
    eng = liste.filter(function(z){ return z.p === p && z.i === aufStart; });
    if (eng.length) liste = eng;
  }
  return liste;
}
/* Schlagzwang: Züge, die einen Gegner schlagen (den Partner schlagen muss man nie).
   Wer einen davon hat und trotzdem anders zieht, verliert die Figur, die hätte
   schlagen können - bei mehreren die am weitesten vorgerückte. */
function schlagZuege(liste, p, team){
  return liste.filter(function(z){ return z.schlag && !freunde(p, z.schlag.p, team); });
}
function pustFigur(fig, pflicht){
  var best = null;
  pflicht.forEach(function(z){
    var r = fig[z.p][z.i];
    if (r >= 0 && (!best || r > fig[best.p][best.i])) best = { p:z.p, i:z.i };
  });
  return best;
}
/* Dreimal würfeln darf, wer keine Figur mehr bewegen kann außer mit einer Sechs */
function dreiVersuche(fig, p, team){
  var wer = team ? [p, partner(p, team)] : [p];
  for (var n=0;n<wer.length;n++) for (var i=0;i<4;i++){
    var q = wer[n], r = fig[q][i];
    if (r >= 0 && r < 40) return false;
    if (r >= 40) for (var w=1; w<=3; w++) if (kannZiehen(fig, q, i, w, team) >= 0) return false;
  }
  return true;
}
function imZiel(fig, p){ var n=0; for (var i=0;i<4;i++) if (fig[p][i] >= 40) n++; return n; }
function gewonnen(fig, p, team){
  return team ? imZiel(fig, p) + imZiel(fig, partner(p, team)) === 8 : imZiel(fig, p) === 4;
}

/* ==================================================================
   Die Teddys
   ------------------------------------------------------------------
   kx beschreibt die Runde: wer mitspielt (aktiv), wer Mensch ist, Team.
   ================================================================== */
/* Wie viele Gegner könnten dieses Feld im nächsten Zug treffen? */
function bedrohung(fig, besitzer, feldAbs, kx){
  var n = 0;
  for (var q=0;q<4;q++){
    if (!kx.aktiv[q] || freunde(besitzer, q, kx.team)) continue;
    for (var i=0;i<4;i++){
      var r = fig[q][i];
      if (r < 0 || r >= 40) continue;
      var d = (feldAbs - absolut(q, r) + 40) % 40;
      if (r + d > 39) continue;
      if (d >= 1 && d <= 6) n += kx.mensch[q] ? 1.2 : 1;
    }
    if (feldAbs === 10*q && fig[q].indexOf(-1) >= 0) n += 0.8;
  }
  return n;
}
function brettNach(fig, z){
  var b = fig.map(function(a){ return a.slice(); });
  b[z.p][z.i] = z.nach;
  if (z.schlag) b[z.schlag.p][z.schlag.i] = -1;
  return b;
}
/* Bewertung eines Zugs. Ab Gewitzt achten die Teddys auf Gefahr; der
   Meister wiegt sie nach dem, was auf dem Spiel steht - je weiter eine
   Figur schon ist, desto teurer wäre es, sie zu verlieren - drängt stärker
   nach vorn und würfelt kaum noch aus dem Bauch. */
function zugWert(fig, p, z, kx, stufe){
  var meister = stufe === 3;
  var w = z.nach * (meister ? .5 : .25) + zufall() * (meister ? .3 : 3);
  if (z.von === -1) w += 30;
  if (z.schlag && freunde(p, z.schlag.p, kx.team)) w -= 60;
  else if (z.schlag){ w += 40 + fig[z.schlag.p][z.schlag.i]*0.6; if (stufe >= 2 && kx.mensch[z.schlag.p]) w += 18; }
  if (z.nach >= 40) w += (z.von < 40 ? 35 : 0) + (z.nach-40)*3;
  if (stufe >= 2){
    var gewicht = function(r){ return meister ? .6 + r*.025 : 1; };
    if (z.p === p && z.von === 0 && fig[p].indexOf(-1) >= 0) w += 12;
    if (z.von >= 0 && z.von < 40) w += 10 * bedrohung(fig, z.p, absolut(z.p, z.von), kx) * gewicht(z.von);
    if (z.nach < 40) w -= 12 * bedrohung(brettNach(fig, z), z.p, absolut(z.p, z.nach), kx) * gewicht(z.nach);
  }
  return w;
}
function teddyWahl(fig, p, liste, stufe, kx){
  if (liste.length === 1) return liste[0];
  /* Nur der gemütliche Teddy vergisst manchmal das Schlagen */
  var pflicht = kx.schlagzwang ? schlagZuege(liste, p, kx.team) : [];
  if (pflicht.length && stufe >= 1) liste = pflicht;
  if (liste.length === 1) return liste[0];
  if (zufall() < [0.7, 0.25, 0, 0][stufe]) return liste[(zufall()*liste.length)|0];
  var best = null, bw = -1e9;
  liste.forEach(function(z){
    var w = zugWert(fig, p, z, kx, stufe);
    if (w > bw){ bw = w; best = z; }
  });
  return best;
}

/* ==================================================================

var G = { fig:null, dran:0, versuche:1, wurf:0, phase:'aus', zuege:[], laeuft:false,

          sitze:['mensch','teddy','teddy','teddy'], namen:['','','',''], meldung:'' };

function istTeddy(p){ return G.sitze[p] === 'teddy'; }

function anzahl(sitze, art){ return sitze.filter(function(s){ return s === art; }).length; }
/* Menschen heißen, wie sie sich eingetragen haben. Ohne Namen heißt ein

function name(p){

}

}

/* Weiter unten Stehendes verdeckt weiter oben Stehendes */

      });
      aus.push({ p:q, i:i, z:z });

}
/* Abstand zur Figur - mit Zughilfe auch zu ihrem Ziel */
function abstandZu(f, x, y){
  var a = figPos[f.p][f.i], d = Math.hypot(a[0]-x, a[1]-1.5-y);
  if (!cfg.vorschau || !f.z) return d;
  var b = feldXY(f.z.p, f.z.i, f.z.nach);
  return Math.min(d, Math.hypot(b[0]-x, b[1]-y));
}
/* Figuren im Haus zählen als ein Kandidat */
function kandidaten(liste, x, y, radius){
  var aus = [], gesehen = {};
  liste.map(function(f){ return { f:f, d:abstandZu(f, x, y) }; })
    .filter(function(k){ return k.d < radius; })
    .sort(function(a, b){ return a.d - b.d; })
    .forEach(function(k){
      var key = G.fig[k.f.p][k.f.i] === -1 ? 'haus'+k.f.p : k.f.p+'-'+k.f.i;
      if (!gesehen[key]){ gesehen[key] = 1; aus.push(k.f); }
    });
  return aus;
}

/* ---------- Aufteilung: Brett und Schale ---------- */
function aufteilen(){
  var B = $main.clientWidth, H = $main.clientHeight, rand = 10, brett, sw, sh, bx, by, sx, sy;
  if (H >= B * 1.15){
    var minSchale = Math.max(120, Math.min(210, H*.26));
    brett = Math.max(160, Math.min(B - 2*rand, H - minSchale - 3*rand));
    sw = Math.min(B - 2*rand, brett); sh = Math.min(H - brett - 3*rand, sw*.75);
    var gesamt = brett + rand + sh;
    bx = (B - brett)/2; by = (H - gesamt)/2; sx = (B - sw)/2; sy = by + brett + rand;
  } else {
    var minBreite = Math.max(140, Math.min(260, B*.28));
    brett = Math.max(160, Math.min(H - 2*rand, B - minBreite - 3*rand));
    sw = Math.min(B - brett - 3*rand, brett*.8); sh = Math.min(H - 2*rand, brett);
    var gb = brett + rand + sw;
    bx = (B - gb)/2; by = (H - brett)/2; sx = bx + brett + rand; sy = (H - sh)/2;
  }
  $brett.style.cssText = 'left:'+bx+'px;top:'+by+'px;width:'+brett+'px;height:'+brett+'px;';
  $schale.style.left = sx+'px'; $schale.style.top = sy+'px';
  $schale.style.width = sw+'px'; $schale.style.height = sh+'px';
  var innenB = sw - 8, innenH = sh - 8;
  var wuerfelPx = Math.round(Math.max(36, Math.min(66, Math.min(innenB, innenH)/3.6)));
  pxProEinheit = wuerfelPx/2;
  document.documentElement.style.setProperty('--wuerfel', wuerfelPx+'px');
  W.breite = innenB/pxProEinheit; W.tiefe = innenH/pxProEinheit;
  W.p[0] = Math.max(1, Math.min(W.breite-1, W.p[0]));
  W.p[1] = Math.max(1, Math.min(W.tiefe-1, W.p[1]));
  wuerfelZeigen();
}
beiGroessenwechsel(aufteilen);

    h += '<tr'+(gewinner.indexOf(p) >= 0 ? ' class="me"' : '')+'><td>'+esc(name(p))+'</td><td class="n">'+imZiel(G.fig,p)+' im Ziel</td></tr>';
  h += '</table><p style="font-size:13px;opacity:.75;margin-top:8px;">Bilanz: Menschen '+b.mensch+' &middot; Teddys '+b.teddy+'</p>';
  h += '<div class="row"><button class="btn go" data-act="los"><span class="ico">&#9654;</span>Nochmal</button>'+
       '<button class="btn" data-act="neu">Mitspieler</button>'+eckeKnopf()+'</div>';
  auf(h);
  ton(mensch ? 720 : 240, mensch ? .12 : .2, mensch ? 'triangle' : 'square');
}
